<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#2563EB"/>
<meta name="nexbyte-repair-layer" content="4.1"/>
<meta name="description" content="NEXBYTE — your personal academic workspace, available online and offline."/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<link rel="manifest" href="./manifest.webmanifest"/>
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png"/>
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png"/>
<link rel="apple-touch-icon" href="./icon-192.png"/>
<title>NEXBYTE — Academic Collaboration Environment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   NEXBYTE — 3-COLOR BACKGROUND PALETTE
   1) Neutral base  (--bg / --shell)
   2) Surface       (--card)
   3) Brand primary (--primary)
   ============================================================ */
:root{
  --bg:#EDF1F6;
  --shell:#E2E7EE;
  --card:#FFFFFF;
  --primary:#2563EB;
  --primary-press:#1D4ED8;
  --on-primary:#FFFFFF;
  --primary-text:#1D4ED8;
  --primary-soft:color-mix(in srgb,var(--primary) 12%,transparent);

  --fg:#0B1220;
  --muted:#E4EAF1;
  --secondary:#E4EAF1;
  --muted-fg:#516078;
  --border:#D7DFE9;
  --destructive:#B91C1C;

  --ok:#0E7A52;
  --warn:#92400E;

  --purple:#2563EB; --teal:#0E7A52; --amber:#92400E; --coral:#B91C1C; --mint:#0E7A52;

  --shadow-sm:0 1px 2px rgba(11,18,32,.06);
  --shadow-md:0 6px 20px rgba(11,18,32,.10);
  --shadow-lg:0 16px 40px rgba(11,18,32,.16);
}
html.dark{
  --bg:#0A0F16;
  --shell:#05080D;
  --card:#131A24;
  --primary:#3B82F6;
  --primary-press:#2563EB;
  --on-primary:#0A0F16;
  --primary-text:#93B4FF;
  --primary-soft:color-mix(in srgb,var(--primary) 22%,transparent);

  --fg:#E6EDF7;
  --muted:#1A2331;
  --secondary:#1A2331;
  --muted-fg:#9AAABF;
  --border:#20293A;
  --destructive:#FCA5A5;

  --ok:#34D399;
  --warn:#FBBF24;

  --purple:#3B82F6; --teal:#34D399; --amber:#FBBF24; --coral:#FCA5A5; --mint:#34D399;

  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 6px 20px rgba(0,0,0,.5);
  --shadow-lg:0 16px 40px rgba(0,0,0,.6);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--fg);background:var(--shell);font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
h1,h2,h3,h4,.display{font-family:Poppins,Inter,system-ui,sans-serif;line-height:1.25}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
img{max-width:100%}

/* ---------- accessibility ---------- */
.skip-link{
  position:absolute;top:-56px;left:8px;z-index:400;
  padding:12px 18px;border-radius:12px;
  background:var(--primary);color:var(--on-primary);
  font-weight:600;font-size:14px;line-height:1;
  box-shadow:var(--shadow-lg);
  transition:top .2s ease;
}
.skip-link:focus{top:8px;outline:3px solid var(--fg);outline-offset:2px}

:where(button,a,input,textarea,select,[tabindex]):focus-visible{
  outline:3px solid var(--primary);
  outline-offset:2px;
  border-radius:8px;
}
input:focus-visible,textarea:focus-visible,select:focus-visible{
  outline:none;
  border-color:var(--primary);
  box-shadow:0 0 0 3px var(--primary-soft);
}
.visually-hidden{
  position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important;
  }
}
@media (prefers-contrast:more){
  :root{--border:#8A96A8;--muted-fg:#2E3A4D}
  html.dark{--border:#4B5A73;--muted-fg:#C4D1E1}
}

/* ---------- shell ---------- */
.wrap{min-height:100%;display:flex;justify-content:center}
.phone{
  position:relative;width:100%;max-width:430px;height:100vh;height:100dvh;
  background:var(--bg);display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 24px 60px rgba(11,18,32,.18);
}
.main{
  flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  position:relative;min-height:0;outline:none;scroll-behavior:smooth;
  overscroll-behavior:contain;
}
.main::-webkit-scrollbar,.hscroll::-webkit-scrollbar,.split-rail::-webkit-scrollbar,.kanban::-webkit-scrollbar{display:none}
.hscroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity}
.hscroll > *{scroll-snap-align:start}
.pad{padding-left:20px;padding-right:20px}
.pb{padding-bottom:28px}
.pt{padding-top:24px}

/* ---------- utilities ---------- */
.f{display:flex}.fc{display:flex;flex-direction:column}.aic{align-items:center}
.jb{justify-content:space-between}.jc{justify-content:center}.wrapf{flex-wrap:wrap}
.g1{gap:4px}.g2{gap:8px}.g3{gap:12px}.g4{gap:16px}
.grow{flex:1}.minw{min-width:0}
.center{text-align:center}.right{text-align:right}
.mt1{margin-top:4px}.mt2{margin-top:8px}.mt3{margin-top:12px}.mt4{margin-top:16px}.mt5{margin-top:20px}.mt6{margin-top:24px}
.mb1{margin-bottom:4px}.mb2{margin-bottom:8px}.mb3{margin-bottom:12px}.mb4{margin-bottom:16px}
.txs{font-size:11px}.txm{font-size:13px}.txd{font-size:14px}.txl{font-size:16px}.txxl{font-size:20px}.tx2{font-size:24px}
.bold{font-weight:700}.semi{font-weight:600}.med{font-weight:500}
.muted{color:var(--muted-fg)}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pill{border-radius:999px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.hr{height:1px;background:var(--border)}
.hide{display:none!important}

/* ---------- components ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:20px}
.card.padc{padding:16px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:48px;min-height:44px;border-radius:14px;font-weight:600;font-size:14px;
  transition:transform .12s ease,background .15s ease,box-shadow .15s ease;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
.btn:active{transform:scale(.98)}
.btn-lg{height:56px;border-radius:16px}
.btn-sm{height:40px;min-height:40px;border-radius:12px;font-size:13px;padding:0 14px}
.btn-primary{background:var(--primary);color:var(--on-primary);box-shadow:0 8px 20px color-mix(in srgb,var(--primary) 28%,transparent)}
.btn-primary:hover{background:var(--primary-press)}
.btn-secondary{background:var(--secondary);color:var(--fg)}
.btn-secondary:hover{background:var(--muted)}
.btn-danger{background:var(--destructive);color:#fff}
.btn-soft-danger{background:color-mix(in srgb,var(--destructive) 10%,transparent);color:var(--destructive);height:48px;border-radius:14px;width:100%;font-weight:600}
.btn-block{width:100%}
.chip{
  padding:8px 14px;border-radius:999px;border:1px solid var(--border);
  background:var(--card);color:var(--muted-fg);font-size:12px;font-weight:500;
  white-space:nowrap;transition:transform .12s,background .15s;
  min-height:34px;display:inline-flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;
}
.chip:active{transform:scale(.97)}
.chip.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.input{
  width:100%;height:44px;border-radius:12px;border:1px solid var(--border);
  background:var(--card);padding:0 12px;font-size:16px;outline:none;
  transition:border-color .15s,box-shadow .15s;
}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
textarea.input{height:auto;padding:12px;resize:vertical;line-height:1.55}
.field-label{font-size:12px;font-weight:600;color:var(--muted-fg);display:block;margin-bottom:6px}
.field{position:relative;display:flex;align-items:center;border:1px solid var(--border);border-radius:14px;background:var(--card)}
.field:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.field.err{border-color:var(--destructive)}
.field input{flex:1;background:none;border:none;outline:none;font-size:16px;padding:13px 12px 13px 40px;width:100%;min-height:44px}
.field .lead{position:absolute;left:12px;color:var(--muted-fg);pointer-events:none}
.errmsg{font-size:12px;color:var(--destructive);margin-top:6px;margin-left:4px;font-weight:500}
.avatar{border-radius:999px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;flex-shrink:0}
.logo{
  background:var(--primary);display:flex;align-items:center;justify-content:center;
  color:var(--on-primary);box-shadow:0 8px 20px color-mix(in srgb,var(--primary) 30%,transparent);
  border-radius:22px;
}
.searchbar{
  display:flex;align-items:center;gap:8px;height:44px;border-radius:14px;
  background:var(--card);border:1px solid var(--border);padding:0 12px;
  transition:border-color .15s,box-shadow .15s;
}
.searchbar:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.searchbar input{flex:1;background:none;border:none;outline:none;font-size:16px;min-height:42px}
.iconbtn{
  display:flex;align-items:center;justify-content:center;
  height:44px;width:44px;min-height:44px;min-width:44px;
  border-radius:999px;background:var(--muted);color:var(--muted-fg);
  transition:transform .12s,background .15s,color .15s;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
.iconbtn:hover{background:var(--border);color:var(--fg)}
.iconbtn:active{transform:scale(.92)}
.iconbtn.blue{background:var(--primary);color:var(--on-primary)}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;letter-spacing:.02em}
.pri-high{background:transparent;color:var(--destructive);border:1px solid color-mix(in srgb,var(--destructive) 40%,transparent)}
.pri-medium{background:transparent;color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent)}
.pri-low{background:transparent;color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 40%,transparent)}
.bar{height:10px;border-radius:999px;background:var(--muted);overflow:hidden}
.bar>div{height:100%;border-radius:999px;transition:width .7s ease}
.seg{display:flex;background:var(--secondary);border-radius:14px;padding:4px;gap:4px}
.seg button{
  flex:1;height:40px;border-radius:10px;font-size:12px;font-weight:600;
  color:var(--muted-fg);display:flex;align-items:center;justify-content:center;gap:5px;
  transition:background .15s,color .15s;min-height:40px;
  -webkit-tap-highlight-color:transparent;
}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:var(--shadow-sm)}

/* ---------- top app bar ---------- */
.appbar{
  flex-shrink:0;background:var(--card);border-bottom:1px solid var(--border);
  padding:8px 12px;display:flex;align-items:center;gap:6px;
  position:relative;z-index:20;transition:box-shadow .2s;
  min-height:56px;
}
.appbar.scrolled{box-shadow:var(--shadow-md)}
.brand{
  display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:12px;
  -webkit-tap-highlight-color:transparent;min-height:44px;
}
.brand:focus-visible{outline-offset:0}
.brand-name{
  font-family:Poppins,Inter,sans-serif;font-weight:800;font-size:14px;
  letter-spacing:-.01em;color:var(--fg);white-space:nowrap;
}
.streakbadge{
  display:flex;align-items:center;gap:4px;height:28px;padding:0 10px;border-radius:999px;
  background:var(--primary-soft);color:var(--primary-text);font-size:11px;font-weight:700;
  white-space:nowrap;
}
.notif-dot{
  position:absolute;top:10px;right:10px;height:8px;width:8px;border-radius:999px;
  background:var(--destructive);border:1.5px solid var(--card);
}
@media (max-width:360px){
  .brand-name{display:none}
}

/* ---------- bottom navigation ---------- */
.bottomnav{
  flex-shrink:0;background:var(--card);border-top:1px solid var(--border);
  display:grid;grid-template-columns:repeat(7,1fr);
  padding:4px 2px calc(4px + env(safe-area-inset-bottom, 0px));
  position:relative;z-index:20;
}
.bottomnav-item{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;padding:4px 0 6px;min-height:54px;border-radius:12px;
  color:var(--muted-fg);font-size:10px;font-weight:500;text-align:center;
  position:relative;-webkit-tap-highlight-color:transparent;
  transition:color .15s;min-width:0;touch-action:manipulation;
}
.bottomnav-item .bni{
  display:flex;align-items:center;justify-content:center;
  height:26px;min-width:40px;padding:0 8px;border-radius:13px;
  transition:background .15s,color .15s,transform .12s;
}
.bottomnav-item .bnl{
  line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:100%;padding:0 1px;font-size:10px;font-weight:500;
}
.bottomnav-item:active .bni{transform:scale(.88)}
.bottomnav-item.on{color:var(--primary-text);font-weight:600}
.bottomnav-item.on .bni{background:var(--primary-soft);color:var(--primary-text)}
.bottomnav-item:focus-visible{outline:3px solid var(--primary);outline-offset:-2px}
@media (max-width:360px){
  .bottomnav-item{font-size:9px;min-height:50px}
  .bottomnav-item .bni{min-width:34px;padding:0 6px;height:24px}
  .bottomnav-item .bnl{font-size:9px}
}

/* ---------- welcome ---------- */
.welcome{
  position:relative;padding:40px 28px;display:flex;flex-direction:column;overflow:hidden;
  background:radial-gradient(circle at 50% 0%,var(--primary-soft),transparent 62%),var(--bg);
}
.wcontent{position:relative;z-index:1;flex:1;display:flex;flex-direction:column}
.wtop{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.wtitle{font-size:38px;font-weight:800;letter-spacing:-.02em;color:var(--primary);margin-top:22px}
.wtag{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--muted-fg);margin-top:4px}
.wdesc{font-size:15px;color:var(--muted-fg);margin-top:18px;max-width:300px}
.wgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;width:100%;max-width:320px;margin-top:34px}
.wfeat{
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 0;
  border-radius:14px;background:var(--card);border:1px solid var(--border);
}
.wfeat span:first-child{font-size:22px}
.wactions{display:flex;flex-direction:column;gap:12px;padding-top:24px}
.auth-theme{position:absolute;top:26px;right:24px;z-index:40}

/* ---------- dashboard ---------- */
.hero{padding:20px 20px 4px}
.stat{
  display:flex;flex-direction:column;align-items:flex-start;padding:12px;border-radius:14px;
  background:var(--card);border:1px solid var(--border);text-align:left;
  min-height:88px;width:100%;
}
.stat .si{display:flex;align-items:center;justify-content:center;height:32px;width:32px;border-radius:10px;margin-bottom:6px;background:var(--primary-soft);color:var(--primary-text)}
.qbtn{
  display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;
  border-radius:14px;background:var(--card);border:1px solid var(--border);
  transition:border-color .15s,transform .12s;min-height:96px;
  -webkit-tap-highlight-color:transparent;
}
.qbtn:hover{border-color:var(--primary)}
.qbtn:active{transform:scale(.98)}
.qbtn .qi{display:flex;align-items:center;justify-content:center;height:44px;width:44px;border-radius:14px;background:var(--primary-soft);color:var(--primary-text)}
.roomcard{
  min-width:200px;border-radius:20px;padding:16px;text-align:left;
  border:1px solid var(--border);background:var(--card);
  transition:border-color .15s;
}
.roomcard:hover{border-color:var(--primary)}
.actrow{display:flex;align-items:center;gap:12px;padding:8px 0}
.actdot{display:flex;align-items:center;justify-content:center;height:32px;width:32px;border-radius:999px;background:var(--primary-soft);flex-shrink:0}
.actdot i{display:block;height:10px;width:10px;border-radius:999px;background:var(--primary)}
.seeall{font-size:13px;color:var(--primary-text);font-weight:600;display:inline-flex;align-items:center;gap:2px;min-height:44px;padding:0 4px}

/* ---------- focus ring ---------- */
.ring-wrap{position:relative;width:290px;height:290px;max-width:78vw;max-height:78vw}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-time{font-size:52px;font-weight:700;font-variant-numeric:tabular-nums;font-family:Poppins,Inter,sans-serif}
.playbtn{border-radius:999px;color:#fff;display:flex;align-items:center;justify-content:center;transition:transform .12s;-webkit-tap-highlight-color:transparent;touch-action:manipulation;min-height:44px;min-width:44px}
.playbtn:active{transform:scale(.94)}
.modebtn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 0;
  border-radius:14px;border:1px solid var(--border);background:var(--card);
  color:var(--muted-fg);font-size:11px;font-weight:500;min-height:56px;
  -webkit-tap-highlight-color:transparent;
}
.modebtn.on{color:var(--on-primary);border-color:transparent;background:var(--primary)}

/* ---------- subject ---------- */
.subjcard{
  border-radius:20px;padding:16px;border:1px solid var(--border);
  background:var(--card);text-align:left;position:relative;overflow:hidden;
  transition:border-color .15s;
}
.subjcard:hover{border-color:var(--primary)}
.subjcard .accent{position:absolute;left:0;top:0;bottom:0;width:4px}

/* ---------- lists ---------- */
.rowitem{
  display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;
  background:var(--card);border:1px solid var(--border);width:100%;text-align:left;
  min-height:56px;transition:background .15s,border-color .15s;
  -webkit-tap-highlight-color:transparent;
}
button.rowitem:hover{background:var(--secondary)}
.checkbox{
  display:flex;align-items:center;justify-content:center;height:28px;width:28px;min-height:28px;min-width:28px;
  border-radius:999px;border:2px solid var(--border);flex-shrink:0;transition:.15s;
  -webkit-tap-highlight-color:transparent;
}
.checkbox.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:56px 32px}
.empty .em{font-size:46px;margin-bottom:12px}

/* ---------- kanban ---------- */
.kanban{display:flex;gap:12px;overflow-x:auto;padding:0 20px 8px;scrollbar-width:none;align-items:flex-start;scroll-snap-type:x proximity}
.kanban::-webkit-scrollbar{display:none}
.kcol{min-width:250px;max-width:250px;background:var(--secondary);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px;scroll-snap-align:start}
.kcol-head{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 6px}
.kdot{height:8px;width:8px;border-radius:999px;background:var(--primary)}
.kcard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;text-align:left;width:100%;-webkit-tap-highlight-color:transparent;transition:border-color .15s}
.kcard:hover{border-color:var(--primary)}
.kcard:active{transform:scale(.98)}

/* ---------- notes split pane ---------- */
.split{flex:1;display:flex;min-height:0}
.split-rail{width:150px;flex-shrink:0;border-right:1px solid var(--border);background:var(--card);display:flex;flex-direction:column;min-height:0}
.split-rail .rail-scroll{flex:1;overflow-y:auto;scrollbar-width:none}
.rail-item{display:block;width:100%;text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);position:relative;min-height:56px}
.rail-item.on{background:var(--primary-soft)}
.rail-item .stripe{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--primary)}
.split-main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--secondary);color:var(--muted-fg);min-height:28px;-webkit-tap-highlight-color:transparent}
.autosave{font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.autosave.saving{color:var(--warn)}
.autosave.saved{color:var(--ok)}

/* ---------- music ---------- */
.playlist{
  border-radius:20px;padding:16px;text-align:left;border:1px solid var(--border);
  min-width:150px;position:relative;overflow:hidden;background:var(--card);
  transition:border-color .15s;-webkit-tap-highlight-color:transparent;
}
.playlist:hover{border-color:var(--primary)}
.playlist.on{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft)}
.playlist .pcover{height:64px;width:64px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:10px;background:var(--muted)}
.track{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;width:100%;text-align:left;min-height:52px;-webkit-tap-highlight-color:transparent}
.track.on{background:var(--primary-soft)}
.track:hover{background:var(--secondary)}
.track .tnum{width:18px;font-size:11px;color:var(--muted-fg);text-align:center;flex-shrink:0}
.eq{display:flex;align-items:flex-end;gap:2px;height:14px}
.eq i{width:3px;background:var(--primary);border-radius:2px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.15s}.eq i:nth-child(3){animation-delay:.3s}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}
.miniplayer{
  position:sticky;bottom:0;z-index:22;margin:0 16px 8px;border-radius:18px;
  background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow-md);padding:12px;
}

/* ---------- heatmap ---------- */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:11px;height:11px;border-radius:3px;background:var(--muted);display:block}
.hl1{background:color-mix(in srgb,var(--primary) 22%,var(--card))!important}
.hl2{background:color-mix(in srgb,var(--primary) 45%,var(--card))!important}
.hl3{background:color-mix(in srgb,var(--primary) 70%,var(--card))!important}
.hl4{background:var(--primary)!important}
.badgegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.badgecell{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:14px;background:var(--secondary);text-align:center}
.badgecell.locked{opacity:.45;filter:grayscale(1)}
.badgecell span:first-child{font-size:26px}

/* ---------- profile ---------- */
.pgroup{margin-top:24px;padding:0 20px}
.pgroup-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:0 4px;color:var(--muted-fg);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.pgroup-body{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:12px 16px}
.toggle{
  position:relative;height:28px;width:48px;min-height:28px;min-width:48px;
  border-radius:999px;background:var(--border);transition:.2s;flex-shrink:0;
  -webkit-tap-highlight-color:transparent;
}
.toggle.on{background:var(--primary)}
.toggle span{position:absolute;top:4px;left:4px;height:20px;width:20px;border-radius:999px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.toggle.on span{left:24px}
.prow{display:flex;align-items:center;justify-content:space-between;padding:8px 0;gap:12px;min-height:48px}
.arow{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 0;text-align:left;min-height:48px;-webkit-tap-highlight-color:transparent}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fadein .2s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.ov-bg{position:absolute;inset:0;background:rgba(11,18,32,.55);backdrop-filter:blur(3px)}
.ov-sheet{
  position:relative;width:100%;max-width:430px;background:var(--card);
  border-radius:24px 24px 0 0;padding:24px 24px calc(32px + env(safe-area-inset-bottom, 0px));
  box-shadow:0 -10px 40px rgba(11,18,32,.3);max-height:88vh;overflow-y:auto;
  animation:up .28s cubic-bezier(.3,.9,.3,1);
  -webkit-overflow-scrolling:touch;
}
@keyframes up{from{transform:translateY(60px);opacity:.6}to{transform:translateY(0);opacity:1}}
.ov-handle{height:5px;width:40px;border-radius:999px;background:var(--border);margin:0 auto 16px}
.warn-ic{
  height:56px;width:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  margin:0 auto 12px;background:color-mix(in srgb,var(--destructive) 12%,transparent);color:var(--destructive);
}
.warn-ic.blue{background:var(--primary-soft);color:var(--primary-text)}
.swatch{height:44px;width:44px;min-height:44px;min-width:44px;border-radius:999px;-webkit-tap-highlight-color:transparent}
.swatch.on{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--fg)}
.emoji-pick{height:44px;width:44px;min-height:44px;min-width:44px;border-radius:12px;background:var(--secondary);display:flex;align-items:center;justify-content:center;font-size:20px;-webkit-tap-highlight-color:transparent}
.emoji-pick.on{background:var(--primary-soft);box-shadow:0 0 0 2px var(--primary)}

/* search modal */
.search-overlay{position:fixed;inset:0;z-index:150;display:flex;justify-content:center;align-items:flex-start;padding-top:0}
.search-bg{position:absolute;inset:0;background:rgba(11,18,32,.55);backdrop-filter:blur(4px)}
.search-panel{
  position:relative;width:100%;max-width:430px;background:var(--card);
  border-radius:0 0 24px 24px;padding:16px 16px 20px;
  box-shadow:0 20px 50px rgba(11,18,32,.4);animation:down .24s cubic-bezier(.3,.9,.3,1);
  max-height:80vh;display:flex;flex-direction:column;
}
@keyframes down{from{transform:translateY(-30px);opacity:.5}to{transform:translateY(0);opacity:1}}
.sres{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;width:100%;text-align:left;min-height:56px;-webkit-tap-highlight-color:transparent}
.sres:hover{background:var(--secondary)}
.sgroup{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-fg);padding:12px 12px 4px}

/* toast */
.toasts{
  position:fixed;top:16px;left:0;right:0;z-index:300;
  display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;
  padding:0 16px;
}
.toast{
  background:var(--fg);color:var(--bg);font-size:13px;font-weight:500;
  padding:12px 20px;border-radius:12px;box-shadow:var(--shadow-lg);
  transition:opacity .3s,transform .3s;max-width:88vw;text-align:center;
  pointer-events:auto;
}
.toast.out{opacity:0;transform:translateY(-8px)}

/* lock-in fullscreen */
.lockin{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);z-index:40}
.lockin-strict{background:#05070D;color:#E8EEF7}

/* sub-page header */
.hdr{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;
  padding:0 12px;min-height:56px;border-bottom:1px solid var(--border);
  background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);
}
.tabs{display:flex;border-bottom:1px solid var(--border);background:var(--card);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:1;min-width:64px;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:10px 4px;font-size:11px;font-weight:500;color:var(--muted-fg);position:relative;
  min-height:52px;-webkit-tap-highlight-color:transparent;
}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--primary-text)}
.tab .underline{position:absolute;bottom:0;height:2px;width:32px;border-radius:999px;background:var(--primary)}

/* ---------- CHAT ---------- */
.msgs{display:flex;flex-direction:column;gap:12px;padding:16px;width:100%}
.msg{display:flex;align-items:flex-end;gap:8px;max-width:85%}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.them{align-self:flex-start}
.msg-content{display:flex;flex-direction:column;min-width:0;flex:1}
.msg.me .msg-content{align-items:flex-end}
.msg.them .msg-content{align-items:flex-start}
.msg-author{font-size:11px;color:var(--muted-fg);margin-bottom:2px;margin-left:4px}
.bubble{padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.4;word-break:break-word;white-space:pre-wrap;max-width:100%}
.msg.them .bubble{background:var(--card);border:1px solid var(--border);border-bottom-left-radius:4px;color:var(--fg)}
.msg.me .bubble{background:var(--primary);color:var(--on-primary);border-bottom-right-radius:4px}
.msg-delete{display:inline-flex;align-items:center;gap:4px;margin-top:3px;padding:3px 0;color:var(--muted);background:transparent;border:0;cursor:pointer}.msg-delete:active{color:var(--destructive)}
.msg-time{font-size:10px;color:var(--muted-fg);margin-top:4px;margin-left:4px;margin-right:4px}
.composer{
  flex-shrink:0;display:flex;align-items:center;gap:8px;
  padding:12px 12px calc(12px + env(safe-area-inset-bottom, 0px));
  border-top:1px solid var(--border);background:var(--card);width:100%;
}
.composer input{
  flex:1;height:44px;min-height:44px;border-radius:999px;background:var(--secondary);border:none;
  outline:none;padding:0 16px;font-size:16px;min-width:0;
}
.composer input:focus{box-shadow:0 0 0 2px var(--primary-soft)}

/* ---------- room collaboration tools ---------- */
.room-tools{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--border);scrollbar-width:none}
.room-tools::-webkit-scrollbar{display:none}
.room-tool{display:flex;align-items:center;gap:6px;white-space:nowrap;padding:9px 12px;border:1px solid var(--border);border-radius:12px;background:var(--secondary);font-size:12px;font-weight:600;min-height:40px}
.room-tool.active{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-text)}
.room-banner{margin:12px 12px 0;padding:12px;border-radius:14px;background:var(--primary-soft);border:1px solid color-mix(in srgb,var(--primary) 30%,transparent)}
.board-wrap{padding:14px;display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto}
.board-canvas-wrap{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;touch-action:none}
#roomBoard{display:block;width:100%;height: min(52vh,420px);touch-action:none;cursor:crosshair;background:#fff}
.board-actions{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  align-items:center;
  width:100%;
  padding:12px;
  flex:0 0 auto;
  overflow:visible;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
}
.board-actions label{grid-column:1;color:var(--fg);font-size:12px;font-weight:700;align-self:center}
.board-actions input[type=color]{
  grid-column:2;
  width:100%;
  height:44px;
  min-height:44px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--card);
  padding:4px;
}
.board-actions .board-action-btn{
  display:inline-flex!important;
  visibility:visible!important;
  opacity:1!important;
  width:100%;
  min-width:0;
  min-height:46px;
  height:auto;
  padding:10px 8px;
  border:1px solid var(--border);
  border-radius:12px;
  color:var(--fg);
  background:var(--secondary);
  font-size:13px;
  font-weight:700;
  line-height:1.25;
  white-space:normal;
  text-align:center;
  justify-content:center;
}
.board-actions .board-action-btn.primary{
  background:var(--primary);
  border-color:var(--primary);
  color:var(--on-primary);
}
.board-actions .board-action-btn:active{transform:scale(.98)}
@media(min-width:520px){.board-actions{grid-template-columns:repeat(4,minmax(0,1fr))}.board-actions label{grid-column:1}.board-actions input[type=color]{grid-column:2;width:100%;}}
.quiz-card{padding:14px;border:1px solid var(--border);border-radius:16px;background:var(--card)}
.quiz-option{width:100%;padding:12px;border:1px solid var(--border);border-radius:12px;text-align:left;margin-top:8px;background:var(--secondary);font-size:13px}
.quiz-option.selected{border-color:var(--primary);background:var(--primary-soft)}
.quiz-option.correct{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--card))}
.room-audio{padding:14px;border:1px solid var(--border);border-radius:14px;background:var(--card)}
.room-audio audio{width:100%;margin-top:10px}
.lockin-room{margin:12px;padding:18px;border-radius:16px;background:#101827;color:#f8fafc;text-align:center}
.lockin-room .lock-clock{font:700 34px Poppins,Inter,sans-serif;letter-spacing:.04em}
.lockin-room p{color:#cbd5e1}
.discussion-hint{padding:9px 12px;background:var(--secondary);font-size:11px;color:var(--muted-fg);border-bottom:1px solid var(--border)}


/* ---------- v3 additions ---------- */
.minibar{flex-shrink:0;position:relative;display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--card);border-top:1px solid var(--border);z-index:19}
.miniprog{position:absolute;left:0;right:0;top:0;height:2px;background:var(--muted)}
.miniprog div{height:100%;background:var(--primary);width:0}
.track-row{display:flex;align-items:center;gap:4px;border-radius:12px}
.track-row.on{background:var(--primary-soft)}
.track-row .track{flex:1;min-width:0;background:none}
input[type=range]{accent-color:var(--primary);width:100%;min-height:28px}
#roomBoard{height:auto!important;aspect-ratio:10/7}
.board-actions.v2{grid-template-columns:repeat(3,minmax(0,1fr))}
.board-actions.v2 input[type=color]{grid-column:auto}
.board-actions.v2 input[type=range]{grid-column:span 2}
.board-actions .board-action-btn.active{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-text)}
.btn-soft-danger.btn{width:100%}

/* App-only additions retained from the uploaded build. */
.btn-google{width:100%;height:52px;border:1px solid var(--border);background:var(--card);color:var(--fg);border-radius:15px;display:flex;align-items:center;justify-content:center;gap:11px;font-weight:600}
.btn-google:active{transform:scale(.98)}
.google-g{font-family:Arial,sans-serif;font-size:20px;font-weight:700;color:#4285F4}
.auth-divider{display:flex;align-items:center;gap:12px;color:var(--muted-fg);font-size:12px}
.auth-divider:before,.auth-divider:after{content:"";height:1px;background:var(--border);flex:1}
.theme-toggle{height:42px;width:42px;background:var(--card);border:1px solid var(--border);color:var(--muted-fg);box-shadow:0 4px 14px rgba(15,23,42,.08)}
.theme-toggle:active{transform:scale(.92)}
.msg-link{display:inline-block;color:#2563eb;text-decoration:underline;overflow-wrap:anywhere}
.poll-card{padding:12px;border:1px solid var(--border);border-radius:14px;background:var(--secondary)}
#nbMediaHost{
  position:fixed;z-index:35;top:-9999px;left:-9999px;width:1px;height:1px;
  overflow:hidden;pointer-events:none;border-radius:16px;background:var(--secondary);
  box-shadow:0 10px 30px rgba(15,23,42,.18);
}
#nbMediaHost.visible{pointer-events:auto}
#nbMediaHost iframe{width:100%;height:100%;border:0;display:block}
#nbMediaHost audio{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.nb-mini{
  position:absolute;left:12px;right:12px;bottom:76px;z-index:55;
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  background:var(--card);border:1px solid var(--border);border-radius:18px;
  box-shadow:0 12px 32px rgba(15,23,42,.22);
  animation:up .28s cubic-bezier(.3,.9,.3,1);
}
.nb-mini .cover{
  height:40px;width:40px;border-radius:12px;
  background:linear-gradient(135deg,#2563EB,#A78BFA);
  color:#fff;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;overflow:hidden;position:relative;
}
.nb-mini .cover .eq{display:flex;align-items:flex-end;gap:2px;height:16px}
.nb-mini .cover .eq i{width:3px;background:#fff;border-radius:2px;animation:eq .9s ease-in-out infinite}
.nb-mini .cover .eq i:nth-child(2){animation-delay:.15s}
.nb-mini .cover .eq i:nth-child(3){animation-delay:.3s}
.nb-mini .info{flex:1;min-width:0}
.nb-mini .title{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nb-mini .sub{font-size:10px;color:var(--muted-fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nb-mini .btn{
  height:36px;width:36px;border-radius:999px;
  background:var(--secondary);color:var(--fg);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.nb-mini .btn.play{background:linear-gradient(135deg,#2563EB,#A78BFA);color:#fff}

function workspaceCacheKey(userId){return 'nexbyte_workspace_cache_'+String(userId||'guest');}
function cacheWorkspaceSnapshot(){
  try{

function restoreWorkspaceSnapshot(userId){
  try{
    var raw=localStorage.getItem(workspaceCacheKey(userId));
    if(!raw)return false;
    var cached=JSON.parse(raw),p=cached&&cached.state;
    if(!p)return false;
    var d=defaultState();
    S=Object.assign(d,p);
    S.auth={isAuthenticated:true,user:Object.assign({},(p.auth&&p.auth.user)||{},{id:userId})};
    S.notifications=Object.assign(d.notifications,p.notifications||{});
    S.settings=Object.assign(d.settings,p.settings||{});
    S.focus=Object.assign(d.focus,p.focus||{});
    S.music=Object.assign(d.music,p.music||{});
    S.music.favorites=Array.isArray(S.music.favorites)?S.music.favorites:[];
    S.music.playlists=Array.isArray(S.music.playlists)?S.music.playlists:[];

  }catch(error){console.warn('Local workspace cache could not be restored:',error);return false;}

async function saveWorkspaceNow(){

    if(typeof navigator!=='undefined'&&!navigator.onLine&&S.auth.user&&S.auth.user.id)return {ok:true,offline:true};

      {user_id:userId,state:payload,updated_at:new Date().toISOString()},

async function loadWorkspace(user){
  S=defaultState();
  S.auth={isAuthenticated:true,user:profileFromUser(user)};
  try{
    var {data,error}=await dbClient.from('user_workspaces').select('state').eq('user_id',user.id).maybeSingle();
    if(error)throw error;
    if(data&&data.state){
      var d=defaultState(),p=data.state;
      S=Object.assign(d,p);
      S.auth={isAuthenticated:true,user:profileFromUser(user)};
      S.notifications=Object.assign(d.notifications,p.notifications||{});
      S.settings=Object.assign(d.settings,p.settings||{});
      S.focus=Object.assign(d.focus,p.focus||{});
      S.music=Object.assign(d.music,p.music||{});
      S.music.favorites=Array.isArray(S.music.favorites)?S.music.favorites:[];
      S.music.playlists=Array.isArray(S.music.playlists)?S.music.playlists:[];
      S.music.playlists.forEach(function(playlist){playlist.ids=Array.isArray(playlist.ids)?playlist.ids:[];});
      if(S.music.active==='local'){S.music.active='none';S.music.playing=false;}
      S.music.volume=Number.isFinite(Number(S.music.volume))?Math.max(0,Math.min(100,Number(S.music.volume))):80;
      if(['off','all','one'].indexOf(S.music.repeat)<0)S.music.repeat='off';
      if(S.music.active!=='local'&&S.music.active!=='youtube')S.music.active='none';
      S.offlineMusic=Array.isArray(p.offlineMusic)?p.offlineMusic:[];
    }
  }catch(e){
    console.error(e);
    if(restoreWorkspaceSnapshot(user.id)){
      toast('Offline mode: showing the last workspace saved on this device. Changes will sync when connected.');
    }else{
      toast('Could not load saved workspace. Check database setup or reconnect.');
    }
  }
  if(!S.auth.user||S.auth.user.id!==user.id)S.auth={isAuthenticated:true,user:profileFromUser(user)};
  cacheWorkspaceSnapshot();
  /* FIX 4: backfill session.date so the heatmap works for older accounts */
  if(Array.isArray(S.sessions)){
    var _todayISO=new Date().toISOString().slice(0,10);
    S.sessions=S.sessions.map(function(s){if(!s.date)s.date=_todayISO;return s;});
  }
  applyTheme();restoreIframes();render();
}

/* ============================================================
   AUTH BOOTSTRAP
   After restoring a session (including the one Supabase sets
   automatically when the OAuth redirect returns), navigate to
   /dashboard instead of leaving the user on /login or /welcome.
   ============================================================ */
async function bootstrapAuth(){
  if(!dbClient){render();return;}
  try{
    var result=await dbClient.auth.getSession();
    if(result.error)throw result.error;
    if(result.data&&result.data.session){
      await loadWorkspace(result.data.session.user);
      if(location.hash==='#/login'||location.hash==='#/welcome'||!location.hash)go('/dashboard');
    }else{
      S=defaultState();
      render();
    }
    dbClient.auth.onAuthStateChange(function(event,session){
      if(event==='SIGNED_OUT'){
        clearTimeout(saveTimer);clearTimeout(SAVE_TIMER);
        S=defaultState();NOTE_DIRTY=false;render();
      }else if(session&&event==='SIGNED_IN'){
        setTimeout(async function(){
          try{
            await loadWorkspace(session.user);
            if(location.hash==='#/login'||location.hash==='#/welcome'||!location.hash)go('/dashboard');
          }catch(e){console.error('Session restore failed',e);toast('Signed in, but the workspace could not be loaded.');}
        },0);
      }
    });
  }catch(e){
    console.error('Authentication bootstrap failed',e);
    toast('Could not restore your session. Please refresh or sign in again.');
    render();
  }
}

var MUSIC_DB=null;

var MUSIC_QUEUE=[];
function openMusicDB(){
  return new Promise(function(resolve,reject){
    if(MUSIC_DB)return resolve(MUSIC_DB);
    if(!('indexedDB' in window))return reject(new Error('IndexedDB is unavailable'));
    var req=indexedDB.open('nexbyte_music',2);
    req.onupgradeneeded=function(e){var db=e.target.result;if(!db.objectStoreNames.contains('files'))db.createObjectStore('files',{keyPath:'id'});};
    req.onsuccess=function(e){MUSIC_DB=e.target.result;resolve(MUSIC_DB);};
    req.onerror=function(){reject(req.error||new Error('Could not open local music cache'));};
  });
}
function dbGet(id){return openMusicDB().then(function(db){return new Promise(function(resolve,reject){var tx=db.transaction('files','readonly'),req=tx.objectStore('files').get(id);req.onsuccess=function(){resolve(req.result||null);};req.onerror=function(){reject(req.error);};});});}
function dbDelete(id){return openMusicDB().then(function(db){return new Promise(function(resolve,reject){var tx=db.transaction('files','readwrite'),req=tx.objectStore('files').delete(id);req.onsuccess=function(){resolve();};req.onerror=function(){reject(req.error);};});});}
function dbPut(record){return openMusicDB().then(function(db){return new Promise(function(resolve,reject){var tx=db.transaction('files','readwrite'),req=tx.objectStore('files').put(record);req.onsuccess=function(){resolve(req.result);};req.onerror=function(){reject(req.error);};});});}
function offlineMusicKey(id){return 'offline_music_'+String(id);}

async function saveOfflineBlob(key,blob,name,mime,kind){

  await dbPut({id:key,blob:blob,name:name||'download',mime:mime||blob.type||'application/octet-stream',kind:kind||'file',savedAt:Date.now(),size:blob.size});
}
async function downloadCloudFile(path,bucketName,name,mime,key,kind){
  await requireMusicUser();
  var result=await dbClient.storage.from(bucketName).createSignedUrl(path,60*60);
  if(result.error)throw result.error;
  var response=await fetch(result.data.signedUrl);
  if(!response.ok)throw new Error('Download failed ('+response.status+').');
  var blob=await response.blob();
  await saveOfflineBlob(key,blob,name,mime||blob.type,kind);
  return blob.size;
}

async function requireMusicUser(){
  if(!dbClient)throw new Error('Supabase is not configured. Check supabase-config.js.');
  var result=await dbClient.auth.getSession();if(result.error)throw result.error;
  var user=result.data&&result.data.session&&result.data.session.user;

function safeMusicFileName(name){return String(name||'audio').normalize('NFKD').replace(/[^a-zA-Z0-9._-]+/g,'_').replace(/^\.+/,'').slice(-90)||'audio';}
async function uploadMusicBlob(blob,name,mime,id){
  var user=await requireMusicUser();
  if(!blob||!blob.size)throw new Error('The selected audio file is empty.');
  if(blob.size>NB_MUSIC_MAX_BYTES)throw new Error('Each audio file must be 50 MB or smaller.');
  var fileId=id||('m_'+Date.now().toString(36)+'_'+uid());
  var path=user.id+'/'+fileId+'_'+safeMusicFileName(name);
  var bucket=dbClient.storage.from(NB_MUSIC_BUCKET);
  var result=await bucket.upload(path,blob,{upsert:false,contentType:mime||blob.type||'application/octet-stream',cacheControl:'3600'});
  if(result.error)throw result.error;
  return {id:fileId,path:path,userId:user.id};
}

async function migrateLegacyMusicTrack(track){
  if(track.path)return track;
  var old=await dbGet(track.id);
  if(!old||!old.blob)throw new Error('This older track is saved only in the browser that added it. Re-upload the file to save it to your website account.');
  var uploaded=await uploadMusicBlob(old.blob,track.name,track.mime,track.id);
  track.path=uploaded.path;track.userId=uploaded.userId;track.cloud=true;
  await persistMusicState();

async function playLocalMusic(id,fromList){
  var track=musicTrackById(id);if(!track){toast('Track not found in your library.');return;}
  try{
    var user=await requireMusicUser();
    if(!track.path)track=await migrateLegacyMusicTrack(track);
    if(track.userId&&track.userId!==user.id)throw new Error('This track belongs to a different account.');
    if(fromList!==false)MUSIC_QUEUE=currentMusicList().map(function(t){return t.id;});
    if(MUSIC_QUEUE.indexOf(id)<0)MUSIC_QUEUE=S.offlineMusic.map(function(t){return t.id;});
    var cached=await dbGet(offlineMusicKey(track.id)).catch(function(){return null;});
    var url=(cached&&cached.blob)?URL.createObjectURL(cached.blob):await getMusicSignedUrl(track);
    var audio=getAudio();if(!audio)throw new Error('Audio player is not ready. Refresh the page and try again.');
    audio.pause();audio.src=url;audio.load();
    try{await audio.play();}catch(playError){if(url.indexOf('blob:')===0)URL.revokeObjectURL(url);if(playError&&playError.name==='NotAllowedError')throw new Error('Your browser blocked playback. Tap Play again.');throw playError;}
    if(CURRENT_BLOB_URL){URL.revokeObjectURL(CURRENT_BLOB_URL);CURRENT_BLOB_URL=null;}
    if(url.indexOf('blob:')===0)CURRENT_BLOB_URL=url;
    S.music.active='local';S.music.localId=id;S.music.playing=true;save();render();
  }catch(error){console.error('Music playback failed',error);toast('Could not play track: '+(error&&error.message?error.message:'Unknown error'));}
}

async function addOfflineFiles(input){
  var files=Array.prototype.slice.call((input&&input.files)||[]);if(!files.length)return;
  var added=[],uploadedPaths=[];
  try{
    var user=await requireMusicUser();
    for(var i=0;i<files.length;i++){
      var file=files[i],ext=(file.name.split('.').pop()||'').toLowerCase();
      var allowed=/^audio\//i.test(file.type)||['mp3','m4a','aac','wav','ogg','oga','opus','flac','weba','webm','aif','aiff','3gp'].indexOf(ext)>=0;
      if(!allowed){toast('Skipped unsupported file: '+file.name);continue;}
      if(file.size>NB_MUSIC_MAX_BYTES){toast('Skipped '+file.name+': maximum size is 50 MB.');continue;}
      if(S.offlineMusic.some(function(t){return t.name===file.name&&Number(t.size)===file.size;})){toast('Skipped duplicate: '+file.name);continue;}
      var id='m_'+Date.now().toString(36)+'_'+uid();
      toast('Uploading '+file.name+'…');
      var uploaded=await uploadMusicBlob(file,file.name,file.type,id);uploadedPaths.push(uploaded.path);
      var base=file.name.replace(/\.[^.]+$/,'').replace(/_+/g,' ').trim(),artist='Unknown artist',title=base,parts=base.split(' - ');
      if(parts.length>1){artist=parts.shift().trim();title=parts.join(' - ').trim();}
      added.push({id:id,name:file.name,title:title||base,artist:artist,mime:file.type||'application/octet-stream',size:file.size,addedAt:Date.now()+i,path:uploaded.path,userId:user.id,cloud:true});
    }
    if(!added.length){if(input)input.value='';return;}
    S.offlineMusic=S.offlineMusic.concat(added);
    try{await persistMusicState();}catch(saveError){S.offlineMusic=S.offlineMusic.filter(function(t){return added.every(function(a){return a.id!==t.id;});});throw saveError;}
    toast(added.length+' track'+(added.length===1?'':'s')+' saved to your NEXBYTE account.');
  }catch(error){
    console.error('Cloud music upload failed',error);
    if(uploadedPaths.length&&dbClient){try{await dbClient.storage.from(NB_MUSIC_BUCKET).remove(uploadedPaths);}catch(_){} }
    toast('Could not save music: '+(error&&error.message?error.message:'Unknown error')+'. Check the music bucket setup.');
  }finally{if(input)input.value='';render();}
}

function parseMediaUrl(raw){
  try{
    var url=new URL(String(raw||'').trim());if(url.protocol!=='https:')return null;var host=url.hostname.replace(/^www\./,'').toLowerCase();
    var hosts=['youtube.com','music.youtube.com','m.youtube.com','youtu.be','youtube-nocookie.com'];
    if(hosts.indexOf(host)<0)return null;
    var videoId='',listId=url.searchParams.get('list')||'';
    if(host==='youtu.be')videoId=url.pathname.split('/').filter(Boolean)[0]||'';
    else if(url.pathname==='/watch')videoId=url.searchParams.get('v')||'';
    else if(/^\/(shorts|live|embed|v)\//.test(url.pathname))videoId=url.pathname.split('/')[2]||'';
    var embed='';
    if(videoId){if(!/^[A-Za-z0-9_-]{6,20}$/.test(videoId))return null;embed='https://www.youtube.com/embed/'+videoId;}
    else if(listId){embed='https://www.youtube.com/embed/videoseries';}
    else return null;
    var params=['autoplay=1','playsinline=1','rel=0','controls=1','enablejsapi=1'];
    if(listId)params.push('list='+encodeURIComponent(listId));
    if(location.origin&&location.origin!=='null')params.push('origin='+encodeURIComponent(location.origin));
    return {type:'youtube',videoId:videoId,listId:listId,embed:embed+'?'+params.join('&')};
  }catch(error){return null;}
}

function go(path){if(location.hash==='#'+path){render();}else{location.hash='#'+path;}}
function resolve(){
  var parts=(location.hash||'#/welcome').slice(1).split('/').filter(Boolean);
  var a=parts[0]||'welcome',b=parts[1]||null;
  if(a==='study'&&b)return{view:'subject',id:b};
  if(a==='lockin'&&b)return{view:'lockin',id:b};
  if(a==='room'&&b)return{view:'room',id:b};
  return{view:a,id:null};
}
var AUTH_VIEWS=['welcome','login','register'];
var FULLSCREEN=['welcome','login','register','lockin','room'];

function render(){
  var R=resolve();
  if(!S.auth.isAuthenticated&&AUTH_VIEWS.indexOf(R.view)<0){location.hash='#/welcome';return;}
  if(S.auth.isAuthenticated&&AUTH_VIEWS.indexOf(R.view)>=0){location.hash='#/dashboard';return;}
  if(S.auth.isAuthenticated&&LOCK.phase==='running'&&LOCK.running&&LOCK.strict&&subjectById(LOCK.subjectId)&&R.view!=='lockin'&&R.view!=='music'){
    toast('Strict Mode is on — pause or finish your session first');location.hash='#/lockin/'+LOCK.subjectId;return;
  }
  var body,mini='';
  if(FULLSCREEN.indexOf(R.view)>=0){body=viewFor(R);}
  else{
    body='<a class="skip-link" href="#mainScroll">Skip to main content</a>'+ 
      '<header class="appbar" id="appbar" role="banner">'+topBar(R.view)+'</header>'+ 
      '<main class="main" id="mainScroll" tabindex="-1" role="main">'+viewFor(R)+'</main>'+
      bottomNav(R.view);
    if(S.music.active!=='none'&&R.view!=='music')mini=miniPlayerHtml();
  }
  document.getElementById('app').innerHTML='<div class="wrap"><div class="phone">'+body+mini+'</div></div>';
  afterRender(R);updateMusicUI();
}

async function doGoogleLogin(){
  if(!dbClient){toast('Setup required: configure Supabase first.');return;}
  if(window.location.protocol==='file:'){toast('Google sign-in needs HTTPS or localhost.');return;}
  try{
    var result=await dbClient.auth.signInWithOAuth({
      provider:'google',
      options:{
        redirectTo:window.location.origin+window.location.pathname,
        queryParams:{prompt:'select_account'}
      }
    });
    if(result.error)toast('Google sign-in failed: '+result.error.message);
  }catch(err){
    toast('Google sign-in failed: '+(err&&err.message?err.message:'Please try again.'));
  }
}

async function doLogin(){
  var email=(document.getElementById('lgEmail')||{}).value||'';
  var pw=(document.getElementById('lgPw')||{}).value||'';
  email=email.trim();
  var e={};
  if(!email)e.email='Email is required';else if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))e.email='Enter a valid email';
  if(!pw)e.password='Password is required';
  UI.loginErr=e;if(Object.keys(e).length){render();return;}
  if(!dbClient){toast('Setup required: configure Supabase first.');return;}
  try{
    var r=await dbClient.auth.signInWithPassword({email:email,password:pw});
    if(r.error){UI.loginErr={password:r.error.message||'Could not sign in.'};render();return;}
    await loadWorkspace(r.data.user);
    toast('Signed in successfully');go('/dashboard');
  }catch(err){
    console.error('Login failed',err);
    UI.loginErr={password:'Unable to sign in right now. Check your connection and try again.'};
    render();
  }
}
async function doRegister(){
  var name=((document.getElementById('rgName')||{}).value||'').trim();
  var email=((document.getElementById('rgEmail')||{}).value||'').trim();
  var pw=(document.getElementById('rgPw')||{}).value||'';
  var cf=(document.getElementById('rgCf')||{}).value||'';
  var e={};
  if(!name)e.name='Full name is required';
  if(!email)e.email='Email is required';else if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))e.email='Enter a valid email';
  if(!pw||pw.length<8)e.password='Use at least 8 characters';
  if(cf!==pw)e.confirm='Passwords do not match';
  UI.regErr=e;if(Object.keys(e).length){render();return;}
  if(!dbClient){toast('Setup required: configure Supabase first.');return;}
  try{
    var r=await dbClient.auth.signUp({email:email,password:pw,options:{data:{full_name:name}}});
    if(r.error){UI.regErr={email:r.error.message||'Could not create account.'};render();return;}
    if(r.data.session&&r.data.user){await loadWorkspace(r.data.user);toast('Account created');go('/dashboard');}
    else{toast('Check your email to confirm your account, then log in.');go('/login');}
  }catch(err){
    console.error('Registration failed',err);
    UI.regErr={email:'Unable to register right now. Check your connection and try again.'};
    render();
  }
}

function subjectById(id){return S.subjects.filter(function(s){return s.id===id;})[0];}
function fmtTime(s){var m=Math.floor(s/60),x=s%60;return (m<10?'0':'')+m+':'+(x<10?'0':'')+x;}
function fmtHours(sec){var h=Math.floor(sec/3600),m=Math.round((sec%3600)/60);return h+'h '+(m<10?'0':'')+m+'m';}
function todayISO(){return new Date().toISOString().slice(0,10);}
function dueLabel(d){var today=todayISO();var t=new Date(today+'T00:00:00'),x=new Date(d+'T00:00:00');var diff=Math.round((x-t)/86400000);if(diff<0)return{text:Math.abs(diff)+'d overdue',over:true};if(diff===0)return{text:'Due today',over:false,today:true};if(diff===1)return{text:'Due tomorrow',over:false};if(diff<=7)return{text:'Due in '+diff+'d',over:false};return{text:x.toLocaleDateString('en-US',{month:'short',day:'numeric'}),over:false};}
function taskCounts(){var today=todayISO();return{all:S.tasks.length,todo:S.tasks.filter(function(t){return t.status==='todo';}).length,progress:S.tasks.filter(function(t){return t.status==='progress';}).length,done:S.tasks.filter(function(t){return t.status==='done';}).length,dueToday:S.tasks.filter(function(t){return t.status!=='done'&&t.dueDate===today;}).length,week:S.tasks.filter(function(t){var d=new Date(t.dueDate+'T00:00:00');var n=new Date();var diff=(d-n)/86400000;return t.status!=='done'&&diff>=0&&diff<=7;}).length,overdue:S.tasks.filter(function(t){return t.status!=='done'&&t.dueDate<today;}).length};}

/* FIX 3: heatmap driven by real session data */
function heatCells(n){
  var byDay={};
  (S.sessions||[]).forEach(function(s){
    if(!s.date||!s.seconds)return;
    byDay[s.date]=(byDay[s.date]||0)+s.seconds;
  });
  var out='';
  var today=new Date();
  for(var i=n-1;i>=0;i--){
    var d=new Date(today);
    d.setDate(today.getDate()-i);
    var iso=d.toISOString().slice(0,10);
    var sec=byDay[iso]||0;
    var lv=sec===0?0:sec<900?1:sec<1800?2:sec<3600?3:4;
    out+='<i class="'+(lv?'hl'+lv:'')+'" title="'+iso+' · '+Math.round(sec/60)+' min"></i>';
  }
  return out;
}

function vDashboard(){
  var u=S.auth.user||{};
  var joined=S.rooms.filter(function(r){return r.isJoined;});
  var counts=taskCounts();
  var todayMin=Math.round(S.sessions.filter(function(s){return s.date===todayISO();}).reduce(function(a,s){return a+s.seconds;},0)/60);
  var goal=120,pct=Math.min(100,Math.round(todayMin/goal*100));

  h+='</div>';
  h+='<div class="pad mt5"><div class="f jb aic mb3"><h2 class="txm semi">Upcoming tasks</h2><button class="seeall" onclick="go(\'/tasks\')">See all '+ic('chevR',14)+'</button></div>';

function quickAction(icon,color,label,fn){return '<button class="qbtn" onclick="'+fn+'"><span class="qi" style="background:'+color+'15;color:'+color+'">'+ic(icon,20)+'</span><span class="txs med">'+label+'</span></button>';}
function statCard(icon,color,value,label,to){return '<button class="stat" onclick="go(\''+to+'\')"><span class="si" style="background:'+color+'15;color:'+color+'">'+ic(icon,16)+'</span><span class="txl bold">'+value+'</span><span class="txs muted mt1">'+label+'</span></button>';}
function cycleTask(id){var t=S.tasks.filter(function(x){return x.id===id;})[0];if(!t)return;t.status=t.status==='todo'?'progress':t.status==='progress'?'done':'todo';if(t.status==='done'){logActivity('Completed "'+t.title+'"','#2DD4BF');}save();render();toast(t.status==='done'?'Task completed ✅':'Task moved to '+t.status);}
function logActivity(text,color){S.activities.unshift({id:uid(),text:text,time:'Just now',color:color||'#2563EB'});S.activities=S.activities.slice(0,20);}
function openPlanDay(){

function subjectCards(){

function filterSubjects(q){q=q.toLowerCase();var el=document.getElementById('subjectList');if(!el)return;var all=S.subjects;S.subjects=all.filter(function(s){return (s.code+' '+s.name+' '+s.professor).toLowerCase().indexOf(q)>=0;});el.innerHTML=subjectCards();S.subjects=all;}

function roomMessageHtml(m){
  if(m.kind==='link'||m.kind==='file')return '<p>'+esc(m.text||'')+'</p><a class="msg-link" href="'+esc(m.url||m.text||'#')+'" target="_blank" rel="noopener noreferrer">'+esc(m.url||m.text||'Open link')+'</a>';

  if(m.kind==='poll'){var opts=m.options||[];return '<div class="poll-card"><p class="semi">📊 '+esc(m.question||'Poll')+'</p>'+opts.map(function(o,i){var n=(m.votes&&m.votes[i])||0;return '<button class="rowitem mt1" onclick="voteRoomPoll(\''+m.id+'\','+i+')"><span class="grow">'+esc(o)+'</span><span class="badge">'+n+'</span></button>';}).join('')+'</div>';}
  return esc(m.text||'');
}
function shareRoomLink(id){var url=prompt('Paste the link to share:');if(!url)return;try{var u=new URL(url);if(!['http:','https:'].includes(u.protocol))throw 0;}catch(e){toast('Please enter a valid http/https link.');return;}pushRoomMessage(id,{kind:'link',text:'Shared link',url:url});}
function shareRoomFileLink(id){var url=prompt('Paste a share link for your file:');if(!url)return;try{var u=new URL(url);if(!['http:','https:'].includes(u.protocol))throw 0;}catch(e){toast('Please enter a valid http/https file link.');return;}pushRoomMessage(id,{kind:'file',text:'📎 Shared file',url:url});}
function pickRoomSticker(id){var choices=['😀','😂','🥹','🔥','💯','🎉','💪','📚','❤️','👏','👍','🤔','✨','😭','☕','🧠'];var choice=prompt('Choose a sticker by number:\n'+choices.map(function(x,i){return (i+1)+'. '+x;}).join('   '));var n=parseInt(choice,10);if(n>0&&n<=choices.length)pushRoomMessage(id,{kind:'sticker',text:choices[n-1]});}
function createRoomPoll(id){var question=prompt('Poll question:');if(!question)return;var raw=prompt('Enter 2–6 options separated by commas:');if(!raw)return;var options=raw.split(',').map(function(x){return x.trim();}).filter(Boolean).slice(0,6);if(options.length<2){toast('A poll needs at least two options.');return;}pushRoomMessage(id,{kind:'poll',question:question,options:options,votes:options.map(function(){return 0;})});}
function voteRoomPoll(messageId,index){var R=resolve();if(R.view!=='room'||!R.id)return;var r=S.rooms.filter(function(x){return x.id===R.id;})[0];if(!r)return;var m=r.messages.filter(function(x){return x.id===messageId;})[0];if(!m||m.kind!=='poll'||index<0||index>=m.options.length)return;m.votes=m.votes||m.options.map(function(){return 0;});m.votes[index]=(m.votes[index]||0)+1;save();render();}
async function pushRoomMessage(id,extra){
 var r=S.rooms.filter(function(x){return x.id===id;})[0];if(!r)return;
 var msg=Object.assign({id:uid(),from:S.auth.user.name,initials:S.auth.user.initials,color:S.auth.user.color,time:'Now',me:true},extra||{});
 /* Shared room text messages must be written to Supabase; local workspace saves do not sync them to other members. */
 if(r.isShared){
  if(!dbClient||!nbCurrentUserId()){toast('Sign in again to send a shared message.');return;}
  if(msg.kind!=='text'||!String(msg.text||'').trim()) {toast('Only text messages are synchronized in shared rooms right now.');return;}
  try{
   var out=await dbClient.from('study_room_messages').insert({room_id:r.id,user_id:nbCurrentUserId(),body:String(msg.text).trim()});
   if(out.error)throw out.error;
   await nbLoadMessages(r,true);render();
  }catch(e){console.error('Shared message send failed',e);toast('Message was not sent: '+nbErr(e,'Check study_room_messages permissions.'));}
  return;
 }
 r.messages.push(msg);save();render();
}
function sendRoomMsg(id){var i=document.getElementById('roomMsg');var v=(i.value||'').trim();if(!v)return;pushRoomMessage(id,{kind:'text',text:v});setTimeout(function(){var sc=document.getElementById('scrollArea');if(sc)sc.scrollTop=sc.scrollHeight;},30);}
function saveRoomNote(id){var r=S.rooms.filter(function(x){return x.id===id;})[0];if(!r)return;var v=(document.getElementById('roomNote')||{}).value||'';r.sharedNote=v;save();toast(r.isShared?'Note saved to your workspace only; shared-note sync is not configured yet.':'Room note saved.');}
function toggleRoomTask(rid,tid){var r=S.rooms.filter(function(x){return x.id===rid;})[0];if(!r)return;var t=r.tasks.filter(function(x){return x.id===tid;})[0];if(!t)return;t.done=!t.done;save();render();if(r.isShared)toast('Task changed in your workspace only; shared-task sync is not configured yet.');}
function addRoomTask(rid){var i=document.getElementById('roomTask');var v=(i&&i.value||'').trim();if(!v)return;var r=S.rooms.filter(function(x){return x.id===rid;})[0];if(!r)return;r.tasks.push({id:uid(),text:v,done:false});save();render();if(r.isShared)toast('Task added to your workspace only; shared-task sync is not configured yet.');}
function leaveRoom(id){
 var r=S.rooms.filter(function(x){return x.id===id;})[0];
 if(!r){toast('Room not found.');return;}
 if(r.isShared&&r.ownerId&&String(r.ownerId)===String(nbCurrentUserId())){toast('You are the room owner. Delete the room from the Info tab if you want to close it for everyone.');return;}
 confirmSheet({title:'Leave this room?',message:"You'll need to rejoin to access this shared room again.",confirmLabel:'Leave',onConfirm:async function(){
  try{
   if(r.isShared){
    if(!dbClient||!nbCurrentUserId())throw new Error('Please sign in again before leaving this shared room.');
    var out=await dbClient.from('study_room_members').delete().eq('room_id',r.id).eq('user_id',nbCurrentUserId()).select('room_id');
    if(out.error)throw out.error;
    if(!out.data||!out.data.length)throw new Error('Membership was not removed. Check your Supabase DELETE policy for study_room_members.');
    S.rooms=S.rooms.filter(function(x){return x.id!==r.id;});
    if(NB_SHARED_CHANNEL){dbClient.removeChannel(NB_SHARED_CHANNEL);NB_SHARED_CHANNEL=null;}
    await nbLoadSharedRooms(true);
   }else{
    r.isJoined=false;r.members=r.members.filter(function(m){return m.name!==S.auth.user.name;});save();
   }
   toast('You left \"'+r.name+'\"');go('/rooms');
  }catch(e){console.error(e);toast('Could not leave room: '+nbErr(e,'Check your room membership permissions.'));}
 }});
}

/* ============================================================
   FIX 1: Notes save — keep in-memory note current while typing.
   Auto-save ON  → debounce persistence.
   Auto-save OFF → keep edits in memory, show a manual Save button,
   and warn beforeunload if unsaved. No silent data loss.
   ============================================================ */
var SAVE_TIMER=null;
var NOTE_EDIT_VERSION=0;
function _syncNoteFromDOM(){
  var n=S.notes.filter(function(x){return x.id===UI.activeNoteId;})[0];
  if(!n)return null;
  var t=document.getElementById('noteTitle');
  var c=document.getElementById('noteEditor');
  if(t)n.title=(t.value||'').trim()||'Untitled note';
  if(c)n.content=c.value;
  n.updatedAt='Just now';
  return n;
}
function ensureManualSaveButton(){
  if(document.getElementById('noteSaveBar'))return;
  var host=document.getElementById('saveState');
  if(!host||!host.parentNode)return;
  var btn=document.createElement('button');
  btn.id='noteSaveBar';
  btn.textContent='Save';
  btn.style.cssText='background:#2563EB;color:#fff;height:26px;padding:0 12px;border-radius:999px;font-size:11px;font-weight:600;margin-left:8px;flex-shrink:0';
  btn.onclick=manualSaveNote;
  host.parentNode.appendChild(btn);
}
async function manualSaveNote(){
  var n=_syncNoteFromDOM();if(!n)return;
  var saveVersion=NOTE_EDIT_VERSION;
  var st=document.getElementById('saveState');
  var btn=document.getElementById('noteSaveBar');
  if(st){st.className='autosave saving';st.innerHTML=ic('clock',12)+' Saving…';}
  if(btn){btn.disabled=true;btn.textContent='Saving…';}
  clearTimeout(SAVE_TIMER);
  var result=await saveWorkspaceNow();
  if(!result.ok){
    NOTE_DIRTY=true;
    if(st){st.className='autosave';st.innerHTML=ic('alert',12)+' Save failed';}
    if(btn){btn.disabled=false;btn.textContent='Retry save';}
    toast('Note was not saved to the cloud. Check your connection and retry.');
    return;
  }
  if(saveVersion===NOTE_EDIT_VERSION)NOTE_DIRTY=false;
  if(st){st.className='autosave saved';st.innerHTML=ic('check',12)+' Saved';}
  btn=document.getElementById('noteSaveBar');if(btn)btn.remove();
  var rail=document.getElementById('noteRail');if(rail)rail.innerHTML=railItems(filteredNotes());
  toast('Note saved');
}
function scheduleSave(){
  var n=_syncNoteFromDOM();
  if(!n)return;
  NOTE_EDIT_VERSION++;
  var scheduledVersion=NOTE_EDIT_VERSION;
  NOTE_DIRTY=true;
  var st=document.getElementById('saveState');
  if(!S.settings.autoSave){
    if(st){st.className='autosave';st.innerHTML=ic('edit',12)+' Unsaved changes';}
    ensureManualSaveButton();
    return;
  }
  if(st){st.className='autosave saving';st.innerHTML=ic('clock',12)+' Saving…';}
  clearTimeout(SAVE_TIMER);
  SAVE_TIMER=setTimeout(async function(){
    var again=_syncNoteFromDOM();if(!again)return;
    var result=await saveWorkspaceNow();
    if(!result.ok){
      NOTE_DIRTY=true;
      var failed=document.getElementById('saveState');
      if(failed){failed.className='autosave';failed.innerHTML=ic('alert',12)+' Save failed';}
      ensureManualSaveButton();
      toast('Autosave failed. Your edits are still here; use Save to retry.');
      return;
    }
    if(scheduledVersion===NOTE_EDIT_VERSION)NOTE_DIRTY=false;
    var s2=document.getElementById('saveState');
    if(s2){s2.className='autosave saved';s2.innerHTML=ic('check',12)+' Saved';}
    var btn=document.getElementById('noteSaveBar');if(btn)btn.remove();
    var rail=document.getElementById('noteRail');if(rail)rail.innerHTML=railItems(filteredNotes());
  },700);
}
window.addEventListener('beforeunload',function(e){
  if(!NOTE_DIRTY)return;
  e.preventDefault();e.returnValue='';
});

  var id=uid();S.notes.unshift({id:id,title:'Untitled note',content:'',subjectId:S.subjects[0]?S.subjects[0].id:null,color:'#2563EB',visibility:'personal',tags:[],updatedAt:'Just now'});UI.activeNoteId=id;save();render();setTimeout(function(){var t=document.getElementById('noteTitle');if(t){t.focus();t.select();}},50);
}
