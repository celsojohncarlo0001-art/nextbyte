function importWorkspaceData(){
  var input=document.createElement('input');input.type='file';input.accept='.json,application/json';
  input.onchange=function(){var file=input.files&&input.files[0];if(!file)return;var reader=new FileReader();
    reader.onload=async function(){try{
      var data=JSON.parse(String(reader.result||''));if(!data||data.format!=='NEXBYTE_WORKSPACE'||!data.version)throw new Error('This is not a supported NEXBYTE workspace export.');
      var confirmed=confirm('Import this workspace data? Your current subjects, tasks, notes, and study history will be replaced. Your shared-room memberships and uploaded music files will be preserved.');if(!confirmed)return;
      var keepRooms=S.rooms.slice(),keepMusicFiles=S.offlineMusic.slice(),keepMusic=clone(S.music);
      ['subjects','tasks','notes','activities','sessions','weekly','achievements'].forEach(function(key){if(Array.isArray(data[key]))S[key]=data[key];});
      if(data.focus&&typeof data.focus==='object')S.focus=Object.assign(S.focus,data.focus);
      if(data.settings&&typeof data.settings==='object')S.settings=Object.assign(S.settings,data.settings);
      if(data.notifications&&typeof data.notifications==='object')S.notifications=Object.assign(S.notifications,data.notifications);
      S.rooms=keepRooms;S.offlineMusic=keepMusicFiles;S.music=keepMusic;
      if(data.music&&typeof data.music==='object'){
        S.music.volume=Math.max(0,Math.min(100,Number(data.music.volume)||80));
        S.music.shuffle=!!data.music.shuffle;S.music.repeat=['off','all','one'].indexOf(data.music.repeat)>=0?data.music.repeat:'off';
        S.music.favorites=Array.isArray(data.music.favorites)?data.music.favorites.filter(function(id){return keepMusicFiles.some(function(t){return t.id===id;});}):[];
        S.music.playlists=Array.isArray(data.music.playlists)?data.music.playlists.map(function(p){return {id:String(p.id||uid()),name:String(p.name||'Playlist').slice(0,40),ids:Array.isArray(p.ids)?p.ids.filter(function(id){return keepMusicFiles.some(function(t){return t.id===id;});}):[]};}):[];
        S.music.view='all';
      }
      var saved=await saveWorkspaceNow();if(!saved.ok)throw (saved.error||new Error('Could not save the imported workspace.'));
      applyTheme();render();toast('Workspace data imported successfully.');
    }catch(error){console.error('Workspace import failed',error);toast('Import failed: '+(error&&error.message?error.message:'Invalid file'));}};
    reader.onerror=function(){toast('Could not read the selected JSON file.');};reader.readAsText(file);
  };input.click();
}


/* NEXTBYTE shared study rooms patch: Supabase-backed invite-only rooms and chat. */
var NB_SHARED_PREFIX='nb_shared_';
var NB_SHARED_CHANNEL=null;
function nbErr(e, fallback){return (e&&e.message)||fallback||'Unknown error';}
function nbCurrentUserId(){return S&&S.auth&&S.auth.user&&S.auth.user.id?S.auth.user.id:null;}

/* Resolve the identity from Supabase itself, not only from the UI workspace.
   The workspace can render before its auth state has finished restoring. */
async function nbRequireSupabaseUser(){
 if(!dbClient) throw new Error('Supabase is not configured. Check the project URL and anon key.');
 var result=await dbClient.auth.getSession();
 if(result.error) throw result.error;
 var session=result.data&&result.data.session;
 if(!session||!session.user){
  var userResult=await dbClient.auth.getUser();
  if(userResult.error) throw userResult.error;
  if(!userResult.data||!userResult.data.user) throw new Error('Your sign-in session has expired. Sign in again, then reopen this room.');
  session={user:userResult.data.user};
 }
 var user=session.user;
 if(!S.auth) S.auth={isAuthenticated:true,user:profileFromUser(user)};
 else S.auth={isAuthenticated:true,user:profileFromUser(user)};
 return user;
}
function nbRoomFromRow(row,members){
 var ms=(members||[]).map(function(m){var isMe=m.user_id===nbCurrentUserId();return {userId:m.user_id,name:isMe?(S.auth.user.name||'You'):'Member '+String(m.user_id).slice(0,8),initials:isMe?(S.auth.user.initials||'ME'):'M',color:isMe?(S.auth.user.color||'#2563EB'):'#A78BFA',role:m.role==='owner'?'Host':'Member'};});
 return {id:row.id,name:row.name,subjectTag:row.subject_tag||'Study group',emoji:row.emoji||'📘',color:row.color||'#2563EB',description:row.description||'Invite-only shared study room',isPrivate:true,isShared:true,inviteCode:row.invite_code,ownerId:row.owner_id,maxCapacity:row.max_capacity||8,status:'focus',round:1,timer:0,isJoined:true,members:ms,messages:[],tasks:[],sharedNote:'',polls:[],createdAt:row.created_at};
}
async function nbLoadSharedRooms(silent){
 if(!dbClient||!nbCurrentUserId())return;
 try{
  var mr=await dbClient.from('study_room_members').select('room_id,user_id,role,joined_at').eq('user_id',nbCurrentUserId());
  if(mr.error)throw mr.error;
  var ids=(mr.data||[]).map(function(x){return x.room_id;});
  S.rooms=S.rooms.filter(function(r){return !r.isShared;});
  if(!ids.length){if(!silent)render();return;}
  var rr=await dbClient.from('study_rooms').select('id,name,subject_tag,description,emoji,color,owner_id,invite_code,max_capacity,created_at').in('id',ids);
  if(rr.error)throw rr.error;
  var members=await dbClient.from('study_room_members').select('room_id,user_id,role').in('room_id',ids);
  if(members.error)throw members.error;
  S.rooms=(rr.data||[]).map(function(row){return nbRoomFromRow(row,(members.data||[]).filter(function(m){return m.room_id===row.id;}));}).concat(S.rooms);
  if(!silent)render();
 }catch(e){console.error('Shared room load failed',e);if(!silent)toast('Could not load shared rooms: '+nbErr(e));}
}

function nbParseSharedBody(body){
  if(typeof body!=='string'||body.indexOf('NB_SHARED_V1:')!==0)return {kind:'text',text:body};
  try{return JSON.parse(body.slice(13));}catch(e){return {kind:'text',text:body};}
}
function nbSharedPayload(kind,data){
  return 'NB_SHARED_V1:'+JSON.stringify(Object.assign({kind:kind},data));
}
async function nbPublishRoomNote(roomId){
  var r=S.rooms.filter(function(x){return x.id===roomId;})[0];
  var title=(document.getElementById('sharedNoteTitle')||{}).value||'';
  var text=(document.getElementById('sharedNoteText')||{}).value||'';
  var input=document.getElementById('sharedNoteFile'), file=input&&input.files&&input.files[0], path=null;
  if(!r||!r.isShared||!dbClient||!nbCurrentUserId()){toast('Sign in to share notes in a shared room.');return;}
  if(!title.trim()||!text.trim()){toast('Enter a title and note content first.');return;}
  if(file&&file.size>20*1024*1024){toast('Attachments must be 20 MB or smaller.');return;}
  try{
    if(file){
      path=r.id+'/'+nbCurrentUserId()+'/'+Date.now()+'_'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
      var up=await dbClient.storage.from('study-room-files').upload(path,file,{upsert:false,contentType:file.type||'application/octet-stream'});
      if(up.error)throw up.error;
    }
    var payload={id:uid(),title:title.trim(),text:text.trim(),from:S.auth.user.name||'Member',filePath:path,fileName:file?file.name:null};
    var q=await dbClient.from('study_room_messages').insert({room_id:r.id,user_id:nbCurrentUserId(),body:nbSharedPayload('shared-note',payload)});
    if(q.error){if(path)await dbClient.storage.from('study-room-files').remove([path]);throw q.error;}
    await nbLoadMessages(r,true);render();toast('Note shared with the room.');
  }catch(e){console.error(e);toast('Could not share note: '+nbErr(e,'Check room message and Storage permissions.'));}
}
async function nbCreateRoomTask(roomId){
  var r=S.rooms.filter(function(x){return x.id===roomId;})[0];
  var title=(document.getElementById('sharedTaskTitle')||{}).value||'';
  var due=(document.getElementById('sharedTaskDue')||{}).value||'';
  var details=(document.getElementById('sharedTaskDetails')||{}).value||'';
  if(!r||!r.isShared||!dbClient||!nbCurrentUserId()){toast('Sign in to create shared tasks.');return;}
  if(!title.trim()){toast('Enter a task title first.');return;}
  try{var q=await dbClient.from('study_room_messages').insert({room_id:r.id,user_id:nbCurrentUserId(),body:nbSharedPayload('shared-task',{id:uid(),title:title.trim(),due:due,details:details.trim(),done:false,from:S.auth.user.name||'Member'})});if(q.error)throw q.error;await nbLoadMessages(r,true);render();toast('Task shared with the room.');}
  catch(e){console.error(e);toast('Could not create task: '+nbErr(e,'Check room message permissions.'));}
}
async function nbToggleRoomTask(roomId,taskId){
  var r=S.rooms.filter(function(x){return x.id===roomId;})[0];if(!r)return;
  var t=(r.messages||[]).filter(function(m){return m.kind==='shared-task'&&m.id===taskId;})[0];if(!t)return;
  /* The task is represented by a message row. Update the row by its database ID when available. */
  if(!t.dbId||!dbClient){toast('This task cannot be updated until the room data is refreshed.');return;}
  try{var q=await dbClient.from('study_room_messages').update({body:nbSharedPayload('shared-task',{id:t.id,title:t.title,due:t.due||'',details:t.details||'',done:!t.done,from:t.from||'Member'})}).eq('id',t.dbId).eq('room_id',r.id).select('id').maybeSingle();if(q.error)throw q.error;if(!q.data)throw new Error('No task row was updated. Check the study_room_messages UPDATE policy.');await nbLoadMessages(r,true);render();}
  catch(e){console.error(e);toast('Could not update task: '+nbErr(e,'Check update permissions for room messages.'));}
}
async function nbUploadRoomFile(roomId){
 var input=document.getElementById('roomFileInput');
 var file=input&&input.files&&input.files[0];
 var path=null, uploaded=false;
 try{
  if(!dbClient) throw new Error('Supabase is not configured. Check the project URL and anon key.');
  var user=await nbRequireSupabaseUser();
  var userId=user.id;
  var room=S.rooms.filter(function(x){return String(x.id)===String(roomId);})[0];
  if(!room||!room.isShared) throw new Error('This room is not loaded as a shared room. Refresh the page and reopen it.');
  if(!file) throw new Error('Choose an image or document first.');
  if(file.size===0) throw new Error('The selected file is empty.');
  if(file.size>20*1024*1024) throw new Error('Files must be 20 MB or smaller.');
  if(!dbClient.storage) throw new Error('Supabase Storage is unavailable.');

  /* Confirm membership against Supabase before attempting Storage upload. */
  var membership=await dbClient.from('study_room_members')
    .select('room_id')
    .eq('room_id',room.id)
    .eq('user_id',userId)
    .maybeSingle();
  if(membership.error) throw membership.error;
  if(!membership.data) throw new Error('Your account is not a member of this room. Join the room again using its invite code.');

  var safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,'_').slice(-120)||'upload';
  path=room.id+'/'+userId+'/'+Date.now()+'_'+safeName;
  var bucket=dbClient.storage.from('study-room-files');
  var up=await bucket.upload(path,file,{
    upsert:false,
    contentType:file.type||'application/octet-stream',
    cacheControl:'3600'
  });
  if(up.error) throw up.error;
  uploaded=true;

  var body=nbSharedPayload('shared-file',{
    id:uid(),
    fileName:file.name,
    filePath:path,
    fileType:file.type||'application/octet-stream',
    fileSize:file.size,
    from:S.auth.user.name||user.email||'Member'
  });
  var message=await dbClient.from('study_room_messages')
    .insert({room_id:room.id,user_id:userId,body:body})
    .select('id')
    .single();
  if(message.error) throw message.error;

  await nbLoadMessages(room,true);
  render();
  toast('File uploaded and shared with the room.');
 }catch(e){
  if(uploaded&&path&&dbClient){
    try{await dbClient.storage.from('study-room-files').remove([path]);}
    catch(cleanupError){console.warn('Could not clean up failed upload:',cleanupError);}
  }
  console.error('NEXTBYTE room file upload failed:',e);
  toast('Upload failed: '+nbErr(e,'Check Storage and room-message permissions.'));
 }
}
async function nbOpenRoomFile(roomId,path){
  if(!path||!dbClient||!nbCurrentUserId()){toast('Sign in to open this shared file.');return;}
  if(path.split('/')[0]!==roomId){toast('Invalid room file reference.');return;}
  try{
    var result=await dbClient.storage.from('study-room-files').createSignedUrl(path,60*60);
    if(result.error)throw result.error;
    window.location.href=result.data.signedUrl;
  }catch(e){console.error(e);toast('Could not open file: '+nbErr(e,'Check that you are still a member of this room.'));}
}
async function nbLoadMessages(room,quiet){
 if(!room||!room.isShared||!dbClient)return;
 try{

 h+='<div class="pad mt2"><div class="card padc"><h2 class="txm semi mb2">Join with invite code</h2><p class="txs muted mb2">Ask the room owner for the invite code.</p><div class="f g2"><input id="nbInviteCode" class="input" placeholder="Enter invite code" autocapitalize="characters"/><button class="btn btn-primary" onclick="nbJoinByCode()">Join</button></div></div></div>';

async function openCreateRoom(){if(!dbClient||!nbCurrentUserId()){toast('Sign in with Supabase to create a shared room.');return;}var name=prompt('Room name:');if(!name||!name.trim())return;var subject=prompt('Subject tag (e.g. Math, Science):','Study Group')||'Study Group';var description=prompt('Room description:','Invite-only study room')||'';var capacity=parseInt(prompt('Maximum members (2–100):','8'),10)||8;capacity=Math.max(2,Math.min(100,capacity));var emojis=['📘','🧠','📐','🔬','🎨','🔢','💻','⚛️'];var emoji=prompt('Choose an icon: '+emojis.join(' '),'📘')||'📘';var color='#2563EB';try{var res=await dbClient.from('study_rooms').insert({name:name.trim(),subject_tag:subject.trim(),description:description.trim(),emoji:emoji,color:color,owner_id:nbCurrentUserId(),max_capacity:capacity}).select('id,name,subject_tag,description,emoji,color,owner_id,invite_code,max_capacity,created_at').single();if(res.error)throw res.error;var mem=await dbClient.from('study_room_members').insert({room_id:res.data.id,user_id:nbCurrentUserId(),role:'owner'});if(mem.error){await dbClient.from('study_rooms').delete().eq('id',res.data.id);throw mem.error;}await nbLoadSharedRooms(true);var r=S.rooms.filter(function(x){return x.id===res.data.id;})[0];toast('Room created! Invite code: '+res.data.invite_code);alert('Room created successfully!\n\nInvite code: '+res.data.invite_code+'\n\nShare this code with the other account.');go('/room/'+res.data.id);}catch(e){console.error(e);toast('Could not create shared room: '+nbErr(e,'Check Supabase schema and RLS policies.'));}}

 if(!room){toast('Room not found. Refresh the room list and try again.');return;}

 if(!isOwner){toast('Only the room creator can delete this room.');return;}

 confirmSheet({title:'Delete this room?',message:room.isShared?'This permanently deletes the shared room, its memberships, and all chat messages for everyone. This cannot be undone.':'This removes the room from your personal workspace. This cannot be undone.',confirmLabel:'Delete room',onConfirm:async function(){

   }

 }});

@media (max-width:360px){.nb-room-extra-tab{min-width:60px;font-size:10px}}
  `;
  document.head.appendChild(style);

  var originalVRoom = vRoom;
  var originalRoomTabBody = roomTabBody;
  var originalAfterRender = afterRender;
  var originalPushRoomMessage = pushRoomMessage;
  var originalSendRoomMsg = sendRoomMsg;
  var originalVoteRoomPoll = voteRoomPoll;
  var originalRoomMessageHtml = roomMessageHtml;

  function getRoom(id) {
    return (S.rooms || []).filter(function (room) { return String(room.id) === String(id); })[0] || null;
  }
  function isRoomAdmin(room) {
    return !!(room && room.ownerId && nbCurrentUserId() && String(room.ownerId) === String(nbCurrentUserId()));
  }
  function canDelete(room, item) {
    return !!(item && (item.me || isRoomAdmin(room)));
  }
  function showErr(label, error) {
    console.error(label, error);
    toast(label + ': ' + nbErr(error, 'Please check your connection and room permissions.'));
  }

  /* Re-read all typed room records and retain the actual Supabase author ID. */
  nbLoadMessages = async function (room, quiet) {
    if (!room || !room.isShared || !dbClient) return;
    try {
      var result = await dbClient.from('study_room_messages')
        .select('id,room_id,user_id,body,created_at')
        .eq('room_id', room.id).order('created_at', { ascending: true }).limit(300);
      if (result.error) throw result.error;
      var currentId = nbCurrentUserId();
      room.messages = (result.data || []).map(function (row) {
        var isMe = String(row.user_id) === String(currentId);
        var member = (room.members || []).filter(function (m) { return String(m.userId) === String(row.user_id); })[0];
        var parsed = nbParseSharedBody(row.body);
        var fallbackName = isMe ? ((S.auth.user && S.auth.user.name) || 'You') :
          (member ? member.name : 'Member ' + String(row.user_id || '').slice(0, 8));
        return Object.assign({
          from: fallbackName,
          initials: isMe ? ((S.auth.user && S.auth.user.initials) || 'ME') : (member ? member.initials : 'M'),
          color: isMe ? ((S.auth.user && S.auth.user.color) || '#2563EB') : (member ? member.color : '#64748B')
        }, parsed, {
          dbId: row.id,
          userId: row.user_id,
          time: new Date(row.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          me: isMe
        });
      });

      /* Poll votes are separate rows, so every member can change only their own vote. */
      room.messages.filter(function (m) { return m.kind === 'poll'; }).forEach(function (poll) {
        var votes = room.messages.filter(function (m) { return m.kind === 'shared-poll-vote' && String(m.pollId) === String(poll.id); });
        if (votes.length) {
          poll.votes = (poll.options || []).map(function (_, index) {
            return votes.filter(function (vote) { return Number(vote.choice) === index; }).length;
          });
        } else if (!Array.isArray(poll.votes)) {
          poll.votes = (poll.options || []).map(function () { return 0; });
        }
        var myVote = votes.filter(function (vote) { return String(vote.userId) === String(currentId); })[0];
        poll.myVote = myVote ? Number(myVote.choice) : null;
      });
      if (!quiet) render();
    } catch (error) {
      console.error('Shared room refresh failed', error);
      if (!quiet) toast('Could not refresh room items: ' + nbErr(error));
    }
  };

  async function insertSharedRecord(roomId, kind, data) {
    var room = getRoom(roomId);
    if (!room || !room.isShared) throw new Error('This is not an active shared room.');
    var user = await nbRequireSupabaseUser();
    var body = kind === 'text' ? String((data && data.text) || '').trim() : nbSharedPayload(kind, data || {});
    if (!body) throw new Error('Enter a message first.');
    var result = await dbClient.from('study_room_messages').insert({ room_id: room.id, user_id: user.id, body: body });
    if (result.error) throw result.error;
    await nbLoadMessages(room, true);
    return room;
  }

  /* Use a direct insert for shared text messages. This avoids a send/push recursion bug. */
  sendRoomMsg = async function (roomId) {
    var room = getRoom(roomId);
    if (!room || !room.isShared) return originalSendRoomMsg(roomId);
    var input = document.getElementById('roomMsg');
    var value = (input && input.value || '').trim();
    if (!value) return;
    try {
      await insertSharedRecord(roomId, 'text', { text: value });
      if (input) input.value = '';
      render();
      setTimeout(function () { var area = document.getElementById('scrollArea'); if (area) area.scrollTop = area.scrollHeight; }, 30);
    } catch (error) {
      showErr('Message not sent', error);
    }
  };

  pushRoomMessage = async function (roomId, extra) {
    var room = getRoom(roomId);
    if (!room || !room.isShared) return originalPushRoomMessage(roomId, extra);
    if (!extra || ['text', 'poll', 'sticker', 'link', 'file'].indexOf(extra.kind) < 0) {
      toast('This item cannot be shared in this room.');
      return;
    }
    try {
      var payload = Object.assign({}, extra);
      if (!payload.id) payload.id = uid();
      if (payload.kind === 'text') {
        await insertSharedRecord(roomId, 'text', payload);
      } else {
        await insertSharedRecord(roomId, payload.kind, payload);
      }
      render();
    } catch (error) {
      showErr('Could not share this item', error);
    }
  };

  /* Persist poll votes as their own message rows rather than trying to edit another member's poll. */
  voteRoomPoll = async function (messageId, index) {
    var route = resolve();
    if (route.view !== 'room' || !route.id) return originalVoteRoomPoll(messageId, index);
    var room = getRoom(route.id);
    if (!room || !room.isShared) return originalVoteRoomPoll(messageId, index);
    var poll = (room.messages || []).filter(function (m) { return m.kind === 'poll' && String(m.id) === String(messageId); })[0];
    if (!poll || index < 0 || index >= (poll.options || []).length) return;
    try {
      var user = await nbRequireSupabaseUser();
      var oldVote = (room.messages || []).filter(function (m) {
        return m.kind === 'shared-poll-vote' && String(m.pollId) === String(poll.id) && String(m.userId) === String(user.id);
      })[0];

  async function deleteSharedRecord(roomId, dbId) {
    var room = getRoom(roomId);
    var item = room && (room.messages || []).filter(function (message) { return String(message.dbId) === String(dbId); })[0];
    if (!room || !item || !canDelete(room, item)) {
      toast('Only the author or room owner can delete this shared item.');
      return;
    }
    confirmSheet({
      title: 'Delete this shared item?',
      message: 'It will be removed for everyone in the room.',
      confirmLabel: 'Delete', danger: true,
      onConfirm: async function () {
        try {
          var deleted = await dbClient.from('study_room_messages').delete()
            .eq('id', item.dbId).eq('room_id', room.id).select('id').maybeSingle();
          if (deleted.error) throw deleted.error;
          if (!deleted.data) throw new Error('No item was deleted. Check the room DELETE policy.');
          if (item.filePath) {
            var cleanup = await dbClient.storage.from('study-room-files').remove([item.filePath]);
            if (cleanup.error) console.warn('File cleanup did not complete:', cleanup.error);
          }
          await nbLoadMessages(room, true);
          render();
          toast('Deleted for everyone in the room.');
        } catch (error) { showErr('Could not delete shared item', error); }
      }
    });

  nbOpenRoomFile = async function (roomId, path, download) {

    if (String(path).split('/')[0] !== String(roomId)) { toast('Invalid room file reference.'); return; }
    try {
      var result = await dbClient.storage.from('study-room-files').createSignedUrl(path, 3600, download ? { download: true } : {});
      if (result.error) throw result.error;

      else window.open(result.data.signedUrl, '_blank', 'noopener,noreferrer');

  };

  /* Whiteboard state and drawing tools. Snapshots are kept in memory for undo/redo. */
  var NB_BOARD = window.NB_BOARD || {};
  Object.assign(NB_BOARD, { canvas: null, ctx: null, roomId: null, drawing: false, start: null, base: null,
    color: NB_BOARD.color || '#2563EB', size: NB_BOARD.size || 4, tool: 'pen', undo: [], redo: [], timer: null, saving: false, loading: false });
  window.NB_BOARD = NB_BOARD;

  function boardSnapshot() {
    if (!NB_BOARD.ctx || !NB_BOARD.canvas) return;
    NB_BOARD.undo.push(NB_BOARD.ctx.getImageData(0, 0, NB_BOARD.canvas.width, NB_BOARD.canvas.height));
    if (NB_BOARD.undo.length > 10) NB_BOARD.undo.shift();
    NB_BOARD.redo = [];
  }
  function paintBoardShape(ctx, tool, start, point) {
    ctx.beginPath();
    if (tool === 'line') {
      ctx.moveTo(start.x, start.y); ctx.lineTo(point.x, point.y);
    } else if (tool === 'rect') {
      ctx.rect(start.x, start.y, point.x - start.x, point.y - start.y);
    } else if (tool === 'circle') {
      var dx = point.x - start.x, dy = point.y - start.y;
      ctx.ellipse(start.x + dx / 2, start.y + dy / 2, Math.abs(dx / 2), Math.abs(dy / 2), 0, 0, Math.PI * 2);
    }
    ctx.stroke();
  }
  function mountBoard() {
    var canvas = document.getElementById('nbRoomBoard');
    if (!canvas) return;
    var room = getRoom(resolve().id);
    if (!room || !room.isShared) return;
    NB_BOARD.canvas = canvas; NB_BOARD.ctx = canvas.getContext('2d'); NB_BOARD.roomId = room.id;
    NB_BOARD.undo = []; NB_BOARD.redo = []; NB_BOARD.drawing = false; NB_BOARD.loading = true;
    var ctx = NB_BOARD.ctx;
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    var saved = (room.messages || []).filter(function (m) { return m.kind === 'shared-board'; }).slice(-1)[0];
    function ready() {
      if (NB_BOARD.canvas !== canvas) return;
      NB_BOARD.loading = false;
      NB_BOARD.undo = []; NB_BOARD.redo = []; boardSnapshot();
      canvas.onpointerdown = function (event) {
        if (NB_BOARD.loading) return;
        event.preventDefault();
        try { canvas.setPointerCapture(event.pointerId); } catch (_) {}
        var rect = canvas.getBoundingClientRect();
        NB_BOARD.start = { x: (event.clientX - rect.left) * canvas.width / rect.width, y: (event.clientY - rect.top) * canvas.height / rect.height };
        NB_BOARD.last = NB_BOARD.start;
        NB_BOARD.base = ctx.getImageData(0, 0, canvas.width, canvas.height);
        NB_BOARD.drawing = true;
        if (NB_BOARD.tool === 'pen' || NB_BOARD.tool === 'eraser') {
          ctx.beginPath(); ctx.moveTo(NB_BOARD.start.x, NB_BOARD.start.y);
          ctx.strokeStyle = NB_BOARD.tool === 'eraser' ? '#fff' : NB_BOARD.color;
          ctx.lineWidth = NB_BOARD.tool === 'eraser' ? NB_BOARD.size * 4 : NB_BOARD.size;
          ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineTo(NB_BOARD.start.x + .1, NB_BOARD.start.y + .1); ctx.stroke();
        }
      };
      canvas.onpointermove = function (event) {
        if (!NB_BOARD.drawing) return;
        event.preventDefault();
        var rect = canvas.getBoundingClientRect();
        var point = { x: (event.clientX - rect.left) * canvas.width / rect.width, y: (event.clientY - rect.top) * canvas.height / rect.height };
        ctx.strokeStyle = NB_BOARD.tool === 'eraser' ? '#fff' : NB_BOARD.color;
        ctx.lineWidth = NB_BOARD.tool === 'eraser' ? NB_BOARD.size * 4 : NB_BOARD.size;
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        if (NB_BOARD.tool === 'pen' || NB_BOARD.tool === 'eraser') {
          ctx.beginPath(); ctx.moveTo(NB_BOARD.last.x, NB_BOARD.last.y); ctx.lineTo(point.x, point.y); ctx.stroke();
        } else {
          ctx.putImageData(NB_BOARD.base, 0, 0);
          paintBoardShape(ctx, NB_BOARD.tool, NB_BOARD.start, point);
        }
        NB_BOARD.last = point;
      };
      function finish() {
        if (!NB_BOARD.drawing) return;
        NB_BOARD.drawing = false; NB_BOARD.last = null; boardSnapshot();
        clearTimeout(NB_BOARD.timer);
        NB_BOARD.timer = setTimeout(function () { saveBoard(room.id, true); }, 900);
      }
      canvas.onpointerup = finish; canvas.onpointercancel = finish; canvas.onlostpointercapture = finish;
      canvas.onpointerdown.__nbReady = true;
    }
    if (saved && saved.imageData) {
      var image = new Image();
      image.onload = function () { if (NB_BOARD.canvas !== canvas) return; ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.drawImage(image, 0, 0, canvas.width, canvas.height); ready(); };
      image.onerror = ready;
      image.src = saved.imageData;
    } else ready();
  }

  async function saveBoard(roomId, silent) {
    var room = getRoom(roomId);
    if (!room || !NB_BOARD.canvas || NB_BOARD.roomId !== roomId || NB_BOARD.saving) return;
    NB_BOARD.saving = true;
    try {
      var user = await nbRequireSupabaseUser();
      var imageData = NB_BOARD.canvas.toDataURL('image/jpeg', .62);
      if (imageData.length > 850000) throw new Error('The whiteboard image is too large to save. Reduce the drawing and try again.');
      var previous = (room.messages || []).filter(function (m) { return m.kind === 'shared-board'; }).slice(-1)[0];
      var payload = nbSharedPayload('shared-board', { id: previous ? previous.id : uid(), imageData: imageData, updatedBy: (S.auth.user && S.auth.user.name) || user.email || 'Member' });
      if (previous && previous.dbId && String(previous.userId) === String(user.id)) {
        var update = await dbClient.from('study_room_messages').update({ body: payload })
          .eq('id', previous.dbId).eq('room_id', roomId).select('id').maybeSingle();
        if (update.error) throw update.error;
        if (!update.data) throw new Error('Whiteboard update was not accepted by Supabase.');
      } else {
        var insert = await dbClient.from('study_room_messages').insert({ room_id: roomId, user_id: user.id, body: payload });
        if (insert.error) throw insert.error;
      }
      await nbLoadMessages(room, true);
      if (!silent) toast('Whiteboard saved for everyone in the room.');
    } catch (error) { showErr('Could not save whiteboard', error); }
    finally { NB_BOARD.saving = false; }
  }

  window.nbSetBoardTool = function (tool) {
    if (['pen', 'eraser', 'line', 'rect', 'circle'].indexOf(tool) < 0) return;
    NB_BOARD.tool = tool;
    document.querySelectorAll('[data-nb-tool]').forEach(function (button) {
      button.classList.toggle('active', button.getAttribute('data-nb-tool') === tool);
    });
  };
  window.nbSaveSharedBoard = saveBoard;
  window.nbUndoBoard = function () {
    if (!NB_BOARD.ctx || NB_BOARD.undo.length < 2) { toast('Nothing to undo.'); return; }
    NB_BOARD.redo.push(NB_BOARD.undo.pop());
    NB_BOARD.ctx.putImageData(NB_BOARD.undo[NB_BOARD.undo.length - 1], 0, 0);
    saveBoard(NB_BOARD.roomId, true);
  };
  window.nbRedoBoard = function () {
    if (!NB_BOARD.ctx || !NB_BOARD.redo.length) { toast('Nothing to redo.'); return; }
    var image = NB_BOARD.redo.pop();
    NB_BOARD.ctx.putImageData(image, 0, 0);
    NB_BOARD.undo.push(image);
    saveBoard(NB_BOARD.roomId, true);
  };
  window.nbClearBoard = function (roomId) {
    confirmSheet({ title: 'Clear shared whiteboard?', message: 'This clears the board for everyone in the room.', confirmLabel: 'Clear board', danger: true,
      onConfirm: function () {
        if (!NB_BOARD.ctx || NB_BOARD.roomId !== roomId) return;
        NB_BOARD.ctx.fillStyle = '#fff'; NB_BOARD.ctx.fillRect(0, 0, NB_BOARD.canvas.width, NB_BOARD.canvas.height);
        boardSnapshot(); saveBoard(roomId, false);
      }
    });
  };
  window.nbDownloadBoard = function () {
    if (!NB_BOARD.canvas) return;
    var link = document.createElement('a'); link.href = NB_BOARD.canvas.toDataURL('image/png'); link.download = 'nextbyte-whiteboard.png';
    document.body.appendChild(link); link.click(); link.remove();
  };

    var mine = answers.filter(function (answer) { return String(answer.userId) === String(nbCurrentUserId()); })[0];
    var html = '<div class="nb-room-list"><article class="card padc"><div class="f jb aic"><span class="badge" style="background:var(--primary-soft);color:var(--primary-text)">ROOM QUIZ</span>' +
      (canDelete(room, quiz) ? '<button class="iconbtn" onclick="nbDeleteSharedRecord(\'' + room.id + '\',\'' + quiz.dbId + '\')" aria-label="Delete quiz">' + ic('trash', 16) + '</button>' : '') +
      '</div><h2 class="txl semi mt3">' + esc(quiz.question) + '</h2>';
    (quiz.options || []).forEach(function (option, index) {
      var count = answers.filter(function (answer) { return Number(answer.choice) === index; }).length;
      html += '<button class="nb-quiz-choice' + (mine && Number(mine.choice) === index ? ' selected' : '') + (mine && Number(quiz.correctIndex) === index ? ' correct' : '') + '" ' +
        (mine ? 'disabled' : '') + ' onclick="nbAnswerSharedQuiz(\'' + room.id + '\',\'' + quiz.id + '\',' + index + ')"><span class="grow">' + String.fromCharCode(65 + index) + '. ' + esc(option) + '</span><span class="badge">' + count + '</span></button>';
    });
    html += '<p class="txs muted mt3">' + answers.length + ' response(s) · Published by ' + esc(quiz.from || 'Member') + '</p>';
    if (mine) html += '<div class="nb-quiz-feedback"><p class="txm semi">' + (Number(mine.choice) === Number(quiz.correctIndex) ? 'Correct answer!' : 'Good try — review the correct answer.') + '</p><p class="txs mt1">Correct: ' + esc((quiz.options || [])[Number(quiz.correctIndex)] || '') + '</p>' + (quiz.explanation ? '<p class="txs mt1">' + esc(quiz.explanation) + '</p>' : '') + '</div>';
    html += '</article>';
    if (!compose) html += '<button class="btn btn-secondary btn-block" onclick="UI.nbShowQuizComposer=true;render()">Create another quiz</button>';
    if (compose) html += quizComposer(room.id);
    return html + '</div>';
  }
  window.nbCreateSharedQuiz = async function (roomId) {
    var question = (document.getElementById('nbQuizQuestion') || {}).value || '';
    var rawOptions = (document.getElementById('nbQuizOptions') || {}).value || '';
    var options = rawOptions.split(/\n/).map(function (value) { return value.trim(); }).filter(Boolean).slice(0, 6);
    var correct = Number((document.getElementById('nbQuizCorrect') || {}).value || 1) - 1;
    var explanation = (document.getElementById('nbQuizExplanation') || {}).value || '';
    if (!question.trim()) { toast('Enter a quiz question.'); return; }
    if (options.length < 2) { toast('Add at least two answer choices.'); return; }
    if (!Number.isInteger(correct) || correct < 0 || correct >= options.length) { toast('Choose a valid correct answer number.'); return; }
    try {
      var user = await nbRequireSupabaseUser();
      var inserted = await dbClient.from('study_room_messages').insert({ room_id: roomId, user_id: user.id,
        body: nbSharedPayload('shared-quiz', { id: uid(), question: question.trim(), options: options, correctIndex: correct,
          explanation: explanation.trim(), from: (S.auth.user && S.auth.user.name) || user.email || 'Member' }) });
      if (inserted.error) throw inserted.error;
      var room = getRoom(roomId); UI.nbShowQuizComposer = false;
      await nbLoadMessages(room, true); render(); toast('Quiz shared with the room.');
    } catch (error) { showErr('Could not create quiz', error); }
  };
  window.nbAnswerSharedQuiz = async function (roomId, quizId, choice) {
    var room = getRoom(roomId); if (!room) return;
    var old = (room.messages || []).filter(function (message) { return message.kind === 'shared-quiz-answer' && String(message.quizId) === String(quizId) && String(message.userId) === String(nbCurrentUserId()); })[0];
    try {
      var user = await nbRequireSupabaseUser();
      var body = nbSharedPayload('shared-quiz-answer', { id: old ? old.id : uid(), quizId: quizId, choice: Number(choice) });
      if (old && old.dbId) {
        var update = await dbClient.from('study_room_messages').update({ body: body }).eq('id', old.dbId).eq('room_id', roomId).select('id').maybeSingle();
        if (update.error) throw update.error;
        if (!update.data) throw new Error('Your answer was not saved.');
      } else {
        var insert = await dbClient.from('study_room_messages').insert({ room_id: roomId, user_id: user.id, body: body });
        if (insert.error) throw insert.error;
      }
      await nbLoadMessages(room, true); render();
    } catch (error) { showErr('Could not submit your answer', error); }
  };

  /* Existing files/notes/tasks already use Supabase. Expose safer delete/file controls. */
  window.nbOpenRoomFile = nbOpenRoomFile;

  /* Subscribe to all row changes so edits and deletions update every open room. */
  nbSubscribeRoom = function (room) {
    if (!dbClient || !room || !room.isShared) return;
    if (NB_SHARED_CHANNEL) { try { dbClient.removeChannel(NB_SHARED_CHANNEL); } catch (_) {} }
    NB_SHARED_CHANNEL = dbClient.channel('nb-room-' + room.id)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'study_room_messages', filter: 'room_id=eq.' + room.id }, function () {
        var current = getRoom(room.id);
        if (current) nbLoadMessages(current, true).then(function () {
          var route = resolve(); if (route.view === 'room' && route.id === room.id) render();
        });
      }).subscribe();
  };

  afterRender = function (route) {
    originalAfterRender(route);
    if (route && route.view === 'room' && UI.roomTab === 'board') requestAnimationFrame(mountBoard);
  };

  async function activateCurrentRoom(retries) {
    retries = retries || 0;
    if (!dbClient) return;
    if (!nbCurrentUserId()) { if (retries < 10) setTimeout(function () { activateCurrentRoom(retries + 1); }, 400); return; }
    await nbLoadSharedRooms(true);
    var route = resolve();
    if (route.view !== 'room') return;
    var room = getRoom(route.id);
    if (room && room.isShared) {
      await nbLoadMessages(room, true);
      nbSubscribeRoom(room);
      render();
    }
  }
  window.addEventListener('hashchange', function () { setTimeout(function () { activateCurrentRoom(0); }, 250); });
  if (dbClient && dbClient.auth && typeof dbClient.auth.onAuthStateChange === 'function') {
    dbClient.auth.onAuthStateChange(function (event, session) {
      if ((event === 'SIGNED_IN' || event === 'INITIAL_SESSION') && session && session.user) setTimeout(function () { activateCurrentRoom(0); }, 450);
      if (event === 'SIGNED_OUT' && NB_SHARED_CHANNEL) { dbClient.removeChannel(NB_SHARED_CHANNEL); NB_SHARED_CHANNEL = null; }
    });
  }

  window.nbMountSharedBoard = mountBoard;
  setTimeout(function () { activateCurrentRoom(0); }, 1400);
  render();
})();

/* Installable PWA shell. Private Supabase API responses are never cached by the service worker. */
(function(){
  if('serviceWorker' in navigator && location.protocol!=='file:'){
    window.addEventListener('load',function(){
      navigator.serviceWorker.register('./sw.js').catch(function(error){console.warn('PWA service worker registration failed:',error);});
    });
  }
  var installPrompt=null,installButton=null;
  window.addEventListener('beforeinstallprompt',function(event){
    event.preventDefault();installPrompt=event;
    if(!installButton){
      installButton=document.createElement('button');
      installButton.type='button';installButton.className='btn btn-primary';
      installButton.textContent='Install NEXBYTE';
      installButton.style.cssText='position:fixed;right:16px;bottom:88px;z-index:80;padding:0 16px;box-shadow:var(--shadow-lg)';
      installButton.addEventListener('click',async function(){
        if(!installPrompt)return;
        installPrompt.prompt();
        try{await installPrompt.userChoice;}catch(_){}
        installPrompt=null;
        if(installButton){installButton.remove();installButton=null;}
      });
      document.body.appendChild(installButton);
    }
  });
  window.addEventListener('appinstalled',function(){
    if(installButton){installButton.remove();installButton=null;}
    installPrompt=null;
    if(typeof toast==='function')toast('NEXBYTE installed successfully.');
  });
})();

</script>

<script>
/* NEXTBYTE repair layer v4.0
   Repairs persistence, academic file handling, task detail, shared room submissions,
   richer room quizzes, multi-board whiteboards, music background state and profile UI.
   This layer intentionally reuses the existing HTML application and Supabase client.
*/
(function () {
  'use strict';

  var NB_MAX_FILE_BYTES = 20 * 1024 * 1024;
  var NB_ALLOWED_EXT = ['pdf','doc','docx','ppt','pptx','xls','xlsx','txt','md','csv','png','jpg','jpeg','webp'];
  var NB_UPLOAD_BUSY = Object.create(null);
  var NB_SAVE_QUEUE = Promise.resolve();
  var NB_SAVE_VERSION = 0;
  var NB_CREATE_ROOM_BUSY = false;
  var NB_TASK_RESPONSE_BUSY = Object.create(null);
  var NB_QUIZ_SUBMIT_BUSY = Object.create(null);
  var NB_ROOM_BOARDS = Object.create(null);
  var NB_BOARD_SAVE_TIMER = null;
  var NB_MUSIC_LAST_CLOUD_SAVE = 0;
  var NB_MUSIC_LAST_LOCAL_SAVE = 0;
  var NB_MUSIC_LAST_CACHE_SAVE = 0;

  function nbExt(name) {
    var parts = String(name || '').toLowerCase().split('.');
    return parts.length > 1 ? parts.pop() : '';
  }
  function nbFileAllowed(file) {
    if (!file || !file.name) return { ok: false, message: 'Choose a file first.' };
    if (!file.size) return { ok: false, message: 'The selected file is empty.' };
    if (file.size > NB_MAX_FILE_BYTES) return { ok: false, message: 'Files must be 20 MB or smaller.' };
    if (NB_ALLOWED_EXT.indexOf(nbExt(file.name)) < 0) {
      return { ok: false, message: 'Unsupported file type. Use PDF, DOC/DOCX, PPT/PPTX, XLS/XLSX, TXT, MD, CSV, PNG, JPG or WEBP.' };
    }
    return { ok: true };
  }
  function nbSafeName(name) {
    return String(name || 'file').normalize('NFKD').replace(/[^a-zA-Z0-9._-]+/g, '_').replace(/^\.+/, '').slice(-100) || 'file';
  }
  function nbFileSize(size) {
    return typeof fmtSize === 'function' ? fmtSize(size) : (Math.round(size / 1024) + ' KB');
  }
  function nbUserId() {
    return S && S.auth && S.auth.user && S.auth.user.id ? String(S.auth.user.id) : null;
  }
  function nbProfileName() {
    return (S && S.auth && S.auth.user && S.auth.user.name) || 'Member';
  }
  function nbOpenSignedFile(bucket, path, fileName, download) {
    if (!dbClient || !path) { toast('The file reference is missing.'); return; }
    (async function () {
      try {
        await requireMusicUser();
        var result = await dbClient.storage.from(bucket).createSignedUrl(path, 3600, download ? { download: fileName || true } : {});
        if (result.error) throw result.error;
        var url = result.data && result.data.signedUrl;
        if (!url) throw new Error('Supabase did not return a file link.');
        window.open(url, '_blank', 'noopener,noreferrer');
      } catch (error) {
        console.error('Could not open file', error);
        toast('Could not open file: ' + ((error && error.message) || 'Unknown error'));
      }
    })();
  }
  window.nbOpenRoomFile = async function (roomId, path, download) {
    if (!path || String(path).split('/')[0] !== String(roomId)) { toast('Invalid room file reference.'); return; }
    try {
      await nbRequireSupabaseUser();
      var result = await dbClient.storage.from('study-room-files').createSignedUrl(path, 3600, download ? { download: true } : {});
      if (result.error) throw result.error;
      if (!result.data || !result.data.signedUrl) throw new Error('Supabase did not return a file link.');
      window.open(result.data.signedUrl, '_blank', 'noopener,noreferrer');
    } catch (error) { console.error('Room file open failed:', error); toast('Could not open the shared file: ' + ((error && error.message) || 'Check room membership and file permissions.')); }
  };

  function nbReadWorkspaceCache(userId) {
    try {
      var raw = localStorage.getItem(workspaceCacheKey(userId));
      if (!raw) return null;
      var value = JSON.parse(raw);
      if (!value || !value.state || !value.state.auth || !value.state.auth.user || String(value.state.auth.user.id) !== String(userId)) return null;
      return value;
    } catch (_) { return null; }
  }

  function nbNormalizeWorkspace() {
    var d = defaultState();
    S = Object.assign(d, S || {});
    ['subjects','tasks','notes','rooms','activities','sessions','weekly','offlineMusic'].forEach(function (key) {
      if (!Array.isArray(S[key])) S[key] = [];
    });
    S.notifications = Object.assign({}, d.notifications, S.notifications || {});
    S.settings = Object.assign({}, d.settings, S.settings || {});
    S.focus = Object.assign({}, d.focus, S.focus || {});
    S.music = Object.assign({}, d.music, S.music || {});
    if (!Array.isArray(S.music.favorites)) S.music.favorites = [];
    if (!Array.isArray(S.music.playlists)) S.music.playlists = [];
    S.music.playlists.forEach(function (p) { if (!Array.isArray(p.ids)) p.ids = []; });
    S.music.volume = Math.max(0, Math.min(100, Number(S.music.volume) || 80));
    if (['off','all','one'].indexOf(S.music.repeat) < 0) S.music.repeat = 'off';
    S.subjects.forEach(function (subject) {
      if (!Array.isArray(subject.topics)) subject.topics = [];
      if (!Array.isArray(subject.materials)) subject.materials = [];
      if (!Array.isArray(subject.syllabusFiles)) subject.syllabusFiles = [];
      if (!Number.isFinite(Number(subject.progress))) subject.progress = 0;
      if (!Number.isFinite(Number(subject.loggedSeconds))) subject.loggedSeconds = 0;
    });
    S.tasks.forEach(function (task) {
      if (!task.status) task.status = 'todo';
      if (!task.priority) task.priority = 'medium';
      if (!task.type) task.type = 'Assignment';
      if (!task.createdAt) task.createdAt = new Date().toISOString();
    });
    S.notes.forEach(function (note) { if (!Array.isArray(note.tags)) note.tags = []; });
  }

  /* 1) Reliable cloud save queue + restore local snapshot when the cloud row is absent.
     The source app used fire-and-forget debounced upserts and did not restore the local
     snapshot when SELECT succeeded but returned zero rows. */
  window.saveWorkspaceNow = async function () {
    var version = ++NB_SAVE_VERSION;
    if (typeof cacheWorkspaceSnapshot === 'function') cacheWorkspaceSnapshot();
    if (!dbClient || !nbUserId()) {
      return { ok: false, error: new Error('Sign in and configure Supabase before cloud syncing.') };
    }
    if (typeof navigator !== 'undefined' && navigator.onLine === false) return { ok: true, offline: true };
    var operation = NB_SAVE_QUEUE.catch(function () {}).then(async function () {
      var sessionResult = await dbClient.auth.getSession();
      if (sessionResult.error) throw sessionResult.error;
      var sessionUser = sessionResult.data && sessionResult.data.session && sessionResult.data.session.user;
      if (!sessionUser || String(sessionUser.id) !== String(nbUserId())) throw new Error('Your sign-in session changed. Sign in again to sync.');
      var payload = clone(S);
      payload.auth = { isAuthenticated: true, user: S.auth.user };
      var response = await dbClient.from('user_workspaces').upsert({
        user_id: sessionUser.id,
        state: payload,
        updated_at: new Date().toISOString()
      }, { onConflict: 'user_id' });
      if (response.error) throw response.error;
      return { ok: true, version: version };
    }).catch(function (error) {
      console.error('NEXTBYTE workspace save failed', error);
      if (typeof cacheWorkspaceSnapshot === 'function') cacheWorkspaceSnapshot();
      if (typeof navigator !== 'undefined' && navigator.onLine === false) return { ok: true, offline: true };
      return { ok: false, error: error };
    });
    NB_SAVE_QUEUE = operation;
    return operation;
  };

  window.addEventListener('online', function () {
    if (S && S.auth && S.auth.isAuthenticated && nbUserId()) {
      setTimeout(function () { window.saveWorkspaceNow().then(function (result) { if (!result.ok) console.warn('NEXTBYTE reconnect sync is pending:', result.error); }); }, 300);
    }
  });

  window.save = function () {
    try { localStorage.setItem(KEY, JSON.stringify({ theme: S.theme, settings: S.settings, notifications: S.notifications })); } catch (_) {}
    if (typeof cacheWorkspaceSnapshot === 'function') cacheWorkspaceSnapshot();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async function () {
      var result = await window.saveWorkspaceNow();
      if (!result.ok) toast('Saved on this device, but cloud sync failed: ' + ((result.error && result.error.message) || 'Please retry when online.'));
    }, 450);
  };

  window.loadWorkspace = async function (user) {
    var profile = profileFromUser(user);
    S = defaultState();
    S.auth = { isAuthenticated: true, user: profile };
    var restoredLocal = false;
    var hasCloudRow = false;
    var localNewerThanCloud = false;
    try {
      var response = await dbClient.from('user_workspaces').select('state,updated_at').eq('user_id', user.id).maybeSingle();
      if (response.error) throw response.error;
      if (response.data && response.data.state && typeof response.data.state === 'object') {
        hasCloudRow = true;
        var cacheRecord = nbReadWorkspaceCache(user.id);
        var cacheTime = cacheRecord && Number(cacheRecord.savedAt) || 0;
        var cloudTime = Date.parse(response.data.updated_at || '') || 0;
        // A recent local snapshot may contain edits made while the device was offline.
        // Prefer it only when it is materially newer, then queue a cloud upsert below.
        if (cacheRecord && cacheTime > cloudTime + 5000 && restoreWorkspaceSnapshot(user.id)) {
          restoredLocal = true;
          localNewerThanCloud = true;
          S.auth = { isAuthenticated: true, user: profile };
          nbNormalizeWorkspace();
        } else {
          var remoteState = response.data.state;
          S = Object.assign(defaultState(), remoteState);
          S.auth = { isAuthenticated: true, user: profile };
          nbNormalizeWorkspace();
        }
        // Restore selected track as paused, but never autoplay during sign-in/reload.
        if (S.music.active === 'local' && S.music.localId) S.music.playing = false;
        else if (S.music.active !== 'youtube') { S.music.active = 'none'; S.music.playing = false; }
      }
    } catch (error) {
      console.error('Cloud workspace load failed', error);
      restoredLocal = typeof restoreWorkspaceSnapshot === 'function' && restoreWorkspaceSnapshot(user.id);
      if (!restoredLocal) toast('Could not load your cloud workspace. Check your connection and Supabase setup.');
      else toast('Showing the last saved copy on this device. Cloud sync will retry when online.');
    }
    if (!hasCloudRow && !restoredLocal) {
      restoredLocal = typeof restoreWorkspaceSnapshot === 'function' && restoreWorkspaceSnapshot(user.id);
      if (restoredLocal) toast('Restored this account’s saved copy from this device.');
    }
    S.auth = { isAuthenticated: true, user: profile };
    nbNormalizeWorkspace();
    if (S.music.active === 'local') S.music.playing = false;
    try {
      var lastMusicPosition = JSON.parse(localStorage.getItem('nexbyte_music_position_' + user.id) || 'null');
      if (lastMusicPosition && String(lastMusicPosition.id || '') === String(S.music.localId || '')) {
        S.music.position = Math.max(0, Number(lastMusicPosition.position) || 0);
      }
    } catch (_) {}
    if (Array.isArray(S.sessions)) {
      var today = new Date().toISOString().slice(0, 10);
      S.sessions = S.sessions.map(function (entry) { if (!entry.date) entry.date = today; return entry; });
    }
    if (typeof applyTheme === 'function') applyTheme();
    if (typeof restoreIframes === 'function') restoreIframes();
    if (typeof cacheWorkspaceSnapshot === 'function') cacheWorkspaceSnapshot();
    render();
    // Create the first remote row when this account had only a device-local workspace.
    if (restoredLocal && (!hasCloudRow || localNewerThanCloud)) setTimeout(function () { window.saveWorkspaceNow(); }, 250);
  };

  /* 2) Academic uploads: allowlist, informative instructions, immediate metadata save. */
  window.addMaterial = async function (subjectId) {
    var subject = subjectById(subjectId);
    if (!subject) { toast('Subject not found.'); return; }
    var panel = sheet('<div class="f jb aic mb3"><h3 class="txl semi">Upload study material</h3><button class="iconbtn" data-cancel aria-label="Close">' + ic('x',18) + '</button></div>' +
      '<div class="card padc mb3"><p class="txs semi">What can you upload?</p><p class="txs muted mt1">PDF, Word, PowerPoint, Excel, text/Markdown, CSV, or image files (PNG/JPG/WEBP). Maximum 20 MB per file. Materials are stored privately under this subject and can be opened again from your account.</p></div>' +
      '<div class="fc g3"><div><label class="field-label" for="mtFile">Choose academic file</label><input id="mtFile" class="input" type="file" accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt,.md,.csv,.png,.jpg,.jpeg,.webp" style="height:auto;padding:9px 12px"/></div><div><label class="field-label" for="mtName">Display name (optional)</label><input id="mtName" class="input" placeholder="Defaults to the original file name"/></div><p class="txs muted" id="mtFileHint">Accepted formats only · 20 MB maximum · Private to your account</p><button class="btn btn-primary btn-block" data-save>Upload material</button></div>');
    panel.querySelector('[data-cancel]').onclick = closeTop;
    panel.querySelector('#mtFile').onchange = function () {
      var file = this.files && this.files[0];
      var check = nbFileAllowed(file);
      panel.querySelector('#mtFileHint').textContent = file ? (check.ok ? file.name + ' · ' + nbFileSize(file.size) : check.message) : 'Accepted formats only · 20 MB maximum';
      if (file && !panel.querySelector('#mtName').value) panel.querySelector('#mtName').value = file.name;
    };
    panel.querySelector('[data-save]').onclick = async function () {
      var button = this, file = panel.querySelector('#mtFile').files[0];
      var check = nbFileAllowed(file);
      if (!check.ok) { toast(check.message); return; }
      if (NB_UPLOAD_BUSY[subjectId]) return;
      NB_UPLOAD_BUSY[subjectId] = true; button.disabled = true; button.textContent = 'Uploading…';
      var path = null;
      try {
        var user = await requireMusicUser();
        path = user.id + '/' + subjectId + '/materials/' + Date.now() + '_' + nbSafeName(file.name);
        var upload = await dbClient.storage.from('user-study-files').upload(path, file, { upsert: false, contentType: file.type || 'application/octet-stream', cacheControl: '3600' });
        if (upload.error) throw upload.error;
        if (!Array.isArray(subject.materials)) subject.materials = [];
        subject.materials.unshift({ id: 'mat_' + uid(), n: (panel.querySelector('#mtName').value || '').trim() || file.name, t: nbExt(file.name).toUpperCase(), s: nbFileSize(file.size), path: path, fileName: file.name, mime: file.type || 'application/octet-stream', size: file.size, userId: user.id, addedAt: new Date().toISOString() });
        var saved = await window.saveWorkspaceNow();
        if (!saved.ok) throw saved.error || new Error('The file uploaded, but its subject record could not be saved.');
        closeTop(); render(); toast('Material uploaded and added to this subject.');
      } catch (error) {
        if (path) { try { await dbClient.storage.from('user-study-files').remove([path]); } catch (_) {} }
        console.error('Study material upload failed', error);
        button.disabled = false; button.textContent = 'Retry upload';
        toast('Upload failed: ' + ((error && error.message) || 'Check the user-study-files bucket and its policies.'));
      } finally { delete NB_UPLOAD_BUSY[subjectId]; }
    };
  };

  window.openMaterial = async function (subjectId, index) {
    var subject = subjectById(subjectId), material = subject && subject.materials && subject.materials[index];
    if (!material || !material.path) { toast('This older item has no cloud file attached. Upload the original file again.'); return; }
    try {
      var cached = await dbGet(offlineMaterialKey(material.path)).catch(function () { return null; });
      if (cached && cached.blob) {
        var localUrl = URL.createObjectURL(cached.blob);
        window.open(localUrl, '_blank', 'noopener,noreferrer');
        setTimeout(function () { URL.revokeObjectURL(localUrl); }, 60000);
      } else nbOpenSignedFile('user-study-files', material.path, material.fileName || material.n, false);
    } catch (error) { toast('Could not open material: ' + ((error && error.message) || 'Unknown error')); }
  };

  window.removeMaterial = function (subjectId, index) {
    var subject = subjectById(subjectId), material = subject && subject.materials && subject.materials[index];
    if (!material) return;
    confirmSheet({ title: 'Remove this material?', message: 'The file will be detached from this subject and removed from your private storage.', confirmLabel: 'Remove', danger: true, onConfirm: async function () {
      var previous = subject.materials.slice();
      subject.materials.splice(index, 1);
      var saved = await window.saveWorkspaceNow();
      if (!saved.ok) { subject.materials = previous; cacheWorkspaceSnapshot(); toast('Could not save the removal: ' + ((saved.error && saved.error.message) || 'Unknown error')); render(); return; }
      if (material.path) {
        var removed = await dbClient.storage.from('user-study-files').remove([material.path]);

  /* 7) Multi-question room quiz builder and per-member submissions.

  window.NB_QUIZ_DRAFT = [];

  }
  function nbNormalizeQuizQuestions(quiz) {
    if (Array.isArray(quiz.questions)) return quiz.questions;
    if (quiz.question) return [{ type: 'multiple_choice', question: quiz.question, options: quiz.options || [], correctAnswer: (quiz.options || [])[Number(quiz.correctIndex)] || '', points: 1, explanation: quiz.explanation || '' }];

  function nbRenderQuizzes(room) {
    var quizzes = (room.messages || []).filter(function (item) { return item.kind === 'shared-quiz'; });
    var html = quizzes.map(function (quiz) {
      var questions = nbNormalizeQuizQuestions(quiz);
      var submissions = (room.messages || []).filter(function (item) { return item.kind === 'shared-quiz-answer' && String(item.quizId) === String(quiz.id); });
      var mine = submissions.filter(function (item) { return String(item.userId) === String(nbUserId()); })[0];
      var qhtml = questions.map(function (question, index) {
        var controlId = 'nbQuizAnswer_' + quiz.id + '_' + index;
        var type = question.type || 'multiple_choice';
        var value = mine && Array.isArray(mine.answers) ? (mine.answers[index] || '') : '';

        } else if (type === 'true_false') {

      }).join('');
      var result = mine ? '<div class="nb-quiz-feedback"><p class="txm semi">Submission saved</p><p class="txs muted mt1">Score: ' + Number(mine.score || 0) + ' / ' + Number(mine.maxScore || 0) + (mine.reviewRequired ? ' · Some short answers need review' : '') + '</p></div>' : '<button class="btn btn-primary btn-block mt3" onclick="nbSubmitRoomQuiz(\'' + room.id + '\',\'' + quiz.id + '\')">Submit my answers</button>';
      var deleteButton = (quiz.me || String(room.ownerId) === String(nbUserId())) ? '<button class="iconbtn" onclick="nbDeleteSharedRecord(\'' + room.id + '\',\'' + quiz.dbId + '\')">' + ic('trash',15) + '</button>' : '';
      return '<article class="card padc"><div class="f jb aic"><div><span class="badge">ROOM QUIZ</span><p class="txs muted mt1">' + esc(quiz.from || 'Member') + ' · ' + submissions.length + ' submission(s)</p></div>' + deleteButton + '</div><h3 class="txl semi mt2">' + esc(quiz.title || 'Study quiz') + '</h3><p class="txs muted">' + questions.length + ' item(s)</p>' + qhtml + result + '</article>';
    }).join('');
    return '<div class="nb-room-list">' + (html || '<div class="empty"><p class="txm muted">No quizzes yet. Create a multi-item quiz for room members.</p></div>') + '<button class="btn btn-secondary btn-block" onclick="NB_QUIZ_DRAFT=[{type:\'multiple_choice\',question:\'\',options:\'\',correctAnswer:\'\',points:1,explanation:\'\'}];UI.nbShowQuizComposer=true;render()">' + ic('plus',16) + ' Create another quiz</button>' + (UI.nbShowQuizComposer ? nbQuizBuilder(room.id) : '') + '</div>';
  }
  window.nbPublishRoomQuiz = async function (roomId) {
    if (window.NB_QUIZ_PUBLISH_BUSY) return;
    window.NB_QUIZ_PUBLISH_BUSY = true;
    var room = (S.rooms || []).filter(function (item) { return String(item.id) === String(roomId); })[0];
    if (!room || !room.isShared || !nbUserId()) { window.NB_QUIZ_PUBLISH_BUSY = false; toast('Open a shared room and sign in first.'); return; }
    var questions = NB_QUIZ_DRAFT.map(function (draft) {
      var type = draft.type || 'multiple_choice';
      var options = type === 'multiple_choice' ? String(draft.options || '').split(/\n/).map(function (item) { return item.trim(); }).filter(Boolean).slice(0, 8) : (type === 'true_false' ? ['True','False'] : []);
      return { type: type, question: String(draft.question || '').trim(), options: options, correctAnswer: type === 'true_false' ? (String(draft.correctAnswer || 'True')) : String(draft.correctAnswer || '').trim(), points: Math.max(1, Math.min(100, parseInt(draft.points, 10) || 1)), explanation: String(draft.explanation || '').trim() };

    if (invalid) { window.NB_QUIZ_PUBLISH_BUSY = false; toast('Check the choices and correct answer for each quiz item.'); return; }
    try {
      var user = await nbRequireSupabaseUser();

      var insert = await dbClient.from('study_room_messages').insert({ room_id: room.id, user_id: user.id, body: body });

  window.nbSubmitRoomQuiz = async function (roomId, quizId) {
    var key = roomId + ':' + quizId + ':' + nbUserId(); if (NB_QUIZ_SUBMIT_BUSY[key]) return;
    NB_QUIZ_SUBMIT_BUSY[key] = true;
    try {
      var room = (S.rooms || []).filter(function (item) { return String(item.id) === String(roomId); })[0];
      var quiz = room && (room.messages || []).filter(function (item) { return item.kind === 'shared-quiz' && String(item.id) === String(quizId); })[0];
      if (!room || !quiz) throw new Error('Quiz not found. Refresh the room and try again.');
      var prior = (room.messages || []).filter(function (item) { return item.kind === 'shared-quiz-answer' && String(item.quizId) === String(quizId) && String(item.userId) === String(nbUserId()); })[0];
      if (prior) { toast('You have already submitted this quiz.'); return; }
      var questions = nbNormalizeQuizQuestions(quiz), answers = [], score = 0, maxScore = 0, reviewRequired = false;
      questions.forEach(function (question, index) {
        var id = 'nbQuizAnswer_' + quizId + '_' + index;
        var value = '';
        if (question.type === 'multiple_choice' || question.type === 'true_false') {
          var selected = document.querySelector('input[name="' + id + '"]:checked'); value = selected ? selected.value : '';

        if (!String(value).trim()) throw new Error('Answer item ' + (index + 1) + ' before submitting.');

        }
      });
      var user = await nbRequireSupabaseUser();
      var payload = nbSharedPayload('shared-quiz-answer', { id: uid(), quizId: quizId, userId: user.id, answers: answers, score: score, maxScore: maxScore, reviewRequired: reviewRequired, submitted: true, submittedAt: new Date().toISOString() });

    } catch (error) { console.error(error); toast('Could not submit quiz: ' + ((error && error.message) || 'Unknown error')); }
    finally { delete NB_QUIZ_SUBMIT_BUSY[key]; }
  };

  profileSettings = function () {

    html = html.replace(/<button class="arow" onclick="downloadAppFile\(\)">[\s\S]*?<\/button><div class="hr"><\/div>/, '');
    html = html.replace(/<button class="arow" onclick="clearWorkspace\(\)">[\s\S]*?<\/button><div class="hr"><\/div>/, '');
    return html;
  };

  /* 12) Music: pause on background, keep track/position, and repair missing icon paths. */
  ICONS.shuffle = '<path d="M16 3h5v5"/><path d="M4 7h3c4 0 6 10 10 10h4"/><path d="m17 14 4 3-4 3"/><path d="M4 17h3c1.4 0 2.4-1.1 3.4-2.8M14 7c1 0 2 .2 3 .7"/><path d="m17 3 4 3-4 3"/>';
  ICONS.repeat = '<path d="m17 2 4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="m7 22-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/>';
  ICONS.volume = '<path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>';
  ICONS.heart = '<path d="M20.8 8.8c0 5.5-8.8 11-8.8 11s-8.8-5.5-8.8-11A4.8 4.8 0 0 1 12 6.2a4.8 4.8 0 0 1 8.8 2.6Z"/>';
  ICONS.repeatOne = ICONS.repeat + '<path d="M12 9v6m-1.5-4.5L12 9l1.5 1.5"/>';

  var nbOriginalMusicToggle = musicTogglePlay;
  musicTogglePlay = async function () {
    if (S.music.active !== 'local') return nbOriginalMusicToggle();
    var audio = getAudio();
    if (!audio) { toast('The audio player is not ready. Refresh the app and try again.'); return; }
    if (!audio.getAttribute('src') && S.music.localId) { await playLocalMusic(S.music.localId, false); return; }
    if (audio.paused) {
      try { await audio.play(); S.music.playing = true; save(); updateMusicUI(); }
      catch (error) { toast(error && error.name === 'NotAllowedError' ? 'Tap Play again to allow audio playback.' : 'Could not resume this track.'); }
    } else { audio.pause(); S.music.playing = false; save(); updateMusicUI(); }
  };
  var nbOriginalPlayLocalMusic = playLocalMusic;
  playLocalMusic = async function (id, fromList) {
    var sameTrack = String(S.music.localId || '') === String(id);
    var resumeAt = sameTrack ? Math.max(0, Number(S.music.position || 0)) : 0;
    await nbOriginalPlayLocalMusic(id, fromList);
    var audio = getAudio();
    if (audio && S.music.active === 'local' && String(S.music.localId) === String(id) && resumeAt > 2) {
      try {
        if (!Number.isFinite(audio.duration) || audio.readyState < 1) {
          await new Promise(function (resolve) { audio.addEventListener('loadedmetadata', resolve, { once: true }); setTimeout(resolve, 2500); });
        }
        if (Number.isFinite(audio.duration) && audio.duration > resumeAt) { audio.currentTime = resumeAt; S.music.position = resumeAt; nbSaveMusicPosition(true, true); }
      } catch (_) {}
    }
  };
  function nbSaveMusicPosition(localOnly, force) {
    var audio = getAudio();
    if (audio && S.music.active === 'local' && Number.isFinite(audio.currentTime)) S.music.position = audio.currentTime;
    var now = Date.now();
    if (force || now - NB_MUSIC_LAST_LOCAL_SAVE > 1200) {
      try { localStorage.setItem('nexbyte_music_position_' + (nbUserId() || 'guest'), JSON.stringify({ id: S.music.localId, position: S.music.position || 0, savedAt: now })); } catch (_) {}
      NB_MUSIC_LAST_LOCAL_SAVE = now;
    }
    if (force || now - NB_MUSIC_LAST_CACHE_SAVE > 5000) {
      if (typeof cacheWorkspaceSnapshot === 'function') cacheWorkspaceSnapshot();
      NB_MUSIC_LAST_CACHE_SAVE = now;
    }
    if (!localOnly && (force || now - NB_MUSIC_LAST_CLOUD_SAVE > 20000)) { NB_MUSIC_LAST_CLOUD_SAVE = now; save(); }
  }
  var nbAudio = getAudio();
  if (nbAudio) {
    nbAudio.addEventListener('timeupdate', function () { nbSaveMusicPosition(true, false); });
    nbAudio.addEventListener('play', function () { S.music.playing = true; updateMusicUI(); });
    nbAudio.addEventListener('pause', function () { S.music.playing = false; nbSaveMusicPosition(false, true); updateMusicUI(); });
  }
  function nbPauseEmbeddedYoutube() {
    var frame = document.getElementById('nbYoutube');
    if (!frame || !frame.contentWindow || !frame.src) return;
    try { var origin = new URL(frame.src).origin; frame.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'pauseVideo', args: [] }), origin); } catch (_) {}
  }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      var audio = getAudio();
      if (audio && !audio.paused) { nbSaveMusicPosition(true, true); audio.pause(); S.music.playing = false; save(); }
      if (S.music.active === 'youtube') nbPauseEmbeddedYoutube();
    } else {
      updateMusicUI();
    }
  });
  window.addEventListener('pagehide', function () { nbSaveMusicPosition(true, true); var audio = getAudio(); if (audio && !audio.paused) audio.pause(); if (S.music.active === 'youtube') nbPauseEmbeddedYoutube(); });
  window.addEventListener('pageshow', function () { updateMusicUI(); });

  /* 13) Improve room header/content layout; Info remains in its own tab, never floats over
     the Files/Whiteboard viewport. */
  var nbOriginalVRooms = vRooms;
  vRooms = function () {
    var html = nbOriginalVRooms();
    return html.replace(/<div class="pad mt2"><div class="card padc" style="background:rgba\(251,191,36,.10\);border-color:rgba\(251,191,36,.35\)"><p class="txs" style="color:#b45309;display:flex;gap:6px;align-items:flex-start">[\s\S]*?<\/p><\/div><\/div>/, '');
  };

  var nbOriginalVRoom = vRoom;
  vRoom = function (roomId) {
    var html = nbOriginalVRoom(roomId);
    return html.replace('class="main" style="display:flex;flex-direction:column;width:100%;min-width:0;min-height:0"', 'class="main nb-room-content" style="display:flex;flex-direction:column;width:100%;min-width:0;min-height:0;position:relative;overflow:hidden"');
  };

  /* 14) Shared Room Lock-In check-ins. Each participant writes a separate room
     message so their status never overwrites another member's focus session. */
  var NB_ROOM_FOCUS = { sessionId: null, dbId: null, roomId: null, busy: Promise.resolve() };
  async function nbWriteRoomFocus(status) {
    if (LOCK.mode !== 'room' || !LOCK.roomId || !dbClient) return;
    var room = (S.rooms || []).filter(function (item) { return String(item.id) === String(LOCK.roomId); })[0];
    if (!room || !room.isShared) { toast('Room Lock-In needs a joined shared room.'); return; }
    NB_ROOM_FOCUS.roomId = room.id;
    NB_ROOM_FOCUS.sessionId = NB_ROOM_FOCUS.sessionId || uid();
    var op = NB_ROOM_FOCUS.busy.catch(function () {}).then(async function () {
      var user = await nbRequireSupabaseUser();
      var membership = await dbClient.from('study_room_members').select('room_id').eq('room_id', room.id).eq('user_id', user.id).maybeSingle();
      if (membership.error) throw membership.error;
      if (!membership.data) throw new Error('Your account is not a member of the selected room.');
      var subject = subjectById(LOCK.subjectId);
      var payload = nbSharedPayload('shared-focus-session', {
        id: NB_ROOM_FOCUS.sessionId,
        userId: user.id,
        subjectId: LOCK.subjectId,
        subjectCode: subject && subject.code || '',
        subjectName: subject && subject.name || 'Study session',
        duration: Number(LOCK.duration || 0),
        secondsRemaining: Number(LOCK.left || 0),
        status: status,
        startedAt: LOCK.startedAt ? new Date(LOCK.startedAt).toISOString() : new Date().toISOString(),
        updatedAt: new Date().toISOString()
      });
      var result;
      if (NB_ROOM_FOCUS.dbId && NB_ROOM_FOCUS.roomId === room.id) {
        result = await dbClient.from('study_room_messages').update({ body: payload }).eq('id', NB_ROOM_FOCUS.dbId).eq('room_id', room.id).select('id').maybeSingle();
        if (result.error) throw result.error;
        if (!result.data) throw new Error('Could not update this room focus status. Check message UPDATE permissions.');
      } else {
        result = await dbClient.from('study_room_messages').insert({ room_id: room.id, user_id: user.id, body: payload }).select('id').single();
        if (result.error) throw result.error;
        NB_ROOM_FOCUS.dbId = result.data.id;
      }
      await nbLoadMessages(room, true);
    }).catch(function (error) {
      console.error('Room Lock-In sync failed', error);
      toast('Your personal timer is still running, but room status did not sync: ' + ((error && error.message) || 'Unknown error'));
    });
    NB_ROOM_FOCUS.busy = op;
    return op;
  }
  function nbRoomFocusCard(room) {
    var sessions = (room.messages || []).filter(function (message) {
      if (message.kind !== 'shared-focus-session') return false;
      var age = Date.now() - (Date.parse(message.updatedAt || message.startedAt || '') || 0);
      return age < 12 * 60 * 60 * 1000 && (message.status === 'active' || message.status === 'paused');
    }).sort(function (a, b) { return String(b.updatedAt || '').localeCompare(String(a.updatedAt || '')); });
    var body = sessions.length ? sessions.map(function (session) {
      var remaining = Math.max(0, Number(session.secondsRemaining || 0));
      var statusLabel = session.status === 'active' ? 'Focusing' : 'Paused';
      return '<div class="rowitem"><div class="grow minw"><p class="txm semi">' + esc(session.from || 'Room member') + '</p><p class="txs muted">' + esc(session.subjectCode || session.subjectName || 'Study session') + ' · ' + Math.ceil(remaining / 60) + ' min left</p></div><span class="badge">' + statusLabel + '</span></div>';
    }).join('') : '<p class="txs muted">No active or paused room focus sessions right now. Start Room Lock-In from a subject to share your status.</p>';
    return '<section class="card padc mt3"><h3 class="txm semi">Room Lock-In activity</h3><p class="txs muted mt1">Each member has their own timer and progress. Starting, pausing, and completing a session updates this room activity.</p><div class="fc g1 mt2">' + body + '</div></section>';
  }

  var nbOriginalRoomTabBodyWithFocus = roomTabBody;
  roomTabBody = function (room) {
    var html = nbOriginalRoomTabBodyWithFocus(room);
    if (room && room.isShared && UI.roomTab === 'info') return html + nbRoomFocusCard(room);
    return html;
  };

  var nbOriginalStartLock = startLock;
  startLock = function () {
    NB_ROOM_FOCUS = { sessionId: uid(), dbId: null, roomId: LOCK.roomId, busy: Promise.resolve() };
    nbOriginalStartLock();
    if (LOCK.mode === 'room') nbWriteRoomFocus('active');
  };
  var nbOriginalToggleLockRun = toggleLockRun;
  toggleLockRun = function () {
    nbOriginalToggleLockRun();
    if (LOCK.mode === 'room') nbWriteRoomFocus(LOCK.running ? 'active' : 'paused');
  };
  var nbOriginalResetLock = resetLock;
  resetLock = function () {
    var wasRoom = LOCK.mode === 'room';
    nbOriginalResetLock();
    if (wasRoom) nbWriteRoomFocus('reset');
  };
  var nbOriginalCompleteLock = completeLock;
  completeLock = function () {
    var wasRoom = LOCK.mode === 'room';
    nbOriginalCompleteLock();
    if (wasRoom) nbWriteRoomFocus('completed');
  };
  abandonLock = function () {
    confirmSheet({ title: 'Abandon this session?', message: 'Progress will not be logged to the subject.', confirmLabel: 'Abandon', onConfirm: function () {
      var wasRoom = LOCK.mode === 'room';
      LOCK.running = false; LOCK.phase = 'setup'; LOCK.left = LOCK.duration; LOCK._logged = false; persistLock(); render();
      if (wasRoom) nbWriteRoomFocus('cancelled');
    }});
  };

  /* 15) Realtime updates for multi-board whiteboards. */
  var NB_BOARD_CHANNEL = null;
  var NB_BOARD_CHANNEL_ROOM = null;
  function nbSubscribeBoards(roomId) {
    if (!dbClient || !roomId) return;
    if (NB_BOARD_CHANNEL_ROOM === roomId && NB_BOARD_CHANNEL) return;
    if (NB_BOARD_CHANNEL) { try { dbClient.removeChannel(NB_BOARD_CHANNEL); } catch (_) {} }
    NB_BOARD_CHANNEL_ROOM = roomId;
    NB_BOARD_CHANNEL = dbClient.channel('nb-boards-' + roomId)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'study_room_boards', filter: 'room_id=eq.' + roomId }, async function (payload) {
        if (NB_BOARD.drawing) return;
        try {
          await nbLoadRoomBoards(roomId);
          if (payload && payload.eventType !== 'UPDATE') {
            if (!nbBoardList(roomId).some(function (board) { return String(board.id) === String(NB_BOARD.activeBoardId); })) {
              NB_BOARD.activeBoardId = nbBoardList(roomId)[0] ? nbBoardList(roomId)[0].id : null;
            }
            var currentRoute = resolve();
            if (currentRoute.view === 'room' && currentRoute.id === roomId && UI.roomTab === 'board') render();
          } else if (NB_BOARD.roomId === roomId && !NB_BOARD.saving) {
            requestAnimationFrame(nbMountRoomBoard);
          }
        } catch (error) { console.warn('Realtime whiteboard update failed', error); }
      }).subscribe();
  }
  var nbPreviousAfterRenderForBoards = afterRender;
  afterRender = function (route) {
    nbPreviousAfterRenderForBoards(route);
    if (route && route.view === 'room' && UI.roomTab === 'board') nbSubscribeBoards(route.id);
    else if (NB_BOARD_CHANNEL && route && route.view !== 'room') {
      try { dbClient.removeChannel(NB_BOARD_CHANNEL); } catch (_) {}
      NB_BOARD_CHANNEL = null; NB_BOARD_CHANNEL_ROOM = null;
    }
  };

  /* 16) Mobile layout polish for the room work area and whiteboard fullscreen. */
  var nbRepairStyle = document.createElement('style');
  nbRepairStyle.id = 'nexbyte-repair-layer-style';
  nbRepairStyle.textContent = `
    .nb-room-content{position:relative;min-width:0;min-height:0;overflow:hidden}
    .nb-board-wrap{width:100%;box-sizing:border-box}
    .nb-board-wrap:fullscreen{width:100vw;height:100dvh;max-height:100dvh;overflow:auto;background:var(--bg);padding:12px;box-sizing:border-box}
    .nb-board-wrap:fullscreen .nb-board-canvas-wrap{flex:1;min-height:45vh;display:flex;align-items:center;justify-content:center}
    .nb-board-wrap:fullscreen #nbRoomBoard{max-height:calc(100dvh - 240px);width:auto;max-width:100%;height:auto}
    .nb-room-list .card{max-width:100%;overflow-wrap:anywhere}
    #noteEditor{font-size:16px!important;line-height:1.7;min-height:55vh}
    @media(max-width:640px){.nb-board-toolbar{grid-template-columns:repeat(2,minmax(0,1fr))}.nb-board-wrap{padding:8px}.nb-record-actions .btn{flex:1 1 auto}.nb-room-content>.nb-room-list{padding:10px}}
  `;
  document.head.appendChild(nbRepairStyle);

  // Do not silently claim that room focus/boards are available if migrations are missing.
  window.NEXBYTE_REPAIR_LAYER = '4.1';
  console.info('NEXTBYTE repair layer 4.0 loaded.');
})();

</script>
</body>
