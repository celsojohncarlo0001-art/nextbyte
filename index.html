<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#5B8DEF"/>
<title>NEXBYTE — Academic Collaboration Environment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F8FAFD;--fg:#0F172A;--card:#FFFFFF;--muted:#F1F5F9;--muted-fg:#64748B;
  --secondary:#F1F6FC;--border:#E3E9F2;--primary:#5B8DEF;--destructive:#EF4444;
  --purple:#A78BFA;--teal:#2DD4BF;--amber:#FBBF24;--coral:#FF7A7A;--mint:#34D399;
  --shell:#DCE3ED;
}
html.dark{
  --bg:#0B1220;--fg:#E8EEF7;--card:#141D2E;--muted:#1C2739;--muted-fg:#94A3B8;
  --secondary:#1C2739;--border:#243044;--shell:#070C15;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--fg);background:var(--shell);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.display{font-family:Poppins,Inter,system-ui,sans-serif;line-height:1.25}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
img{max-width:100%}

.wrap{min-height:100%;display:flex;justify-content:center}
.phone{position:relative;width:100%;max-width:430px;height:100vh;height:100dvh;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 60px rgba(15,23,42,.25)}
.main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;position:relative;min-height:0}
.main::-webkit-scrollbar,.hscroll::-webkit-scrollbar,.split-rail::-webkit-scrollbar{display:none}
.hscroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.pad{padding-left:20px;padding-right:20px}
.pb{padding-bottom:28px}
.pt{padding-top:24px}

.f{display:flex}.fc{display:flex;flex-direction:column}.aic{align-items:center}.jb{justify-content:space-between}.jc{justify-content:center}.wrapf{flex-wrap:wrap}
.g1{gap:4px}.g2{gap:8px}.g3{gap:12px}.g4{gap:16px}
.grow{flex:1}.minw{min-width:0}
.center{text-align:center}.right{text-align:right}
.mt1{margin-top:4px}.mt2{margin-top:8px}.mt3{margin-top:12px}.mt4{margin-top:16px}.mt5{margin-top:20px}.mt6{margin-top:24px}
.mb1{margin-bottom:4px}.mb2{margin-bottom:8px}.mb3{margin-bottom:12px}.mb4{margin-bottom:16px}
.txs{font-size:11px}.txm{font-size:13px}.txd{font-size:14px}.txl{font-size:16px}.txxl{font-size:20px}.tx2{font-size:24px}
.bold{font-weight:700}.semi{font-weight:600}.med{font-weight:500}
.muted{color:var(--muted-fg)}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pill{border-radius:999px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.hr{height:1px;background:var(--border)}
.hide{display:none!important}

.card{background:var(--card);border:1px solid var(--border);border-radius:22px}
.card.padc{padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:16px;font-weight:600;font-size:14px;transition:transform .12s ease}
.btn:active{transform:scale(.97)}
.btn-lg{height:56px}
.btn-sm{height:40px;border-radius:12px;font-size:13px;padding:0 14px}
.btn-primary{background:linear-gradient(90deg,#5B8DEF,#A78BFA);color:#fff;box-shadow:0 10px 24px rgba(91,141,239,.3)}
.btn-secondary{background:var(--secondary);color:var(--fg)}
.btn-danger{background:var(--destructive);color:#fff}
.btn-soft-danger{background:rgba(239,68,68,.1);color:var(--destructive);height:48px;border-radius:16px;width:100%;font-weight:600}
.btn-block{width:100%}
.btn-google{width:100%;height:52px;border:1px solid var(--border);background:var(--card);color:var(--fg);border-radius:15px;display:flex;align-items:center;justify-content:center;gap:11px;font-weight:600}
.btn-google:active{transform:scale(.98)}
.google-g{font-family:Arial,sans-serif;font-size:20px;font-weight:700;color:#4285F4}
.auth-divider{display:flex;align-items:center;gap:12px;color:var(--muted-fg);font-size:12px}
.auth-divider:before,.auth-divider:after{content:"";height:1px;background:var(--border);flex:1}
.chip{padding:6px 14px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--muted-fg);font-size:12px;font-weight:500;white-space:nowrap;transition:transform .12s}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.input{width:100%;height:44px;border-radius:14px;border:1px solid var(--border);background:var(--card);padding:0 12px;font-size:14px;outline:none}
.input:focus{border-color:var(--primary)}
textarea.input{height:auto;padding:12px;resize:none;line-height:1.55}
.field-label{font-size:11px;font-weight:600;color:var(--muted-fg);display:block;margin-bottom:4px}
.field{position:relative;display:flex;align-items:center;border:1px solid var(--border);border-radius:16px;background:var(--card)}
.field.err{border-color:var(--destructive)}
.field input{flex:1;background:none;border:none;outline:none;font-size:14px;padding:13px 12px 13px 40px;width:100%}
.field .lead{position:absolute;left:12px;color:var(--muted-fg)}
.errmsg{font-size:11px;color:var(--destructive);margin-top:4px;margin-left:4px}
.avatar{border-radius:999px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;flex-shrink:0}
.logo{background:linear-gradient(135deg,#5B8DEF,#A78BFA,#2DD4BF);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 12px 30px rgba(91,141,239,.35);border-radius:22px}
.searchbar{display:flex;align-items:center;gap:8px;height:44px;border-radius:16px;background:var(--card);border:1px solid var(--border);padding:0 12px}
.searchbar input{flex:1;background:none;border:none;outline:none;font-size:14px}
.iconbtn{display:flex;align-items:center;justify-content:center;height:36px;width:36px;border-radius:999px;background:var(--secondary);color:var(--muted-fg);transition:transform .12s}
.iconbtn:active{transform:scale(.94)}
.iconbtn.blue{background:var(--primary);color:#fff}
.badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px}
.pri-high{background:rgba(239,68,68,.12);color:#dc2626}
.pri-medium{background:rgba(251,191,36,.18);color:#b45309}
.pri-low{background:rgba(45,212,191,.18);color:#0f766e}
.bar{height:10px;border-radius:999px;background:var(--muted);overflow:hidden}
.bar>div{height:100%;border-radius:999px;transition:width .2s linear}
.seg{display:flex;background:var(--secondary);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;height:34px;border-radius:11px;font-size:12px;font-weight:600;color:var(--muted-fg);display:flex;align-items:center;justify-content:center;gap:5px}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 2px 8px rgba(15,23,42,.08)}

.theme-toggle{height:42px;width:42px;background:var(--card);border:1px solid var(--border);color:var(--muted-fg);box-shadow:0 4px 14px rgba(15,23,42,.08)}
.theme-toggle:active{transform:scale(.92)}
.welcome-theme{position:absolute;top:18px;right:20px;z-index:40}

.nav{flex-shrink:0;border-top:1px solid var(--border);background:var(--card);display:flex;padding:6px 2px calc(6px + env(safe-area-inset-bottom))}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted-fg);font-size:9px;font-weight:500;padding:2px 0}
.nav a .nic{display:flex;align-items:center;justify-content:center;height:32px;width:32px;border-radius:14px;transition:.18s}
.nav a.on{color:var(--fg)}
.nav a.on .nic{background:var(--primary);color:#fff;box-shadow:0 6px 16px rgba(91,141,239,.35)}

.topbar{position:sticky;top:0;z-index:25;display:flex;align-items:center;gap:8px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
.topbar.scrolled{border-bottom-color:var(--border)}
.streakbadge{display:flex;align-items:center;gap:4px;height:30px;padding:0 10px;border-radius:999px;background:linear-gradient(90deg,rgba(255,122,122,.15),rgba(251,191,36,.15));color:#E06C2B;font-size:11px;font-weight:700}
html.dark .streakbadge{color:#FBBF24}
.hdr{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:0 16px;height:56px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(12px)}
.tabs{display:flex;border-bottom:1px solid var(--border);background:var(--card);flex-shrink:0}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;font-size:11px;font-weight:500;color:var(--muted-fg);position:relative}
.tab.on{color:var(--primary)}
.tab .underline{position:absolute;bottom:0;height:2px;width:32px;border-radius:999px}

.welcome{position:relative;padding:40px 28px;display:flex;flex-direction:column;overflow:hidden}
.blob{position:absolute;border-radius:999px;filter:blur(48px)}
.b1{width:220px;height:220px;background:rgba(167,139,250,.4);top:-64px;right:-64px}
.b2{width:220px;height:220px;background:rgba(45,212,191,.35);top:160px;left:-80px}
.b3{width:190px;height:190px;background:rgba(91,141,239,.28);bottom:-20px;right:-20px}
.wcontent{position:relative;z-index:1;flex:1;display:flex;flex-direction:column}
.wtop{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.wtitle{font-size:38px;font-weight:800;letter-spacing:-.02em;background:linear-gradient(90deg,#5B8DEF,#A78BFA,#2DD4BF);-webkit-background-clip:text;background-clip:text;color:transparent;margin-top:22px}
.wtag{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--muted-fg);margin-top:4px}
.wdesc{font-size:15px;color:var(--muted-fg);margin-top:18px;max-width:300px}
.wgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;width:100%;max-width:320px;margin-top:34px}
.wfeat{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 0;border-radius:16px;background:color-mix(in srgb,var(--card) 80%,transparent);border:1px solid var(--border)}
.wfeat span:first-child{font-size:22px}
.wactions{display:flex;flex-direction:column;gap:12px;padding-top:24px}

.hero{padding:20px 20px 8px;background:linear-gradient(180deg,rgba(91,141,239,.1),transparent)}
.stat{display:flex;flex-direction:column;align-items:flex-start;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--border);text-align:left}
.stat .si{display:flex;align-items:center;justify-content:center;height:32px;width:32px;border-radius:12px;margin-bottom:4px}
.qbtn{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 0;border-radius:16px;background:var(--card);border:1px solid var(--border)}
.qbtn .qi{display:flex;align-items:center;justify-content:center;height:44px;width:44px;border-radius:16px}
.roomcard{min-width:200px;border-radius:22px;padding:16px;text-align:left;border:1px solid var(--border)}
.actrow{display:flex;align-items:center;gap:12px;padding:8px 0}
.actdot{display:flex;align-items:center;justify-content:center;height:32px;width:32px;border-radius:999px}
.actdot i{display:block;height:10px;width:10px;border-radius:999px}
.seeall{font-size:12px;color:var(--primary);font-weight:500;display:inline-flex;align-items:center;gap:2px}

.ring-wrap{position:relative;width:290px;height:290px;max-width:78vw;max-height:78vw}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-time{font-size:52px;font-weight:700;font-variant-numeric:tabular-nums;font-family:Poppins,Inter,sans-serif}
.playbtn{border-radius:999px;color:#fff;display:flex;align-items:center;justify-content:center;transition:transform .12s}
.playbtn:active{transform:scale(.94)}
.modebtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 0;border-radius:16px;border:1px solid var(--border);background:var(--card);color:var(--muted-fg);font-size:11px;font-weight:500}
.modebtn.on{color:#fff;border-color:transparent}

.subjcard{border-radius:22px;padding:16px;border:1px solid var(--border);background:var(--card);text-align:left;position:relative;overflow:hidden}
.subjcard .accent{position:absolute;left:0;top:0;bottom:0;width:5px}

.rowitem{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--border);width:100%;text-align:left}
.checkbox{display:flex;align-items:center;justify-content:center;height:24px;width:24px;border-radius:999px;border:2px solid var(--border);flex-shrink:0;transition:.15s}
.checkbox.on{background:var(--teal);border-color:var(--teal);color:#fff}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:56px 32px}
.empty .em{font-size:46px;margin-bottom:12px}

.kanban{display:flex;gap:12px;overflow-x:auto;padding:0 20px 8px;scrollbar-width:none;align-items:flex-start}
.kcol{min-width:250px;max-width:250px;background:var(--secondary);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:8px}
.kcol-head{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 6px}
.kdot{height:8px;width:8px;border-radius:999px}
.kcard{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px;text-align:left;width:100%}
.kcard:active{transform:scale(.98)}

.split{flex:1;display:flex;min-height:0}
.split-rail{width:150px;flex-shrink:0;border-right:1px solid var(--border);background:var(--card);display:flex;flex-direction:column;min-height:0}
.split-rail .rail-scroll{flex:1;overflow-y:auto;scrollbar-width:none}
.rail-item{display:block;width:100%;text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);position:relative}
.rail-item.on{background:color-mix(in srgb,var(--primary) 10%,transparent)}
.rail-item .stripe{position:absolute;left:0;top:0;bottom:0;width:3px}
.split-main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--secondary);color:var(--muted-fg)}
.autosave{font-size:10px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.autosave.saving{color:var(--amber)}
.autosave.saved{color:var(--mint)}

.room-tools{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border-top:1px solid var(--border);background:var(--card)}
.room-tools .chip{padding:7px 10px;font-size:11px}
.msg-link{display:inline-block;color:#2563eb;text-decoration:underline;overflow-wrap:anywhere}
.poll-card{padding:12px;border:1px solid var(--border);border-radius:14px;background:var(--secondary)}

.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:11px;height:11px;border-radius:3px;background:var(--muted);display:block}
.hl1{background:#DBEAFE!important}.hl2{background:#93C5FD!important}.hl3{background:#5B8DEF!important}.hl4{background:#3B6FD4!important}
html.dark .hl1{background:#1E3A5F!important}html.dark .hl2{background:#2C5282!important}html.dark .hl3{background:#5B8DEF!important}html.dark .hl4{background:#93C5FD!important}
.badgegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.badgecell{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:16px;background:var(--secondary);text-align:center}
.badgecell.locked{opacity:.4;filter:grayscale(1)}
.badgecell span:first-child{font-size:26px}

.pgroup{margin-top:24px;padding:0 20px}
.pgroup-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:0 4px;color:var(--muted-fg);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.pgroup-body{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:12px 16px}
.toggle{position:relative;height:28px;width:48px;border-radius:999px;background:var(--secondary);transition:.2s;flex-shrink:0}
.toggle.on{background:var(--primary)}
.toggle.purple.on{background:var(--purple)}
.toggle span{position:absolute;top:4px;left:4px;height:20px;width:20px;border-radius:999px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.toggle.on span{left:24px}
.prow{display:flex;align-items:center;justify-content:space-between;padding:8px 0}
.arow{display:flex;align-items:center;justify-content:space-between;width:100%;padding:10px 0;text-align:left}

.overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center}
.ov-bg{position:absolute;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(3px)}
.ov-sheet{position:relative;width:100%;max-width:430px;background:var(--card);border-radius:26px 26px 0 0;padding:24px 24px 32px;box-shadow:0 -10px 40px rgba(15,23,42,.3);max-height:88vh;overflow-y:auto;animation:up .28s cubic-bezier(.3,.9,.3,1)}
@keyframes up{from{transform:translateY(60px);opacity:.6}to{transform:translateY(0);opacity:1}}
.ov-handle{height:5px;width:40px;border-radius:999px;background:var(--border);margin:0 auto 16px}
.warn-ic{height:56px;width:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;background:rgba(239,68,68,.1);color:var(--destructive)}
.warn-ic.blue{background:rgba(91,141,239,.12);color:var(--primary)}
.swatch{height:36px;width:36px;border-radius:999px}
.swatch.on{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--fg)}
.emoji-pick{height:40px;width:40px;border-radius:14px;background:var(--secondary);display:flex;align-items:center;justify-content:center;font-size:18px}
.emoji-pick.on{background:rgba(91,141,239,.15);box-shadow:0 0 0 2px var(--primary)}

.search-overlay{position:fixed;inset:0;z-index:150;display:flex;justify-content:center;align-items:flex-start}
.search-bg{position:absolute;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(4px)}
.search-panel{position:relative;width:100%;max-width:430px;background:var(--card);border-radius:0 0 26px 26px;padding:16px 16px 20px;box-shadow:0 20px 50px rgba(15,23,42,.4);animation:down .24s cubic-bezier(.3,.9,.3,1);max-height:80vh;display:flex;flex-direction:column}
@keyframes down{from{transform:translateY(-30px);opacity:.5}to{transform:translateY(0);opacity:1}}
.sres{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;width:100%;text-align:left}
.sres:active{background:var(--secondary)}
.sgroup{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-fg);padding:12px 12px 4px}

.toasts{position:fixed;top:16px;left:0;right:0;z-index:300;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:#0F172A;color:#fff;font-size:13px;font-weight:500;padding:10px 18px;border-radius:14px;box-shadow:0 10px 30px rgba(15,23,42,.35);transition:opacity .3s,transform .3s;max-width:88vw;text-align:center}
.toast.out{opacity:0;transform:translateY(-8px)}

.lockin{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);z-index:40}
.lockin-strict{background:#05070D;color:#E8EEF7}

.msgs{display:flex;flex-direction:column;gap:12px;padding:16px;width:100%}
.msg{display:flex;align-items:flex-end;gap:8px;max-width:85%}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.them{align-self:flex-start}
.msg-content{display:flex;flex-direction:column;min-width:0;flex:1}
.msg.me .msg-content{align-items:flex-end}
.msg.them .msg-content{align-items:flex-start}
.msg-author{font-size:11px;color:var(--muted-fg);margin-bottom:2px;margin-left:4px}
.bubble{padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.4;word-break:break-word;white-space:pre-wrap;max-width:100%}
.msg.them .bubble{background:var(--card);border:1px solid var(--border);border-bottom-left-radius:4px;color:var(--fg)}
.msg.me .bubble{background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.msg-time{font-size:10px;color:var(--muted-fg);margin-top:4px;margin-left:4px;margin-right:4px}

function ic(n,s){s=s||20;return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+(ICONS[n]||'')+'</svg>';}
function icf(n,s){s=s||20;return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="currentColor" stroke="none">'+(ICONS[n]||'')+'</svg>';}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function logo(size){return '<div class="logo" style="width:'+size+'px;height:'+size+'px;border-radius:'+Math.round(size*.26)+'px">'+ic('grad',size*.55)+'</div>';}
function avatar(initials,color,size){return '<div class="avatar" style="width:'+size+'px;height:'+size+'px;background:'+color+';font-size:'+Math.round(size*.38)+'px">'+esc(initials)+'</div>';}
function themeToggleBtn(extraClass){var dark=S.theme==='dark';return '<button class="iconbtn theme-toggle'+(extraClass?' '+extraClass:'')+'" onclick="toggleTheme()" title="Theme" aria-label="Toggle color theme">'+ic(dark?'sun':'moon',19)+'</button>';}
function uid(){return Math.random().toString(36).slice(2,9);}
function clone(o){return JSON.parse(JSON.stringify(o));}
function fmtShort(s){s=Math.floor(s||0);var m=Math.floor(s/60),x=s%60;return m+':'+(x<10?'0':'')+x;}
function fmtSize(b){b=b||0;if(b<1024)return b+' B';if(b<1048576)return (b/1024).toFixed(1)+' KB';return (b/1048576).toFixed(1)+' MB';}

var KEY='nexbyte_v3';
var SUPABASE_URL=window.NEXBYTE_SUPABASE_URL||'';
var SUPABASE_ANON_KEY=window.NEXBYTE_SUPABASE_ANON_KEY||'';
var dbClient=(window.supabase&&SUPABASE_URL&&SUPABASE_ANON_KEY)?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}):null;

function defaultState(){return{
  auth:{isAuthenticated:false,user:null},theme:'light',
  notifications:{roomUpdates:true,taskReminders:true,chatMessages:true,weeklyProgress:false},
  settings:{defaultLength:25,strictDefault:false,chime:true,autoSave:true,theme:'light'},
  subjects:[],tasks:[],notes:[],rooms:[],activities:[],sessions:[],weekly:[],
  achievements:ACHIEVEMENTS.map(function(a){return Object.assign({},a,{unlocked:false});}),
  focus:{streak:0,bestStreak:0,lastStreakDate:null},
  offlineMusic:[],
  music:{active:'none',localId:null,spotifyUrl:'',spotifyEmbed:'',youtubeUrl:'',youtubeEmbed:'',playing:false}
};}
var S=defaultState(),saveTimer=null;
/* FIX 1: track unsaved notes globally so logout/clear can reset it */
var NOTE_DIRTY=false;

function profileFromUser(user){var md=user.user_metadata||{},name=md.full_name||user.email||'Student';var ini=name.split(/\s+/).map(function(p){return p[0]||'';}).join('').slice(0,2).toUpperCase()||'U';return {id:user.id,name:name,email:user.email||'',school:md.school||'',grade:md.grade||'',track:md.track||'',initials:ini,color:'#5B8DEF',avatar:ini,bio:md.bio||''};}

async function saveWorkspaceNow(){
  if(!dbClient||!S.auth.user||!S.auth.user.id){
    return {ok:false,error:new Error('You are not signed in or Supabase is not configured.')};
  }
  clearTimeout(saveTimer);
  try{
    var userId=S.auth.user.id;
    var payload=clone(S);
    payload.auth={isAuthenticated:true,user:S.auth.user};
    var result=await dbClient.from('user_workspaces').upsert(
      {user_id:userId,state:payload,updated_at:new Date().toISOString()},
      {onConflict:'user_id'}
    );
    if(result.error) throw result.error;
    return {ok:true};
  }catch(e){
    console.error('Workspace sync failed',e);
    return {ok:false,error:e};
  }
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify({theme:S.theme,settings:S.settings,notifications:S.notifications}));}catch(e){}
  if(!dbClient||!S.auth.user||!S.auth.user.id)return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async function(){
    var result=await saveWorkspaceNow();
    if(!result.ok) toast('Could not sync workspace. Check your connection and try saving again.');
  },350);
}

async function loadWorkspace(user){
  S=defaultState();
  S.auth={isAuthenticated:true,user:profileFromUser(user)};
  try{
    var {data,error}=await dbClient.from('user_workspaces').select('state').eq('user_id',user.id).maybeSingle();
    if(error)throw error;
    if(data&&data.state){
      var d=defaultState(),p=data.state;
      S=Object.assign(d,p);
      S.auth={isAuthenticated:true,user:profileFromUser(user)};
      S.notifications=Object.assign(d.notifications,p.notifications||{});
      S.settings=Object.assign(d.settings,p.settings||{});
      S.focus=Object.assign(d.focus,p.focus||{});
      S.music=Object.assign(d.music,p.music||{});
      S.offlineMusic=Array.isArray(p.offlineMusic)?p.offlineMusic:[];
    }
  }catch(e){console.error(e);toast('Could not load saved workspace. Check database setup.');}
  /* FIX 4: backfill session.date so the heatmap works for older accounts */
  if(Array.isArray(S.sessions)){
    var _todayISO=new Date().toISOString().slice(0,10);
    S.sessions=S.sessions.map(function(s){if(!s.date)s.date=_todayISO;return s;});
  }
  applyTheme();restoreIframes();render();
}

/* ============================================================
   AUTH BOOTSTRAP
   After restoring a session (including the one Supabase sets
   automatically when the OAuth redirect returns), navigate to
   /dashboard instead of leaving the user on /login or /welcome.
   ============================================================ */
async function bootstrapAuth(){
  if(!dbClient){render();return;}
  try{
    var result=await dbClient.auth.getSession();
    if(result.error)throw result.error;
    if(result.data&&result.data.session){
      await loadWorkspace(result.data.session.user);
      if(location.hash==='#/login'||location.hash==='#/welcome'||!location.hash)go('/dashboard');
    }else{
      S=defaultState();
      render();
    }
    dbClient.auth.onAuthStateChange(function(event,session){
      if(event==='SIGNED_OUT'){
        clearTimeout(saveTimer);clearTimeout(SAVE_TIMER);
        S=defaultState();NOTE_DIRTY=false;render();
      }else if(session&&event==='SIGNED_IN'){
        setTimeout(async function(){
          try{
            await loadWorkspace(session.user);
            if(location.hash==='#/login'||location.hash==='#/welcome'||!location.hash)go('/dashboard');
          }catch(e){console.error('Session restore failed',e);toast('Signed in, but the workspace could not be loaded.');}
        },0);
      }
    });
  }catch(e){
    console.error('Authentication bootstrap failed',e);
    toast('Could not restore your session. Please refresh or sign in again.');
    render();
  }
}

var MUSIC_DB=null;
function openMusicDB(){
  return new Promise(function(resolve,reject){
    if(MUSIC_DB) return resolve(MUSIC_DB);
    if(!('indexedDB' in window)) return reject(new Error('IndexedDB not available'));
    var req=indexedDB.open('nexbyte_music',1);
    req.onupgradeneeded=function(e){var db=e.target.result;if(!db.objectStoreNames.contains('files')){db.createObjectStore('files',{keyPath:'id'});}};
    req.onsuccess=function(e){MUSIC_DB=e.target.result;resolve(MUSIC_DB);};
    req.onerror=function(){reject(req.error);};
  });
}
function dbAdd(record){return openMusicDB().then(function(db){return new Promise(function(resolve,reject){var tx=db.transaction('files','readwrite');var req=tx.objectStore('files').add(record);req.onsuccess=function(){resolve(record);};req.onerror=function(){reject(req.error);};});});}
function dbGet(id){return openMusicDB().then(function(db){return new Promise(function(resolve,reject){var tx=db.transaction('files','readonly');var req=tx.objectStore('files').get(id);req.onsuccess=function(){resolve(req.result||null);};req.onerror=function(){reject(req.error);};});});}
function dbDelete(id){return openMusicDB().then(function(db){return new Promise(function(resolve,reject){var tx=db.transaction('files','readwrite');var req=tx.objectStore('files').delete(id);req.onsuccess=function(){resolve();};req.onerror=function(){reject(req.error);};});});}

var CURRENT_BLOB_URL=null;
function ensureMediaHost(){
  if(document.getElementById('nbMediaHost')) return;
  var host=document.createElement('div');
  host.id='nbMediaHost';
  host.innerHTML='<audio id="nbAudio" preload="metadata"></audio>'+
    '<iframe id="nbSpotify" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>'+
    '<iframe id="nbYoutube" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe>';
  document.body.appendChild(host);
  /* FIX 8: surface embed failures instead of showing a silent blank box */
  var _sp=host.querySelector('#nbSpotify');
  if(_sp){_sp.addEventListener('error',function(){toast('Spotify embed failed to load. Check the link or disable your ad blocker.');});}
  var _yt=host.querySelector('#nbYoutube');
  if(_yt){_yt.addEventListener('error',function(){toast('YouTube embed failed. The video may be private, region-locked, or have embedding disabled.');});}
  var a=host.querySelector('#nbAudio');
  a.addEventListener('play',function(){S.music.playing=true;updateMusicUI();});
  a.addEventListener('pause',function(){S.music.playing=false;updateMusicUI();});
  a.addEventListener('ended',function(){onLocalEnded();});
  a.addEventListener('timeupdate',updateProgressBars);
  a.addEventListener('loadedmetadata',updateProgressBars);
  window.addEventListener('resize',syncMediaHostPosition);
}
function restoreIframes(){
  var sp=document.getElementById('nbSpotify');var yt=document.getElementById('nbYoutube');
  if(sp&&S.music.spotifyEmbed&&sp.getAttribute('src')!==S.music.spotifyEmbed) sp.src=S.music.spotifyEmbed;
  if(yt&&S.music.youtubeEmbed&&yt.getAttribute('src')!==S.music.youtubeEmbed) yt.src=S.music.youtubeEmbed;
}
function syncMediaHostPosition(){
  var host=document.getElementById('nbMediaHost');if(!host) return;
  host.classList.remove('visible');
  if(S.music.active!=='spotify'&&S.music.active!=='youtube'){host.style.top='-9999px';host.style.left='-9999px';host.style.width='1px';host.style.height='1px';return;}
  var R=resolve();var holder=document.getElementById('mediaHolder');
  if(R.view!=='music'||!holder){host.style.top='-9999px';host.style.left='-9999px';host.style.width='1px';host.style.height='1px';return;}
  var r=holder.getBoundingClientRect();if(r.width<10||r.height<10) return;
  host.classList.add('visible');
  host.style.top=r.top+'px';host.style.left=r.left+'px';host.style.width=r.width+'px';host.style.height=r.height+'px';
}

function getAudio(){return document.getElementById('nbAudio');}
async function playLocalMusic(id){
  try{
    var rec=await dbGet(id);if(!rec){toast('File not found on this device. Re-add it.');return;}
    var audio=getAudio();if(!audio){toast('Audio engine not ready.');return;}
    var newUrl=URL.createObjectURL(rec.blob);
    audio.pause();audio.src=newUrl;audio.load();await audio.play();
    if(CURRENT_BLOB_URL)URL.revokeObjectURL(CURRENT_BLOB_URL);CURRENT_BLOB_URL=newUrl;
    S.music.active='local';S.music.localId=id;S.music.playing=true;save();render();
  }catch(e){toast('Could not play file: '+(e&&e.message?e.message:'unknown error'));}
}
function musicTogglePlay(){
  if(S.music.active==='local'){var a=getAudio();if(!a) return;if(a.paused){if(!a.src&&S.music.localId){playLocalMusic(S.music.localId);return;}a.play().catch(function(){});}else{a.pause();}}

/* ============================================================
   MEDIA URL PARSER
   Handles Spotify embeds + all common YouTube / YT Music URLs:
   watch, youtu.be (with list), Shorts, Live, Embed, playlists,
   music.youtube.com. Does NOT bypass Spotify playback rules.
   ============================================================ */
function parseMediaUrl(raw) {
  try {
    var u = new URL(String(raw || '').trim());
    var host = u.hostname.replace(/^www\./, '').toLowerCase();

    /* ---------- Spotify ---------- */
    if (host === 'open.spotify.com' || host === 'spotify.com') {
      var parts = u.pathname.split('/').filter(Boolean);
      if (parts[0] === 'embed' && parts[1] && parts[2]) return { type: 'spotify', embed: u.href };
      if (['track', 'album', 'playlist', 'episode', 'show'].indexOf(parts[0]) !== -1 && parts[1]) {
        return {
          type: 'spotify',
          embed: 'https://open.spotify.com/embed/' + parts[0] + '/' + encodeURIComponent(parts[1]) + '?utm_source=generator&theme=0'
        };
      }
      return null;
    }

    /* ---------- YouTube / YouTube Music ---------- */
    var isYouTube = host === 'youtube.com' || host === 'music.youtube.com' || host === 'm.youtube.com' || host === 'youtu.be';
    if (!isYouTube) return null;

    var videoId = '';
    var listId = u.searchParams.get('list') || '';

    if (host === 'youtu.be') videoId = u.pathname.split('/').filter(Boolean)[0] || '';
    else if (u.pathname === '/watch') videoId = u.searchParams.get('v') || '';
    else if (/^\/(shorts|live|embed)\//.test(u.pathname)) videoId = u.pathname.split('/')[2] || '';

    if (videoId) {
      if (!/^[A-Za-z0-9_-]{6,}$/.test(videoId)) return null;
      var embedVid = 'https://www.youtube.com/embed/' + videoId;
      if (listId) embedVid += '?list=' + encodeURIComponent(listId);
      return { type: 'youtube', embed: embedVid };
    }
    if (listId) return { type: 'youtube', embed: 'https://www.youtube.com/embed/videoseries?list=' + encodeURIComponent(listId) };
  } catch (e) {}
  return null;
}

async function addOfflineFiles(input){
  var files=input.files;
  if(!files||!files.length) return;
  var added=0;
  for(var i=0;i<files.length;i++){
    var f=files[i];
    var ext=(f.name.split('.').pop()||'').toLowerCase();
    var audioExtensions=['mp3','m4a','aac','wav','ogg','oga','opus','flac','weba','webm','aif','aiff','3gp'];
    var looksLikeAudio=(f.type&&f.type.indexOf('audio/')===0)||audioExtensions.indexOf(ext)!==-1;
    if(!looksLikeAudio){toast('Skipping unsupported file: '+f.name);continue;}
    try{
      var id='m_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
      await dbAdd({id:id,name:f.name,mime:f.type||'audio/'+ext,size:f.size,addedAt:Date.now(),blob:f});
      S.offlineMusic.push({id:id,name:f.name,mime:f.type||'audio/'+ext,size:f.size,addedAt:Date.now()});
      added++;
    }catch(e){console.error(e);toast('Storage error for '+f.name+': '+(e&&e.message?e.message:'unknown')+' — the file may be too large for this browser.');}
  }
  if(added){save();toast('Added '+added+' track'+(added===1?'':'s'));render();}
  input.value='';
}
async function deleteOfflineFile(id){
  var meta=S.offlineMusic.filter(function(x){return x.id===id;})[0];if(!meta) return;
  confirmSheet({title:'Remove track?',message:'"'+meta.name+'" will be deleted from this device.',onConfirm:async function(){
    if(S.music.active==='local'&&S.music.localId===id) stopMusic();
    try{await dbDelete(id);}catch(e){}
    S.offlineMusic=S.offlineMusic.filter(function(x){return x.id!==id;});
    save();toast('Track removed');render();
  }});
}

async function doGoogleLogin(){
  if(!dbClient){toast('Setup required: configure Supabase first.');return;}
  if(window.location.protocol==='file:'){toast('Google sign-in needs HTTPS or localhost.');return;}
  try{
    var result=await dbClient.auth.signInWithOAuth({
      provider:'google',
      options:{
        redirectTo:window.location.origin+window.location.pathname,
        queryParams:{prompt:'select_account'}
      }
    });
    if(result.error)toast('Google sign-in failed: '+result.error.message);
  }catch(err){
    toast('Google sign-in failed: '+(err&&err.message?err.message:'Please try again.'));
  }
}

async function doLogin(){
  var email=(document.getElementById('lgEmail')||{}).value||'';
  var pw=(document.getElementById('lgPw')||{}).value||'';
  email=email.trim();
  var e={};
  if(!email)e.email='Email is required';else if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))e.email='Enter a valid email';
  if(!pw)e.password='Password is required';
  UI.loginErr=e;if(Object.keys(e).length){render();return;}
  if(!dbClient){toast('Setup required: configure Supabase first.');return;}
  try{
    var r=await dbClient.auth.signInWithPassword({email:email,password:pw});
    if(r.error){UI.loginErr={password:r.error.message||'Could not sign in.'};render();return;}
    await loadWorkspace(r.data.user);
    toast('Signed in successfully');go('/dashboard');
  }catch(err){
    console.error('Login failed',err);
    UI.loginErr={password:'Unable to sign in right now. Check your connection and try again.'};
    render();
  }
}
async function doRegister(){
  var name=((document.getElementById('rgName')||{}).value||'').trim();
  var email=((document.getElementById('rgEmail')||{}).value||'').trim();
  var pw=(document.getElementById('rgPw')||{}).value||'';
  var cf=(document.getElementById('rgCf')||{}).value||'';
  var e={};
  if(!name)e.name='Full name is required';
  if(!email)e.email='Email is required';else if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))e.email='Enter a valid email';
  if(!pw||pw.length<8)e.password='Use at least 8 characters';
  if(cf!==pw)e.confirm='Passwords do not match';
  UI.regErr=e;if(Object.keys(e).length){render();return;}
  if(!dbClient){toast('Setup required: configure Supabase first.');return;}
  try{
    var r=await dbClient.auth.signUp({email:email,password:pw,options:{data:{full_name:name}}});
    if(r.error){UI.regErr={email:r.error.message||'Could not create account.'};render();return;}
    if(r.data.session&&r.data.user){await loadWorkspace(r.data.user);toast('Account created');go('/dashboard');}
    else{toast('Check your email to confirm your account, then log in.');go('/login');}
  }catch(err){
    console.error('Registration failed',err);
    UI.regErr={email:'Unable to register right now. Check your connection and try again.'};
    render();
  }

function subjectById(id){return S.subjects.filter(function(s){return s.id===id;})[0];}
function fmtTime(s){var m=Math.floor(s/60),x=s%60;return (m<10?'0':'')+m+':'+(x<10?'0':'')+x;}
function fmtHours(sec){var h=Math.floor(sec/3600),m=Math.round((sec%3600)/60);return h+'h '+(m<10?'0':'')+m+'m';}
function todayISO(){return new Date().toISOString().slice(0,10);}
function dueLabel(d){var today=todayISO();var t=new Date(today+'T00:00:00'),x=new Date(d+'T00:00:00');var diff=Math.round((x-t)/86400000);if(diff<0)return{text:Math.abs(diff)+'d overdue',over:true};if(diff===0)return{text:'Due today',over:false,today:true};if(diff===1)return{text:'Due tomorrow',over:false};if(diff<=7)return{text:'Due in '+diff+'d',over:false};return{text:x.toLocaleDateString('en-US',{month:'short',day:'numeric'}),over:false};}
function taskCounts(){var today=todayISO();return{all:S.tasks.length,todo:S.tasks.filter(function(t){return t.status==='todo';}).length,progress:S.tasks.filter(function(t){return t.status==='progress';}).length,done:S.tasks.filter(function(t){return t.status==='done';}).length,dueToday:S.tasks.filter(function(t){return t.status!=='done'&&t.dueDate===today;}).length,week:S.tasks.filter(function(t){var d=new Date(t.dueDate+'T00:00:00');var n=new Date();var diff=(d-n)/86400000;return t.status!=='done'&&diff>=0&&diff<=7;}).length,overdue:S.tasks.filter(function(t){return t.status!=='done'&&t.dueDate<today;}).length};}

/* FIX 3: heatmap driven by real session data */
function heatCells(n){
  var byDay={};
  (S.sessions||[]).forEach(function(s){
    if(!s.date||!s.seconds)return;
    byDay[s.date]=(byDay[s.date]||0)+s.seconds;
  });
  var out='';
  var today=new Date();
  for(var i=n-1;i>=0;i--){
    var d=new Date(today);
    d.setDate(today.getDate()-i);
    var iso=d.toISOString().slice(0,10);
    var sec=byDay[iso]||0;
    var lv=sec===0?0:sec<900?1:sec<1800?2:sec<3600?3:4;
    out+='<i class="'+(lv?'hl'+lv:'')+'" title="'+iso+' · '+Math.round(sec/60)+' min"></i>';
  }
  return out;
}

function vLockIn(subjectId){
  if(!LOCK.subjectId||LOCK.subjectId!==subjectId){LOCK.subjectId=subjectId;LOCK.duration=S.settings.defaultLength*60;LOCK.left=LOCK.duration;LOCK.strict=S.settings.strictDefault;LOCK.chime=S.settings.chime;LOCK.phase='setup';LOCK.running=false;LOCK.mode='solo';LOCK._logged=false;}
  var s=subjectById(subjectId);
  if(!s)return '<div class="lockin pad pt center txm muted">Subject not found.<br><button class="mt3 med" style="color:#5B8DEF" onclick="go(\'/study\')">Back</button></div>';
  if(LOCK.phase==='setup')return lockSetup(s);
  if(LOCK.phase==='running')return lockRunner(s);
  return lockDone(s);
}
function lockSetup(s){

n class="toggle'+(LOCK.chime?' on':'')+'" onclick="LOCK.chime=!LOCK.chime;render()"><span></span></button></div></div><div class="card padc f g3 aic"><span class="iconbtn" style="height:44px;width:44px;background:rgba(167,139,250,.15);color:#A78BFA">'+ic('headphones',20)+'</span><div class="grow minw"><p class="txs muted">Music</p><p class="txm semi trunc">'+(currentTrackName()||'Nothing playing')+'</p></div>'+(S.music.active==='local'?'<button class="playbtn" style="height:40px;width:40px;background:#A78BFA" onclick="musicTogglePlay()">'+(S.music.playing?icf('pause',16):icf('play',16))+'</button>':'<button class="playbtn" style="height:40px;width:40px;background:#A78BFA" onclick="go(\'/music\')">'+ic('chevR',16)+'</button>')+'</div><button class="btn btn-primary btn-lg btn-block" onclick="startLock()">'+ic('play',20)+' Start '+Math.round(LOCK.duration/60)+'-minute session</button></div></div>';
}
function lockRunner(s){
  var R=130,C=2*Math.PI*R;var pct=(LOCK.duration-LOCK.left)/LOCK.duration;var bg=LOCK.strict?'lockin lockin-strict':'lockin';
  return '<div class="'+bg+'"><div class="hdr" style="border-color:rgba(255,255,255,.06)"><div class="grow minw"><h1 class="txl semi trunc" style="color:'+s.color+'">'+esc(s.code)+' · '+esc(s.name)+'</h1><p class="txs muted">'+(LOCK.strict?'Strict Mode · ':'')+(LOCK.mode==='room'?'Room Focus':'Solo Lock-In')+'</p></div>'+(LOCK.strict?'':'<button class="iconbtn" onclick="abandonLock()">'+ic('x',18)+'</button>')+'</div><div class="main fc aic jc" style="padding:24px"><div class="ring-wrap"><svg viewBox="0 0 300 300"><circle cx="150" cy="150" r="'+R+'" fill="none" stroke="rgba(148,163,184,.22)" stroke-width="14"/><circle id="ring" cx="150" cy="150" r="'+R+'" fill="none" stroke="'+s.color+'" stroke-width="14" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C-pct*C)+'"/></svg><div class="ring-center"><span id="timerText" class="ring-time" style="color:'+s.color+'">'+fmtTime(LOCK.left)+'</span><span class="txs muted mt1">'+Math.round(LOCK.duration/60)+'-minute session</span></div></div><div class="f g4 aic mt6"><button class="iconbtn" style="height:56px;width:56px" onclick="resetLock()">'+ic('reset',22)+'</button><button class="playbtn" style="width:72px;height:72px;background:'+s.color+';box-shadow:0 10px 30px '+s.color+'55" onclick="toggleLockRun()">'+(LOCK.running?icf('pause',28):icf('play',28))+'</button><button class="iconbtn" style="height:56px;width:56px" onclick="'+(S.music.active==='local'?'musicTogglePlay()':'go(\'/music\')')+'">'+ic('headphones',22)+'</button></div><div class="card padc mt6" style="width:100%;max-width:340px"><div class="f g3 aic"><span class="iconbtn" style="background:rgba(167,139,250,.15);color:#A78BFA">'+ic('headphones',18)+'</span><div class="grow minw"><p class="txs muted">'+(currentTrackSub()||'Music')+'</p><p class="txm semi trunc">'+(currentTrackName()||'Nothing playing')+'</p></div>'+(S.music.active==='local'?'<button class="iconbtn" onclick="musicTogglePlay()">'+(S.music.playing?ic('pause',16):ic('play',16))+'</button>':'<button class="iconbtn" onclick="go(\'/music\')">'+ic('chevR',16)+'</button>')+'</div></div>'+(LOCK.strict?'<p class="txs muted mt5 center">Strict Mode active — stay with it until the timer ends.</p>':'')+'</div></div>';
}
function lockDone(s){
  var mins=Math.round(LOCK.duration/60);
  return '<div class="lockin"><div class="hdr"><div class="grow"><h1 class="txl semi">Session complete</h1></div></div><div class="main fc aic jc" style="padding:28px;text-align:center"><div style="font-size:56px">🎉</div><h2 class="tx2 bold mt3">Nice work!</h2><p class="txm muted mt2">Your '+mins+'-minute Lock-In was written to <span class="semi" style="color:'+s.color+'">'+esc(s.code)+'</span>.</p><div class="card padc mt5" style="width:100%;max-width:340px"><div class="f jb aic mb2"><span class="txs muted">Session length</span><span class="txm semi">'+mins+' min</span></div><div class="hr mb2"></div><div class="f jb aic mb2"><span class="txs muted">Total logged</span><span class="txm semi">'+fmtHours(s.loggedSeconds)+'</span></div><div class="hr mb2"></div><div class="f jb aic"><span class="txs muted">Course progress</span><span class="txm semi" style="color:'+s.color+'">'+s.progress+'%</span></div></div><div class="f g3 mt6" style="width:100%;max-width:340px"><button class="btn btn-secondary grow" onclick="lockAgain()">'+ic('reset',18)+' Again</button><button class="btn btn-primary grow" onclick="go(\'/study/'+s.id+'\')">Done</button></div></div></div>';

function setLockDuration(m){LOCK.duration=m*60;LOCK.left=m*60;render();}
function setLockMode(m){LOCK.mode=m;render();}
function startLock(){LOCK.phase='running';LOCK.left=LOCK.duration;LOCK.running=true;LOCK.startedAt=Date.now();LOCK._logged=false;persistLock();render();}
function toggleLockRun(){LOCK.running=!LOCK.running;persistLock();render();}
function resetLock(){LOCK.running=false;LOCK.left=LOCK.duration;persistLock();render();}
function abandonLock(){confirmSheet({title:'Abandon this session?',message:'Progress will not be logged to the subject.',confirmLabel:'Abandon',onConfirm:function(){LOCK.running=false;LOCK.phase='setup';LOCK.left=LOCK.duration;LOCK._logged=false;persistLock();render();}});}
function lockAgain(){LOCK.phase='setup';LOCK.left=LOCK.duration;LOCK.running=false;LOCK._logged=false;persistLock();render();}
function mountLock(){
  clearInterval(LOCK.interval);if(LOCK.phase!=='running'||!LOCK.running)return;
  var txt=document.getElementById('timerText'),ring=document.getElementById('ring');var R=130,C=2*Math.PI*R;
  LOCK.interval=setInterval(function(){
    LOCK.left--;
    if(LOCK.left<=0){LOCK.left=0;LOCK.running=false;clearInterval(LOCK.interval);completeLock();return;}
    if(txt)txt.textContent=fmtTime(LOCK.left);
    if(ring)ring.setAttribute('stroke-dashoffset',C-((LOCK.duration-LOCK.left)/LOCK.duration)*C);
    if(LOCK.left%5===0)persistLock();
  },1000);
}
/* FIX 3: guard against double logging + write date + per-day streak */
function completeLock(){
  var s=subjectById(LOCK.subjectId);
  if(!s)return;
  if(LOCK._logged)return;
  LOCK._logged=true;
  s.loggedSeconds+=LOCK.duration;
  s.progress=Math.min(100,Math.round((s.topics.length?s.topics.filter(function(t){return t.done;}).length/s.topics.length*100:0)+LOCK.duration/3600*2));
  var now=new Date();
  S.sessions.unshift({id:uid(),subjectId:s.id,seconds:LOCK.duration,mode:LOCK.mode,roomId:LOCK.roomId,date:now.toISOString().slice(0,10),time:'Today, '+now.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})});
  S.sessions=S.sessions.slice(0,60);
  logActivity('Logged '+Math.round(LOCK.duration/60)+' min to '+s.code,s.color);
  var today=now.toISOString().slice(0,10);
  if(S.focus.lastStreakDate!==today){
    S.focus.streak=Math.min(S.focus.streak+1,S.focus.bestStreak+1);
    if(S.focus.streak>S.focus.bestStreak)S.focus.bestStreak=S.focus.streak;
    S.focus.lastStreakDate=today;
  }
  save();LOCK.phase='done';
  if(LOCK.chime)toast('🔔 Session complete!');
  render();
}

function roomMessageHtml(m){

function shareRoomLink(id){var url=prompt('Paste the link to share:');if(!url)return;try{var u=new URL(url);if(!['http:','https:'].includes(u.protocol))throw 0;}catch(e){toast('Please enter a valid http/https link.');return;}pushRoomMessage(id,{kind:'link',text:'Shared link',url:url});}
function shareRoomFileLink(id){var url=prompt('Paste a share link for your file:');if(!url)return;try{var u=new URL(url);if(!['http:','https:'].includes(u.protocol))throw 0;}catch(e){toast('Please enter a valid http/https file link.');return;}pushRoomMessage(id,{kind:'file',text:'📎 Shared file',url:url});}

function leaveRoom(id){
 var r=S.rooms.filter(function(x){return x.id===id;})[0];
 if(!r){toast('Room not found.');return;}
 if(r.isShared&&r.ownerId&&String(r.ownerId)===String(nbCurrentUserId())){toast('You are the room owner. Delete the room from the Info tab if you want to close it for everyone.');return;}
 confirmSheet({title:'Leave this room?',message:"You'll need to rejoin to access this shared room again.",confirmLabel:'Leave',onConfirm:async function(){
  try{
   if(r.isShared){
    if(!dbClient||!nbCurrentUserId())throw new Error('Please sign in again before leaving this shared room.');
    var out=await dbClient.from('study_room_members').delete().eq('room_id',r.id).eq('user_id',nbCurrentUserId()).select('room_id');
    if(out.error)throw out.error;
    if(!out.data||!out.data.length)throw new Error('Membership was not removed. Check your Supabase DELETE policy for study_room_members.');
    S.rooms=S.rooms.filter(function(x){return x.id!==r.id;});
    if(NB_SHARED_CHANNEL){dbClient.removeChannel(NB_SHARED_CHANNEL);NB_SHARED_CHANNEL=null;}
    await nbLoadSharedRooms(true);
   }else{
    r.isJoined=false;r.members=r.members.filter(function(m){return m.name!==S.auth.user.name;});save();
   }
   toast('You left \"'+r.name+'\"');go('/rooms');
  }catch(e){console.error(e);toast('Could not leave room: '+nbErr(e,'Check your room membership permissions.'));}
 }});
}

ound:rgba(239,68,68,.1);color:#EF4444;height:34px" onclick="deleteNote(\''+n.id+'\')">'+ic('trash',14)+' Delete</button></div></div>';

/* ============================================================
   FIX 1: Notes save — keep in-memory note current while typing.
   Auto-save ON  → debounce persistence.
   Auto-save OFF → keep edits in memory, show a manual Save button,
   and warn beforeunload if unsaved. No silent data loss.
   ============================================================ */
var SAVE_TIMER=null;
var NOTE_EDIT_VERSION=0;
function _syncNoteFromDOM(){
  var n=S.notes.filter(function(x){return x.id===UI.activeNoteId;})[0];
  if(!n)return null;
  var t=document.getElementById('noteTitle');
  var c=document.getElementById('noteEditor');
  if(t)n.title=(t.value||'').trim()||'Untitled note';
  if(c)n.content=c.value;
  n.updatedAt='Just now';
  return n;
}
function ensureManualSaveButton(){
  if(document.getElementById('noteSaveBar'))return;
  var host=document.getElementById('saveState');
  if(!host||!host.parentNode)return;
  var btn=document.createElement('button');
  btn.id='noteSaveBar';
  btn.textContent='Save';
  btn.style.cssText='background:#5B8DEF;color:#fff;height:26px;padding:0 12px;border-radius:999px;font-size:11px;font-weight:600;margin-left:8px;flex-shrink:0';
  btn.onclick=manualSaveNote;
  host.parentNode.appendChild(btn);
}
async function manualSaveNote(){
  var n=_syncNoteFromDOM();if(!n)return;
  var saveVersion=NOTE_EDIT_VERSION;
  var st=document.getElementById('saveState');
  var btn=document.getElementById('noteSaveBar');
  if(st){st.className='autosave saving';st.innerHTML=ic('clock',12)+' Saving…';}
  if(btn){btn.disabled=true;btn.textContent='Saving…';}
  clearTimeout(SAVE_TIMER);
  var result=await saveWorkspaceNow();
  if(!result.ok){
    NOTE_DIRTY=true;
    if(st){st.className='autosave';st.innerHTML=ic('alert',12)+' Save failed';}
    if(btn){btn.disabled=false;btn.textContent='Retry save';}
    toast('Note was not saved to the cloud. Check your connection and retry.');
    return;
  }
  if(saveVersion===NOTE_EDIT_VERSION)NOTE_DIRTY=false;
  if(st){st.className='autosave saved';st.innerHTML=ic('check',12)+' Saved';}
  btn=document.getElementById('noteSaveBar');if(btn)btn.remove();
  var rail=document.getElementById('noteRail');if(rail)rail.innerHTML=railItems(filteredNotes());
  toast('Note saved');
}
function scheduleSave(){
  var n=_syncNoteFromDOM();
  if(!n)return;
  NOTE_EDIT_VERSION++;
  var scheduledVersion=NOTE_EDIT_VERSION;
  NOTE_DIRTY=true;
  var st=document.getElementById('saveState');
  if(!S.settings.autoSave){
    if(st){st.className='autosave';st.innerHTML=ic('edit',12)+' Unsaved changes';}
    ensureManualSaveButton();
    return;
  }
  if(st){st.className='autosave saving';st.innerHTML=ic('clock',12)+' Saving…';}
  clearTimeout(SAVE_TIMER);
  SAVE_TIMER=setTimeout(async function(){
    var again=_syncNoteFromDOM();if(!again)return;
    var result=await saveWorkspaceNow();
    if(!result.ok){
      NOTE_DIRTY=true;
      var failed=document.getElementById('saveState');
      if(failed){failed.className='autosave';failed.innerHTML=ic('alert',12)+' Save failed';}
      ensureManualSaveButton();
      toast('Autosave failed. Your edits are still here; use Save to retry.');
      return;
    }
    if(scheduledVersion===NOTE_EDIT_VERSION)NOTE_DIRTY=false;
    var s2=document.getElementById('saveState');
    if(s2){s2.className='autosave saved';s2.innerHTML=ic('check',12)+' Saved';}
    var btn=document.getElementById('noteSaveBar');if(btn)btn.remove();
    var rail=document.getElementById('noteRail');if(rail)rail.innerHTML=railItems(filteredNotes());
  },700);
}
window.addEventListener('beforeunload',function(e){
  if(!NOTE_DIRTY)return;
  e.preventDefault();e.returnValue='';
});

var NB_SHARED_PREFIX='nb_shared_';
var NB_SHARED_CHANNEL=null;
function nbErr(e, fallback){return (e&&e.message)||fallback||'Unknown error';}
function nbCurrentUserId(){return S&&S.auth&&S.auth.user&&S.auth.user.id;}
function nbRoomFromRow(row,members){
 var ms=(members||[]).map(function(m){var isMe=m.user_id===nbCurrentUserId();return {userId:m.user_id,name:isMe?(S.auth.user.name||'You'):'Member '+String(m.user_id).slice(0,8),initials:isMe?(S.auth.user.initials||'ME'):'M',color:isMe?(S.auth.user.color||'#5B8DEF'):'#A78BFA',role:m.role==='owner'?'Host':'Member'};});
 return {id:row.id,name:row.name,subjectTag:row.subject_tag||'Study group',emoji:row.emoji||'📘',color:row.color||'#5B8DEF',description:row.description||'Invite-only shared study room',isPrivate:true,isShared:true,inviteCode:row.invite_code,ownerId:row.owner_id,maxCapacity:row.max_capacity||8,status:'focus',round:1,timer:0,isJoined:true,members:ms,messages:[],tasks:[],sharedNote:'',polls:[],createdAt:row.created_at};
}
async function nbLoadSharedRooms(silent){
 if(!dbClient||!nbCurrentUserId())return;
 try{
  var mr=await dbClient.from('study_room_members').select('room_id,user_id,role,joined_at').eq('user_id',nbCurrentUserId());
  if(mr.error)throw mr.error;
  var ids=(mr.data||[]).map(function(x){return x.room_id;});
  S.rooms=S.rooms.filter(function(r){return !r.isShared;});
  if(!ids.length){if(!silent)render();return;}
  var rr=await dbClient.from('study_rooms').select('id,name,subject_tag,description,emoji,color,owner_id,invite_code,max_capacity,created_at').in('id',ids);
  if(rr.error)throw rr.error;
  var members=await dbClient.from('study_room_members').select('room_id,user_id,role').in('room_id',ids);
  if(members.error)throw members.error;
  S.rooms=(rr.data||[]).map(function(row){return nbRoomFromRow(row,(members.data||[]).filter(function(m){return m.room_id===row.id;}));}).concat(S.rooms);
  if(!silent)render();
 }catch(e){console.error('Shared room load failed',e);if(!silent)toast('Could not load shared rooms: '+nbErr(e));}
}
async function nbLoadMessages(room,quiet){
 if(!room||!room.isShared||!dbClient)return;
 try{
  var res=await dbClient.from('study_room_messages').select('id,room_id,user_id,body,created_at').eq('room_id',room.id).order('created_at',{ascending:true}).limit(300);
  if(res.error)throw res.error;
  var old=room.messages||[];
  room.messages=(res.data||[]).map(function(m){var me=m.user_id===nbCurrentUserId();var member=room.members.filter(function(x){return x.userId===m.user_id;})[0];return {id:m.id,from:me?(S.auth.user.name||'You'):(member?member.name:'Member '+m.user_id.slice(0,8)),initials:me?(S.auth.user.initials||'ME'):(member?member.initials:'M'),color:me?(S.auth.user.color||'#5B8DEF'):(member?member.color:'#A78BFA'),time:new Date(m.created_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),me:me,kind:'text',text:m.body};});
  if(!quiet)render();
 }catch(e){console.error('Shared messages load failed',e);if(!quiet)toast('Could not load room messages: '+nbErr(e));}
}
function nbSubscribeRoom(room){
 if(!dbClient||!room||!room.isShared)return;
 if(NB_SHARED_CHANNEL){try{dbClient.removeChannel(NB_SHARED_CHANNEL);}catch(e){}}
 NB_SHARED_CHANNEL=dbClient.channel('nb-room-'+room.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'study_room_messages',filter:'room_id=eq.'+room.id},function(){var r=S.rooms.filter(function(x){return x.id===room.id;})[0];if(r)nbLoadMessages(r,true).then(function(){if(resolve().view==='room'&&resolve().id===room.id)render();});}).subscribe();
}

go=function(path){nbOriginalGo(path);if(path==='/rooms'){setTimeout(function(){nbLoadSharedRooms(true);},0);}var match=String(path).match(/^\/room\/([0-9a-f-]{36})$/i);if(match){setTimeout(async function(){await nbLoadSharedRooms(true);var r=S.rooms.filter(function(x){return x.id===match[1];})[0];if(r&&r.isShared){await nbLoadMessages(r,true);nbSubscribeRoom(r);render();}},0);}};

vRooms=function(){var filters=[['live','Live'],['all','All Rooms'],['mine','Mine']];var mine=S.rooms.filter(function(r){return r.isJoined;});var h='<div class="pad pt" style="padding-top:20px;padding-bottom:12px"><div class="f jb aic"><div><h1 class="tx2 bold">Study Rooms</h1><p class="txm muted">'+mine.length+' joined · invite-only shared rooms</p></div><button class="btn btn-sm" style="background:#5B8DEF;color:#fff" onclick="openCreateRoom()">'+ic('plus',18)+' Create</button></div></div>';

 h+='<div class="pad"><div class="searchbar">'+ic('search',18)+'<input id="roomSearch" placeholder="Search your rooms…" oninput="filterRooms(this.value)"/></div></div><div class="pad mt3"><div class="seg">'+filters.map(function(f){return '<button class="'+(UI.roomFilter===f[0]?'on':'')+'" onclick="setRoomFilter(\''+f[0]+'\')">'+f[1]+'</button>';}).join('')+'</div></div><div class="pad mt4 pb" id="roomsList">'+roomCards()+'</div>';return h;};
var nbOriginalRoomCards=roomCards;
roomCards=function(q){q=(q||'').toLowerCase();var list=S.rooms.filter(function(r){if(UI.roomFilter==='live'&&r.status!=='focus')return false;if(UI.roomFilter==='mine'&&!r.isJoined)return false;return (r.name+' '+r.subjectTag).toLowerCase().indexOf(q)>=0;});if(!list.length)return '<div class="empty"><div class="em">👥</div><h3 class="txl semi mb1">No rooms found</h3><p class="txm muted">Create a room or join with an invite code.</p></div>';return '<div class="fc g3">'+list.map(function(r){return '<div class="card padc"><div class="f" style="align-items:flex-start;gap:12px"><span style="font-size:26px">'+esc(r.emoji)+'</span><div class="grow minw"><div class="f g2 aic"><p class="txm semi trunc">'+esc(r.name)+'</p><span class="txs muted">'+ic('lock',12)+'</span></div><p class="txs muted">'+esc(r.subjectTag)+(r.isShared?' · Shared':' · Personal')+'</p></div></div><p class="txs muted mt2">'+esc(r.description||'')+'</p><div class="f jb aic mt3"><span class="txs muted">'+ic('users',12)+' '+r.members.length+'/'+r.maxCapacity+'</span>'+(r.isJoined?'<button class="btn btn-sm" style="background:'+r.color+';color:#fff" onclick="go(\'/room/'+r.id+'\')">Open</button>':'<button class="btn btn-sm" onclick="joinRoom(\''+r.id+'\')">Join</button>')+'</div>'+(r.isShared&&r.ownerId===nbCurrentUserId()?'<p class="txs mt2"><b>Invite code:</b> <code>'+esc(r.inviteCode||'')+'</code> <button class="chip" onclick="navigator.clipboard.writeText(\''+esc(r.inviteCode||'')+'\').then(function(){toast(\'Invite code copied\')})">Copy</button></p>':'')+'</div>';}).join('')+'</div>';};
async function openCreateRoom(){if(!dbClient||!nbCurrentUserId()){toast('Sign in with Supabase to create a shared room.');return;}var name=prompt('Room name:');if(!name||!name.trim())return;var subject=prompt('Subject tag (e.g. Math, Science):','Study Group')||'Study Group';var description=prompt('Room description:','Invite-only study room')||'';var capacity=parseInt(prompt('Maximum members (2–100):','8'),10)||8;capacity=Math.max(2,Math.min(100,capacity));var emojis=['📘','🧠','📐','🔬','🎨','🔢','💻','⚛️'];var emoji=prompt('Choose an icon: '+emojis.join(' '),'📘')||'📘';var color='#5B8DEF';try{var res=await dbClient.from('study_rooms').insert({name:name.trim(),subject_tag:subject.trim(),description:description.trim(),emoji:emoji,color:color,owner_id:nbCurrentUserId(),max_capacity:capacity}).select('id,name,subject_tag,description,emoji,color,owner_id,invite_code,max_capacity,created_at').single();if(res.error)throw res.error;var mem=await dbClient.from('study_room_members').insert({room_id:res.data.id,user_id:nbCurrentUserId(),role:'owner'});if(mem.error){await dbClient.from('study_rooms').delete().eq('id',res.data.id);throw mem.error;}await nbLoadSharedRooms(true);var r=S.rooms.filter(function(x){return x.id===res.data.id;})[0];toast('Room created! Invite code: '+res.data.invite_code);alert('Room created successfully!\n\nInvite code: '+res.data.invite_code+'\n\nShare this code with the other account.');go('/room/'+res.data.id);}catch(e){console.error(e);toast('Could not create shared room: '+nbErr(e,'Check Supabase schema and RLS policies.'));}}
async function nbJoinByCode(){var input=document.getElementById('nbInviteCode');var code=(input&&input.value||'').trim().toUpperCase();if(!code){toast('Enter the invite code first.');return;}if(!dbClient||!nbCurrentUserId()){toast('Please sign in first.');return;}try{var result=await dbClient.rpc('join_study_room_by_code',{p_invite_code:code});if(result.error)throw result.error;var roomId=result.data;if(Array.isArray(roomId))roomId=roomId[0];if(roomId&&typeof roomId==='object')roomId=roomId.room_id||roomId.id;if(!roomId)throw new Error('Invite code did not return a room.');await nbLoadSharedRooms(true);var r=S.rooms.filter(function(x){return x.id===roomId;})[0];if(!r)throw new Error('Joined, but the room did not load. Check member SELECT policies.');toast('Joined shared room!');go('/room/'+roomId);}catch(e){console.error(e);toast('Could not join room: '+nbErr(e,'Check the invite code and room policies.'));}}
var nbOriginalJoinRoom=joinRoom;
joinRoom=function(id){var r=S.rooms.filter(function(x){return x.id===id;})[0];if(r&&r.isShared){go('/room/'+id);return;}return nbOriginalJoinRoom(id);};
var nbOriginalRoomTabBody=roomTabBody;
roomTabBody=function(r){if(r&&r.isShared&&UI.roomTab!=='chat'&&UI.roomTab!=='info'){return '<div class="empty"><div class="em">☁️</div><h3 class="txl semi mb1">Shared '+(UI.roomTab==='notes'?'notes':'tasks')+' not enabled</h3><p class="txm muted">Room chat is synchronized across members. Notes and tasks remain personal until shared tables are added.</p></div>';}return nbOriginalRoomTabBody(r);};
var nbOriginalSendRoomMsg=sendRoomMsg;
sendRoomMsg=async function(id){var r=S.rooms.filter(function(x){return x.id===id;})[0];var input=document.getElementById('roomMsg');var body=(input&&input.value||'').trim();if(!body)return;if(r&&r.isShared){if(!dbClient||!nbCurrentUserId()){toast('Please sign in again.');return;}input.value='';try{var out=await dbClient.from('study_room_messages').insert({room_id:r.id,user_id:nbCurrentUserId(),body:body});if(out.error)throw out.error;await nbLoadMessages(r,true);render();var sc=document.getElementById('scrollArea');if(sc)sc.scrollTop=sc.scrollHeight;}catch(e){console.error(e);if(input)input.value=body;toast('Message not sent: '+nbErr(e));}return;}return nbOriginalSendRoomMsg(id);};
var nbOriginalPushRoomMessage=pushRoomMessage;
pushRoomMessage=function(id,extra){var r=S.rooms.filter(function(x){return x.id===id;})[0];if(r&&r.isShared){if(extra&&extra.kind==='text'){sendRoomMsg(id);return;}toast('Only text chat is synced for shared rooms right now.');return;}return nbOriginalPushRoomMessage(id,extra);};
var nbOriginalLeaveRoom=leaveRoom;
leaveRoom=function(id){var r=S.rooms.filter(function(x){return x.id===id;})[0];if(r&&r.isShared){confirmSheet({title:'Leave this shared room?',message:'You will need the invite code to join again.',confirmLabel:'Leave',onConfirm:async function(){try{var out=await dbClient.from('study_room_members').delete().eq('room_id',id).eq('user_id',nbCurrentUserId());if(out.error)throw out.error;S.rooms=S.rooms.filter(function(x){return x.id!==id;});if(NB_SHARED_CHANNEL){dbClient.removeChannel(NB_SHARED_CHANNEL);NB_SHARED_CHANNEL=null;}toast('You left the room');go('/rooms');}catch(e){toast('Could not leave room: '+nbErr(e));}}});return;}return nbOriginalLeaveRoom(id);};
/* Load memberships after auth/workspace bootstrap, and on returning to rooms. */
var nbOriginalBootstrapAuth=bootstrapAuth;
bootstrapAuth=async function(){await nbOriginalBootstrapAuth();setTimeout(function(){nbLoadSharedRooms(true);},1200);if(dbClient){dbClient.auth.onAuthStateChange(function(event,session){if(session&&session.user){setTimeout(function(){nbLoadSharedRooms(true);},500);}else if(event==='SIGNED_OUT'){if(NB_SHARED_CHANNEL){dbClient.removeChannel(NB_SHARED_CHANNEL);NB_SHARED_CHANNEL=null;}}});}};

applyTheme();
ensureMediaHost();
if(!location.hash)location.hash='#/welcome';
bootstrapAuth();

async function deleteRoomAny(id){
 var room=S.rooms.filter(function(r){return r.id===id;})[0];
 if(!room){toast('Room not found. Refresh the room list and try again.');return;}
 var currentId=nbCurrentUserId();
 var isOwner=room.isShared ? (!!currentId && String(room.ownerId)===String(currentId)) : (!room.ownerId || String(room.ownerId)===String(S.auth.user.id));
 if(!isOwner){toast('Only the room creator can delete this room.');return;}
 if(room.isShared&&(!dbClient||!currentId)){toast('Please sign in again before deleting this shared room.');return;}
 confirmSheet({title:'Delete this room?',message:room.isShared?'This permanently deletes the shared room, its memberships, and all chat messages for everyone. This cannot be undone.':'This removes the room from your personal workspace. This cannot be undone.',confirmLabel:'Delete room',onConfirm:async function(){
  try{
   if(room.isShared){
    /* Request the deleted row back so an RLS denial/zero-row delete cannot look successful. */
    var out=await dbClient.from('study_rooms').delete().eq('id',id).eq('owner_id',currentId).select('id');
    if(out.error)throw out.error;
    if(!out.data||!out.data.length)throw new Error('No room was deleted. You may not be the owner, or Supabase DELETE permissions/RLS may be blocking this action.');
   }
   S.rooms=S.rooms.filter(function(r){return r.id!==id;});
   if(!room.isShared)save();
   if(NB_SHARED_CHANNEL&&room.isShared){dbClient.removeChannel(NB_SHARED_CHANNEL);NB_SHARED_CHANNEL=null;}
   toast('Room deleted.');go('/rooms');
  }catch(e){console.error(e);toast('Could not delete room: '+nbErr(e,'Check your room permissions and Supabase RLS policies.'));}
 }});
}

</script>
